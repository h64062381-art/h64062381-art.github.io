<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIWI — الكابتن والصالة</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:10;text-align:center}
h1{margin:0 0 10px;font-size:24px}
button{border:0;border-radius:11px;padding:11px 15px;font-size:16px;font-weight:800;cursor:pointer}
.header-btn{background:#fff;color:#111;margin:3px}
#status{padding:10px;text-align:center;color:#666;background:#fff}
.wrap{max-width:900px;margin:auto;padding:14px}
.section-title{font-size:20px;font-weight:900;margin:8px 0 12px}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.table-card{background:#fff;border:2px solid #ddd;border-radius:16px;padding:18px;text-align:center;box-shadow:0 2px 10px #0001}
.table-card.has-orders{border-color:#c9a45b}
.table-num{font-size:24px;font-weight:900}
.table-total{margin:8px 0;font-size:18px;font-weight:900}
.table-state{font-size:13px;color:#666;margin-bottom:10px}
.open-table{background:#111;color:#fff;width:100%}
.ready-section{margin-top:24px;display:none}
.ready-card{background:#fffdf5;border:2px solid #c9a45b;border-radius:15px;padding:15px;margin:10px 0}
.new-card{background:#fff;border-right:5px solid #16a34a;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0001}
.items{background:#fafafa;border-radius:10px;padding:10px;line-height:1.9;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:10px;margin:7px 0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:13px;font-weight:900;background:#eee}
.badge.ready{background:#c9a45b;color:#111}
.badge.served{background:#dfeee2;color:#173f2b}
.badge.new{background:#dcfce7;color:#166534}
.primary{background:#111;color:#fff;width:100%;margin-top:8px}
.green{background:#173f2b;color:#fff;width:100%;margin-top:8px}
.gold{background:#c9a45b;color:#111;width:100%;margin-top:8px}
.danger{background:#9b2c2c;color:#fff;width:100%;margin-top:8px}
.empty{text-align:center;color:#777;padding:35px 10px;background:#fff;border-radius:14px}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:100;padding:12px;overflow:auto}
.modal-box{max-width:760px;margin:20px auto;background:#f4f4f4;border-radius:18px;padding:14px}
.modal-head{background:#111;color:#fff;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:2}
.close{background:#fff;color:#111}
.order-card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:13px;margin:10px 0}
.total-box{background:#173f2b;color:#fff;border-radius:14px;padding:16px;margin:12px 0;text-align:center}
.total-box .big{font-size:27px;font-weight:900;margin-top:5px}
.bill-area{margin-top:12px;padding-top:12px;border-top:2px dashed #ccc}
.small{font-size:13px;color:#777}
.file-btn{display:none}
.invoice-modal{display:none;position:fixed;inset:0;background:#0009;z-index:200;padding:12px;overflow:auto}
.invoice-box{max-width:620px;margin:20px auto;background:#fff;border-radius:18px;padding:18px}
.invoice-head{text-align:center;font-size:24px;font-weight:900;padding:8px}
.invoice-table{text-align:center;font-weight:900;margin-bottom:12px}
.invoice-line{border-top:1px dashed #bbb;padding:12px 0}
.invoice-items{background:#f7f7f7;border-radius:9px;padding:8px;line-height:1.8;margin:7px 0}
.invoice-total{background:#173f2b;color:#fff;border-radius:12px;padding:15px;text-align:center;font-size:22px;font-weight:900;margin-top:12px}
.invoice-note{padding:10px 0}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyAQ9WanobYNjUbozIcWQrhDBCT82-RqMMU4",
authDomain:"kiwiresturant-30ff4.firebaseapp.com",
projectId:"kiwiresturant-30ff4",
storageBucket:"kiwiresturant-30ff4.firebasestorage.app",
messagingSenderId:"329950339210",
appId:"1:329950339210:web:bd072d9d7171a2d6ec4d73"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let allOrders=[];
let stop=null;
let currentTable=null;

function esc(v){
 return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function tableOf(o){ return String(o.table ?? o.table_number ?? o.tableNumber ?? '—'); }
function num(v){ const n=Number(v); return Number.isFinite(n)?n:0; }
function money(v){ return num(v).toLocaleString('en-US')+' د.ع'; }

function itemList(o){
 if(Array.isArray(o.items)) return o.items;
 if(Array.isArray(o.orderItems)) return o.orderItems;
 return [];
}
function orderTotal(o){
 if(o.total!==undefined && o.total!==null && !isNaN(Number(o.total))) return num(o.total);
 return itemList(o).reduce((s,x)=>s+num(x.price)*num(x.qty||x.quantity||1),0);
}
function itemText(o){
 const items=itemList(o);
 if(items.length) return items.map(x=>`${esc(x.name||x.title||'طلب')} × ${esc(x.qty||x.quantity||1)}`).join('<br>');
 return esc(o.order||o.items||'—');
}
function statusText(s){
 return s==='pending'?'🔔 طلب جديد':
        s==='approved'?'👍 مقبول':
        s==='preparing'?'🟡 قيد التحضير':
        s==='ready'?'🍽️ جاهز من المطبخ':
        s==='served'?'✅ تم الاستلام':'';
}

/* الطلبات التي تبقى في الصالة:
   pending = طلب جديد
   approved/preparing = الطلب مقبول/قيد التحضير
   ready = وصل من المطبخ
   served = استلمه الكابتن
   billed لا يظهر بعد رفع الفاتورة */
function listenOrders(){
 if(stop) stop();
 stop=db.collection('orders')
   .where('status','in',['pending','approved','preparing','ready','served'])
   .onSnapshot(snap=>{
      allOrders=snap.docs.map(d=>({id:d.id,...d.data()}));
      renderAll();
      document.getElementById('status').textContent='متصل — آخر تحديث: '+new Date().toLocaleTimeString('ar-IQ');
   },err=>{
      console.error(err);
      document.getElementById('status').textContent='تعذر جلب الطلبات. تأكد من اتصال Firebase.';
   });
}

function activeTables(){
 const map=new Map();
 allOrders.forEach(o=>{
   const t=tableOf(o);
   if(t==='—') return;
   if(!map.has(t)) map.set(t,[]);
   map.get(t).push(o);
 });
 return map;
}

function renderAll(){
 renderTables();
 renderReady();
 if(currentTable!==null) renderTableModal();
}

function renderTables(){
 const box=document.getElementById('tables');
 const map=activeTables();
 const keys=[...map.keys()].sort((a,b)=>Number(a)-Number(b));
 if(!keys.length){
   box.innerHTML='<div class="empty">ماكو طلبات حالياً بالطاولات</div>';
   return;
 }
 box.innerHTML=keys.map(t=>{
   const orders=map.get(t);
   const total=orders.reduce((s,o)=>s+orderTotal(o),0);
   const ready=orders.filter(o=>o.status==='ready').length;
   return `<div class="table-card has-orders">
      <div class="table-num">🪑 طاولة ${esc(t)}</div>
      <div class="table-total">${money(total)}</div>
      <div class="table-state">${orders.length} طلب${ready?` • ${ready} جاهز`:''}</div>
      <button class="open-table" onclick="openTable('${esc(t)}')">فتح الطاولة</button>
   </div>`;
 }).join('');
}

let readyOpen=false;

function toggleReady(){
 const ready=allOrders.filter(o=>o.status==='ready');
 if(!ready.length){
   alert('ماكو طلبات جاهزة من المطبخ حالياً.');
   return;
 }
 readyOpen=!readyOpen;
 document.getElementById('readySection').style.display=readyOpen?'block':'none';
}

function renderReady(){
 const sec=document.getElementById('readySection');
 const box=document.getElementById('readyOrders');
 const count=document.getElementById('readyCount');
 const ready=allOrders.filter(o=>o.status==='ready');
 count.textContent=ready.length?`(${ready.length})`:'';
 if(!ready.length){
   sec.style.display='none';
   readyOpen=false;
   box.innerHTML='';
   return;
 }
 sec.style.display=readyOpen?'block':'none';
 box.innerHTML=ready.map(o=>`
   <div class="ready-card">
     <div class="row"><b>🪑 الطاولة ${esc(tableOf(o))}</b><span class="badge ready">🍽️ جاهز</span></div>
     <div class="items">${itemText(o)}</div>
     <div class="row"><b>المجموع</b><b>${money(orderTotal(o))}</b></div>
     <button class="green" onclick="takeReady('${esc(o.id)}')">استلام الطلب</button>
   </div>
 `).join('');
}

function openTable(t){
 currentTable=String(t);
 document.getElementById('tableModal').style.display='block';
 document.body.style.overflow='hidden';
 renderTableModal();
}
function closeTable(){
 currentTable=null;
 document.getElementById('tableModal').style.display='none';
 document.body.style.overflow='';
}
function renderTableModal(){
 if(currentTable===null)return;
 const orders=allOrders.filter(o=>tableOf(o)===String(currentTable));
 const total=orders.reduce((s,o)=>s+orderTotal(o),0);
 document.getElementById('tableTitle').textContent='🪑 طاولة '+currentTable;
 document.getElementById('tableBody').innerHTML=orders.length?orders.map(o=>`
   <div class="order-card">
     <div class="row"><b>الطلب</b><span class="badge ${o.status==='ready'?'ready':o.status==='served'?'served':o.status==='pending'?'new':''}">${statusText(o.status)}</span></div>
     <div class="items">${itemText(o)}</div>
     <div class="row"><span>حساب الطلب</span><b>${money(orderTotal(o))}</b></div>
     ${o.status==='pending'?`<button class="primary" onclick="acceptOrder('${esc(o.id)}')">قبول الطلب</button>`:''}
     ${o.status==='ready'?`<button class="green" onclick="takeReady('${esc(o.id)}')">استلام الطلب</button>`:''}
   </div>
 `).join(''):'<div class="empty">ماكو طلبات بهالطاولة</div>';

 document.getElementById('tableTotal').innerHTML=`المجموع الكلي للطاولة<div class="big">${money(total)}</div>`;
 document.getElementById('billArea').innerHTML=orders.length?`
   <div class="bill-area">
     <button class="gold" onclick="showInvoice('${esc(currentTable)}')">🧾 إصدار الفاتورة</button>
   </div>`:'';
}

function showInvoice(table){
 const orders=allOrders.filter(o=>tableOf(o)===String(table));
 if(!orders.length){ alert('ماكو طلبات بهذه الطاولة.'); return; }
 const total=orders.reduce((s,o)=>s+orderTotal(o),0);
 const body=orders.map((o,i)=>`
   <div class="invoice-line">
     <div><b>طلب ${i+1}</b></div>
     <div class="invoice-items">${itemText(o)}</div>
     <div class="row"><span>حساب الطلب</span><b>${money(orderTotal(o))}</b></div>
   </div>
 `).join('');
 document.getElementById('invoiceTitle').textContent='🧾 فاتورة حساب — طاولة '+table;
 document.getElementById('invoiceContent').innerHTML=`
   <div class="invoice-head">KIWI RESTAURANT</div>
   <div class="invoice-table">طاولة ${esc(table)}</div>
   ${body}
   <div class="invoice-total">المجموع الكلي: ${money(total)}</div>
   <div class="small invoice-note">هذه فاتورة إلكترونية يتم إصدارها مباشرة من حساب الطاولة، بدون رفع صورة.</div>
   <button class="gold" onclick="issueInvoice('${esc(table)}')">✅ إصدار الفاتورة وإغلاق الحساب</button>
   <button class="primary" onclick="closeInvoice()">رجوع</button>
 `;
 document.getElementById('invoiceModal').style.display='block';
}

async function issueInvoice(table){
 const orders=allOrders.filter(o=>tableOf(o)===String(table));
 if(!orders.length){ alert('ماكو طلبات بهذه الطاولة.'); return; }

 const total=orders.reduce((s,o)=>s+orderTotal(o),0);
 if(!confirm('إصدار فاتورة بقيمة '+money(total)+' وإغلاق حساب الطاولة؟')) return;

 try{
   document.getElementById('status').textContent='جاري إصدار الفاتورة...';

   const invoiceNumber='INV-'+Date.now();
   const batch=db.batch();

   orders.forEach(o=>{
     batch.update(db.collection('orders').doc(o.id),{
       status:'billed',
       billUploaded:true,
       billType:'electronic',
       invoiceNumber:invoiceNumber,
       invoiceTable:String(table),
       invoiceTotal:total,
       invoiceItems:itemList(o),
       billedAt:firebase.firestore.FieldValue.serverTimestamp()
     });
   });

   // حفظ فاتورة إلكترونية واحدة للطاولة
   batch.set(db.collection('invoices').doc(invoiceNumber),{
     invoiceNumber:invoiceNumber,
     table:String(table),
     total:total,
     orders:orders.map(o=>({
       orderId:o.id,
       total:orderTotal(o),
       items:itemList(o),
       status:o.status
     })),
     createdAt:firebase.firestore.FieldValue.serverTimestamp(),
     type:'electronic'
   });

   await batch.commit();

   alert('تم إصدار الفاتورة وحفظها مباشرة ✅\nرقم الفاتورة: '+invoiceNumber);
   closeInvoice();
   closeTable();
 }catch(e){
   console.error(e);
   alert('تعذر إصدار الفاتورة: '+(e.message||'خطأ'));
   document.getElementById('status').textContent='تعذر إصدار الفاتورة';
 }
}


function closeInvoice(){
 document.getElementById('invoiceModal').style.display='none';
}

async function acceptOrder(id){
 try{
   await db.collection('orders').doc(id).update({
     status:'approved',
     approvedAt:firebase.firestore.FieldValue.serverTimestamp()
   });
 }catch(e){
   alert('تعذر قبول الطلب: '+(e.message||'خطأ'));
 }
}

async function takeReady(id){
 try{
   await db.collection('orders').doc(id).update({
     status:'served',
     captainReceivedAt:firebase.firestore.FieldValue.serverTimestamp()
   });
 }catch(e){
   alert('تعذر استلام الطلب: '+(e.message||'خطأ'));
 }
}

function refresh(){ renderAll(); }

listenOrders();
</script>
</head>
<body>
<header>
 <h1>KIWI — الكابتن</h1>
 <button class="header-btn" onclick="refresh()">🔄 تحديث</button>
 <button class="header-btn" onclick="toggleReady()">🍽️ الجاهز من المطبخ <span id="readyCount"></span></button>
</header>

<div id="status">جاري الاتصال...</div>

<main class="wrap">
 <div class="section-title">🪑 الصالة — الطاولات</div>
 <div id="tables" class="tables"></div>

 <section id="readySection" class="ready-section" style="display:none">
   <div class="section-title">🍽️ طلبات جاهزة من المطبخ</div>
   <div id="readyOrders"></div>
 </section>
</main>

<div id="invoiceModal" class="invoice-modal" onclick="if(event.target===this)closeInvoice()">
 <div class="invoice-box">
   <div class="modal-head">
     <b id="invoiceTitle">🧾 فاتورة الحساب</b>
     <button class="close" onclick="closeInvoice()">إغلاق ✕</button>
   </div>
   <div id="invoiceContent"></div>
 </div>
</div>

<div id="tableModal" class="modal" onclick="if(event.target===this)closeTable()">
 <div class="modal-box">
   <div class="modal-head">
     <b id="tableTitle">🪑 الطاولة</b>
     <button class="close" onclick="closeTable()">إغلاق ✕</button>
   </div>
   <div id="tableBody"></div>
   <div id="tableTotal" class="total-box"></div>
   <div id="billArea"></div>
 </div>
</div>
</body>
</html>
