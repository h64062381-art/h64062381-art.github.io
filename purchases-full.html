<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المشتريات المتكاملة</title><script src="kiwi-restaurant-engine.js"></script><style>body{background:#0b0d10;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1100px;margin:auto}.card{background:#15181d;border:1px solid #292e35;border-radius:15px;padding:15px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{padding:11px;border-radius:9px;border:1px solid #343a43;background:#0e1115;color:#fff;width:100%;box-sizing:border-box}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff}@media(max-width:700px){.form{grid-template-columns:1fr 1fr}}@media(max-width:450px){.form{grid-template-columns:1fr}}</style><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>🛒 المشتريات المتكاملة</h1><div class="card"><div class="form"><label>رقم الفاتورة<input id="inv"></label><label>المورد<select id="sup"></select></label><label>الصنف المخزني<select id="item"></select></label><label>المستودع<select id="wh"></select></label><label>الكمية<input id="qty" type="number" step=".01"></label><label>تكلفة الوحدة<input id="cost" type="number" step=".01"></label><label>المدفوع<input id="paid" type="number" step=".01"></label><label>ملاحظات<input id="note"></label><button onclick="save()">حفظ وترحيل للمخزون</button></div></div><div class="card"><table><thead><tr><th>الفاتورة</th><th>المورد</th><th>الصنف</th><th>الكمية</th><th>الإجمالي</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>function fill(){sup.innerHTML='<option value="">اختر</option>'+KIWI_ERP_V2.read('suppliers').map(x=>`<option value="${x.id}">${KIWI_ERP_V2.esc(x.name)}</option>`).join('');item.innerHTML='<option value="">اختر</option>'+KIWI_ERP_V2.read('items').map(x=>`<option value="${x.id}">${KIWI_ERP_V2.esc(x.name)}</option>`).join('');wh.innerHTML=KIWI_ERP_V2.read('warehouses').map(x=>`<option value="${x.id}">${KIWI_ERP_V2.esc(x.name)}</option>`).join('')}function save(){let i=KIWI_ERP_V2.read('items').find(x=>x.id===item.value),s=KIWI_ERP_V2.read('suppliers').find(x=>x.id===sup.value);if(!i||!s||!qty.value)return alert('اختر المورد والصنف وأدخل الكمية');KIWI_ERP_V2.purchase({invoice:inv.value||'PUR-'+Date.now(),supplierId:s.id,supplier:s.name,itemId:i.id,item:i.name,warehouseId:wh.value,qty:+qty.value,unitCost:+cost.value||+i.cost||0,paid:+paid.value||0,note:note.value});inv.value=qty.value=cost.value=paid.value=note.value='';fill();render();alert('تم الحفظ وزيادة المخزون')}function render(){rows.innerHTML=KIWI_ERP_V2.read('purchases').slice().reverse().map(x=>`<tr><td>${KIWI_ERP_V2.esc(x.invoice)}</td><td>${KIWI_ERP_V2.esc(x.supplier)}</td><td>${KIWI_ERP_V2.esc(x.item)}</td><td>${x.qty}</td><td>${KIWI_ERP_V2.money(x.total)}</td><td>${new Date(x.createdAt).toLocaleString('ar-IQ')}</td></tr>`).join('')||'<tr><td colspan=6>لا توجد مشتريات</td></tr>'}fill();render();</script></html>
