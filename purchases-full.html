<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | 🛒 المشتريات — مرتبطة بالمخزون والمحاسبة</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="kiwi-erp-unified.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font-family:Arial,Tahoma}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#15181d;border:1px solid #292e35;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}label{font-size:12px;color:#b8bec7}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #343a43;background:#0e1115;color:#fff}button{cursor:pointer;font-weight:700;background:#e8e8e8;color:#111}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff;text-decoration:none}.stat b{display:block;font-size:23px;margin-top:5px}.msg{padding:10px;border-radius:10px;background:#171b21;margin:10px 0}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>🛒 المشتريات — مرتبطة بالمخزون والمحاسبة</h1><div class="card"><div class="form"><label>رقم الفاتورة<input id="inv"></label><label>المورد<select id="sup"></select></label><label>الصنف المخزني<select id="item"></select></label><label>الكمية<input id="qty" type="number" step=".01"></label><label>تكلفة الوحدة<input id="cost" type="number" step=".01"></label><label>المدفوع<input id="paid" type="number" step=".01"></label><button onclick="save()">حفظ وترحيل</button></div><div id="msg" class="msg"></div></div><div class="card"><table><thead><tr><th>الفاتورة</th><th>المورد</th><th>الصنف</th><th>الكمية</th><th>الإجمالي</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let items=[],sups=[],ps=[]; KIWI_UNIFIED.inv.onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));item.innerHTML='<option value="">اختر الصنف</option>'+items.map(x=>`<option value="${x.id}">${KIWI_UNIFIED.esc(x.name)} — المتوفر ${x.qty||0}</option>`).join('')}); KIWI_UNIFIED.sup.onSnapshot(s=>{sups=s.docs.map(d=>({id:d.id,...d.data()}));sup.innerHTML='<option value="">اختر المورد</option>'+sups.map(x=>`<option value="${x.id}">${KIWI_UNIFIED.esc(x.name)}</option>`).join('')}); KIWI_UNIFIED.purchases.orderBy('createdAt','desc').onSnapshot(s=>{ps=s.docs.map(d=>({id:d.id,...d.data()}));render()}); async function save(){let i=items.find(x=>x.id===item.value),s=sups.find(x=>x.id===sup.value),q=+qty.value||0,c=+cost.value||+i?.price||0;if(!i||!s||q<=0)return msg.textContent='اختر المورد والصنف وأدخل الكمية';let total=q*c;let ref=KIWI_UNIFIED.purchases.doc();await db.runTransaction(async tx=>{let ir=db.collection('inventory').doc(i.id),snap=await tx.get(ir),before=Number(snap.data().qty||0),after=before+q;tx.update(ir,{qty:after,price:c,updatedAt:KIWI_UNIFIED.ts()});tx.set(ref,{invoice:inv.value||'PUR-'+Date.now(),supplierId:s.id,supplier:s.name,itemId:i.id,item:i.name,qty:q,unitCost:c,total,paid:+paid.value||0,createdAt:KIWI_UNIFIED.ts()});let m=db.collection('stock_movements').doc();tx.set(m,{type:'purchase',referenceId:ref.id,inventoryId:i.id,quantity:q,beforeQty:before,afterQty:after,unitCost:c,value:total,createdAt:KIWI_UNIFIED.ts(),source:'kiwi-unified'});let j=db.collection('journal_entries').doc('PUR-'+ref.id);tx.set(j,{referenceType:'purchase',referenceId:ref.id,lines:[{account:'1300',debit:total,credit:0},{account:(+paid.value||0)>=total?'1100':'2100',debit:0,credit:total}],totalDebit:total,totalCredit:total,createdAt:KIWI_UNIFIED.ts()})});await KIWI_UNIFIED.audit('purchase','purchases',ref.id,{total,item:i.name,supplier:s.name});msg.textContent='تم الحفظ وزيادة المخزون';inv.value=qty.value=cost.value=paid.value='';} function render(){rows.innerHTML=ps.map(x=>`<tr><td>${KIWI_UNIFIED.esc(x.invoice)}</td><td>${KIWI_UNIFIED.esc(x.supplier)}</td><td>${KIWI_UNIFIED.esc(x.item)}</td><td>${x.qty}</td><td>${KIWI_UNIFIED.money(x.total)}</td><td>${KIWI_UNIFIED.date(x.createdAt)}</td></tr>`).join('')||'<tr><td colspan=6>لا توجد مشتريات</td></tr>'}</script></body></html>
