<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | صندوق الكاشير</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f5f5;font-family:Arial,Tahoma,sans-serif}header{padding:18px 20px;background:#15181d;border-bottom:1px solid #2a2f36;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}.sub{color:#9da5af;font-size:12px;margin-top:4px}main{max-width:1200px;margin:20px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:#15181d;border:1px solid #292e35;border-radius:16px;padding:15px}.stat b{display:block;font-size:25px;margin-top:6px}label{font-size:12px;color:#b8bec7;display:block;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #343a43;background:#0e1115;color:#fff;outline:none}textarea{min-height:80px;resize:vertical}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}.wide{grid-column:span 2}button{border:0;border-radius:10px;padding:11px 14px;background:#e8e8e8;color:#111;font-weight:700;cursor:pointer}button.alt{background:#252a31;color:#fff}button.danger{background:#8e2630;color:#fff}button.good{background:#1f7a52;color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid #282d34;text-align:right;font-size:13px}th{color:#aeb5bf;background:#12151a;position:sticky;top:0}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#252a31;font-size:11px}.msg{padding:10px;border-radius:10px;background:#161a20;color:#aeb5bf;margin:10px 0}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:520px){.grid,.form{grid-template-columns:1fr}.wide{grid-column:span 1}}a{color:#fff;text-decoration:none}
button:disabled{opacity:.55;cursor:not-allowed}button{transition:transform .12s ease,opacity .12s ease}button:not(:disabled):active{transform:scale(.98)}.statusbar{margin:10px 0;padding:10px 12px;border-radius:10px;background:#161a20;color:#bfc6cf;display:none}.statusbar.show{display:block}.statusbar.ok{color:#8ee0b5}.statusbar.err{color:#ff9ea6}</style></head><body><noscript><div style="padding:15px;background:#8e2630;color:#fff;text-align:center">يرجى تفعيل JavaScript لاستخدام النظام.</div></noscript><header><div><h1>KIWI | صندوق الكاشير</h1></div><div class="actions"><a href="systems.html"><button class="alt">كل الأنظمة</button></a><a href="admin.html"><button class="alt">لوحة المدير</button></a></div></header><main><div id="statusbar" class="statusbar"></div><div class="grid"><div class="card stat">الرصيد الافتتاحي<b id="c1">0</b></div><div class="card stat">إجمالي الداخل<b id="c2">0</b></div><div class="card stat">إجمالي الخارج<b id="c3">0</b></div><div class="card stat">الرصيد الحالي<b id="c4">0</b></div></div>
<div class="card"><div class="form"><div><label>نوع الحركة</label><select id="type"><option value="in">داخل</option><option value="out">خارج</option></select></div><div><label>المبلغ</label><input id="amount" type="number" step="0.01"></div><div><label>البيان</label><input id="title"></div><div><label>المرجع</label><input id="ref"></div><div><label>التاريخ</label><input id="date" type="date"></div><div class="wide"><label>ملاحظات</label><input id="notes"></div><div><button class="good" onclick="save()">تسجيل الحركة</button></div></div></div>
<div class="card" style="margin-top:14px"><div class="toolbar"><input id="search" placeholder="بحث بالحركة أو البيان..." oninput="render()"><div class="actions"><button class="alt" onclick="setOpening()">تعيين رصيد افتتاحي</button><button class="alt" onclick="closeDay()">إغلاق يوم الصندوق</button><button class="alt" onclick="exportCSV()">تصدير CSV</button></div></div><div class="tablewrap"><table><thead><tr><th>النوع</th><th>المبلغ</th><th>البيان</th><th>المرجع</th><th>التاريخ</th><th>الوقت</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd0721a2d6ec4d73",measurementId:"G-K916WX9ZH8"};</script><script>
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();firebase.auth().signInAnonymously().catch(e=>console.warn(e));
const $=id=>document.getElementById(id);const status=(msg,ok=true)=>{const e=$("statusbar");if(!e)return;e.textContent=msg;e.className="statusbar show "+(ok?"ok":"err");clearTimeout(window.__st);window.__st=setTimeout(()=>e.className="statusbar",3500)};const money=n=>Number(n||0).toLocaleString("en-US")+" د.ع";
const dateStr=v=>v?.toDate?v.toDate().toLocaleString("ar-IQ"):new Date(v||Date.now()).toLocaleString("ar-IQ");
<script>let data=[],opening=0;const col=db.collection("cashbox");$("date").value=new Date().toISOString().slice(0,10);
db.collection("system_settings").doc("cashbox").onSnapshot(s=>{opening=s.exists?(s.data().opening||0):0;render()});col.orderBy("createdAt","desc").onSnapshot(s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));render()});
async function save(){let x={type:$("type").value,amount:+$("amount").value||0,title:$("title").value.trim(),ref:$("ref").value.trim(),date:$("date").value,notes:$("notes").value.trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp()};if(!x.amount||!x.title)return status("أدخل البيان والمبلغ",false);try{await col.add(x);clear();status("تم تسجيل حركة الصندوق")}catch(e){status("تعذر تسجيل الحركة: "+e.message,false)}}
function clear(){["amount","title","ref","notes"].forEach(x=>$(x).value="")}
function render(){let q=$("search").value.toLowerCase(),a=data.filter(x=>(x.title+" "+x.ref).toLowerCase().includes(q));let ins=data.filter(x=>x.type=="in").reduce((s,x)=>s+(+x.amount||0),0),outs=data.filter(x=>x.type=="out").reduce((s,x)=>s+(+x.amount||0),0);$("c1").textContent=money(opening);$("c2").textContent=money(ins);$("c3").textContent=money(outs);$("c4").textContent=money(opening+ins-outs);$("rows").innerHTML=a.map(x=>`<tr><td><span class="tag">${x.type=="in"?"داخل":"خارج"}</span></td><td>${money(x.amount)}</td><td>${esc(x.title)}</td><td>${esc(x.ref||"")}</td><td>${esc(x.date)}</td><td>${dateStr(x.createdAt)}</td><td><button class="danger" onclick="del('${x.id}')">حذف</button></td></tr>`).join("")||"<tr><td colspan=7>لا توجد حركات</td></tr>"}
async function setOpening(){let v=prompt("الرصيد الافتتاحي للصندوق:",opening);if(v===null)return;v=Number(v);if(!Number.isFinite(v)||v<0)return status("أدخل رصيداً صحيحاً",false);try{await db.collection("system_settings").doc("cashbox").set({opening:v,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});status("تم تحديث الرصيد الافتتاحي")}catch(e){status("تعذر تحديث الرصيد: "+e.message,false)}}
async function closeDay(){if(!confirm("إغلاق يوم الصندوق وتسجيل الرصيد الحالي؟"))return;let ins=data.filter(x=>x.type=="in").reduce((s,x)=>s+(+x.amount||0),0),outs=data.filter(x=>x.type=="out").reduce((s,x)=>s+(+x.amount||0),0),bal=opening+ins-outs;try{await db.collection("cashbox_closings").add({date:new Date().toISOString().slice(0,10),opening,inside:ins,outside:outs,balance:bal,createdAt:firebase.firestore.FieldValue.serverTimestamp()});status("تم إغلاق يوم الصندوق — الرصيد: "+money(bal))}catch(e){status("تعذر إغلاق الصندوق: "+e.message,false)}}
async function del(id){if(!confirm("حذف حركة الصندوق؟"))return;try{await col.doc(id).delete();status("تم حذف الحركة")}catch(e){status("تعذر الحذف: "+e.message,false)}}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function exportCSV(){let h=["النوع","المبلغ","البيان","المرجع","التاريخ","الوقت"];let out=[h,...data.map(x=>[x.type=="in"?"داخل":"خارج",x.amount,x.title,x.ref,x.date,dateStr(x.createdAt)])].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+out],{type:"text/csv"}));a.download="kiwi-cashbox.csv";a.click()}</body></html>
