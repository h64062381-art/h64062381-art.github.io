<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIWI — لوحة الإدارة</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7f1e5,#eee5d5);font-family:Arial,Tahoma,sans-serif;color:#182018}button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:18px}.head{background:linear-gradient(135deg,#0d1710,#1b3d29);color:#fff;border-radius:24px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:22px;font-weight:900}.brand small{display:block;color:#d8c78f;font-size:9px;letter-spacing:2px}.head a{color:#fff;text-decoration:none;border:1px solid #ffffff33;padding:9px 13px;border-radius:12px;font-size:11px}.login,.section,.card{background:#fffdf8;border:1px solid #d9ccb5;border-radius:20px;box-shadow:0 10px 25px #1b25190a}.login{max-width:430px;margin:55px auto;padding:28px;text-align:center}.login h2{color:#173f2b}.login input{width:100%;padding:13px;border:1px solid #d5c7ac;border-radius:13px;text-align:center;letter-spacing:6px}.btn{border:0;border-radius:13px;padding:11px 16px;background:linear-gradient(135deg,#f0d58c,#c9a45b);color:#17130b;font-weight:900;cursor:pointer}.login .btn{width:100%;margin-top:10px}.err{display:none;color:#a33b2b;font-size:11px;margin-top:8px}.err.show{display:block}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tools button{border:1px solid #c9a45b66;background:#fffdf8;color:#314032;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}.tools .danger{color:#8b3326}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{padding:16px}.k{font-size:9px;color:#858077}.v{font-size:27px;font-weight:950;color:#173f2b;margin-top:4px}.s{font-size:9px;color:#9a7024}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.section{padding:17px}.section h3{margin:0 0 12px;color:#173f2b;font-size:14px}.row{display:grid;grid-template-columns:1fr 70px;gap:10px;margin:10px 0;font-size:10px}.bar{height:9px;background:#ece4d4;border-radius:999px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#173f2b,#c9a45b);border-radius:999px}.table{width:100%;border-collapse:collapse;font-size:10px}.table th,.table td{padding:9px 5px;border-bottom:1px dashed #ded3c1;text-align:right}.empty{color:#8b857a;font-size:10px;padding:18px;text-align:center}.note{padding:11px 13px;border-radius:13px;background:#f5eedf;border:1px solid #e0cfab;color:#665a43;font-size:9px;line-height:1.8}.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.report{padding:15px;border:1px solid #d9ccb5;border-radius:18px;background:#fffdf8}.report h4{margin:0 0 8px;color:#173f2b;font-size:12px}.report p{margin:0;color:#77736a;font-size:10px;line-height:1.9}.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin-top:14px}.qr-card{border:1px solid #ded3c1;border-radius:16px;padding:10px;text-align:center;background:#fff}.qr-card img{width:128px;height:128px}.qr-card b{display:block;color:#173f2b;font-size:12px}.qr-card small{display:block;color:#888;font-size:8px;margin:3px 0 7px;direction:ltr;word-break:break-all}.qr-card button{border:1px solid #c9a45b66;background:#f8f0df;color:#314032;border-radius:9px;padding:6px 9px;font-size:9px;cursor:pointer}.feedback{padding:10px 12px;border-radius:13px;background:#f7f1e6;border:1px solid #e3d8c4;margin-bottom:8px}.stars{color:#c9a45b;letter-spacing:2px}.meta{font-size:8px;color:#999;margin-top:3px}.feedback p{margin:5px 0 0;font-size:10px;line-height:1.7}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.two,.report-grid{grid-template-columns:1fr}.wrap{padding:10px}}@media print{.no-print,.head a,.tools{display:none!important}body{background:#fff}.wrap{max-width:none}.section,.card,.report{box-shadow:none}}
.insight{padding:14px 16px;border:1px solid #d9ccb5;border-radius:16px;background:linear-gradient(135deg,#fff8e5,#fffdf8);margin-top:12px}.insight b{color:#173f2b}.insight small{display:block;color:#77736a;margin-top:5px;line-height:1.8}.insight.warn{border-color:#c9a45b;background:linear-gradient(135deg,#fff4d4,#fffdf8)}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><div class="brand"><small>KIWI MANAGEMENT</small>لوحة المدير</div><a href="index.html">← المنيو</a></div>
<div id="app"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyAQ9WanobYNjUbozIcWQrhDBCT82-RqMMU4",
authDomain:"kiwiresturant-30ff4.firebaseapp.com",
projectId:"kiwiresturant-30ff4",
storageBucket:"kiwiresturant-30ff4.firebasestorage.app",
messagingSenderId:"329950339210",
appId:"1:329950339210:web:bd072d9d7171a2d6ec4d73"
};
firebase.initializeApp(firebaseConfig);
const kiwiDB=firebase.firestore();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>const PIN='2580',KEY='kiwi_admin_analytics_v1';
const app=document.getElementById('app');
let realtimeOrders=null,realtimeFeedback=null,realtimeStarted=false;
function startRealtime(){
 if(realtimeStarted)return; realtimeStarted=true;
 kiwiDB.collection('orders').orderBy('createdAt','desc').limit(500).onSnapshot(s=>{realtimeOrders=s.docs.map(x=>({id:x.id,...x.data()}));dashboard();},e=>console.error('orders realtime',e));
 kiwiDB.collection('feedback').orderBy('createdAt','desc').limit(100).onSnapshot(s=>{realtimeFeedback=s.docs.map(x=>({id:x.id,...x.data()}));dashboard();},e=>console.error('feedback realtime',e));
}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{"views":0,"sessions":0,"orders":0,"adds":{},"clicks":{},"sections":{},"daily":{}}')}catch(e){return {views:0,sessions:0,orders:0,adds:{},clicks:{},sections:{},daily:{}}}}
function loadFeedback(){try{return JSON.parse(localStorage.getItem('kiwi_feedback_v1')||'[]')}catch(e){return []}}
function loadOrders(){try{return JSON.parse(localStorage.getItem('kiwi_local_orders_v1')||'[]')}catch(e){return []}}
function fmt(n){return Number(n||0).toLocaleString('en-US')}
function entries(o){return Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,7)}
function rows(a){if(!a.length)return '<div class="empty">ماكو بيانات كافية بعد.</div>';let m=a[0][1]||1;return a.map(x=>`<div class="row"><div><b>${x[0]}</b><div class="bar"><i style="width:${Math.max(4,Math.round(x[1]/m*100))}%"></i></div></div><strong>${fmt(x[1])}</strong></div>`).join('')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function login(){app.innerHTML='<div class="login"><h2>🔐 دخول المدير</h2><p>هذه الصفحة خاصة بالإدارة.</p><input id="pin" type="password" maxlength="4" inputmode="numeric" placeholder="••••"><button class="btn" id="go">دخول لوحة المدير</button><div class="err" id="err">الرمز غير صحيح.</div></div>';const pin=document.getElementById('pin'),go=document.getElementById('go'),err=document.getElementById('err');const check=()=>{if(pin.value===PIN)dashboard();else{err.classList.add('show');pin.value='';pin.focus()}};go.onclick=check;pin.onkeydown=e=>{if(e.key==='Enter')check()};pin.focus()}
async function loadRemoteFeedback(){
 try{const snap=await kiwiDB.collection('feedback').orderBy('createdAt','desc').limit(100).get();return snap.docs.map(x=>({id:x.id,...x.data()}));}catch(e){console.error(e);return []}
}
async function dashboard(){
const d=load(),localFb=loadFeedback(),localOrders=loadOrders(),adds=entries(d.adds||{}),clicks=entries(d.clicks||{});
const fb=realtimeFeedback!==null?realtimeFeedback:await loadRemoteFeedback();
let orders=realtimeOrders!==null?realtimeOrders:localOrders;
if(realtimeOrders===null){try{const snap=await kiwiDB.collection('orders').orderBy('createdAt','desc').limit(500).get();orders=snap.docs.map(x=>({id:x.id,...x.data()}));}catch(e){}}
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const todayOrders=orders.filter(o=>{
  const dt=o.createdAt?.toDate?o.createdAt.toDate():new Date(o.created_at||o.createdAt||0);
  const key=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit'}).format(dt); return !isNaN(dt.getTime()) && key===today;
});
const todaySales=todayOrders.reduce((s,o)=>s+Number(o.total||0),0);
const best=adds[0]?esc(adds[0][0]):'لا توجد بيانات محلية بعد';
app.innerHTML=`<div class="tools no-print"><button onclick="dashboard()">↻ تحديث</button><button onclick="exportData()">⬇ تصدير البيانات المحلية</button><button onclick="downloadReport()">📄 تقرير اليوم</button><button class="danger" onclick="resetData()">مسح البيانات المحلية</button><button class="danger" onclick="resetTodayOrders()">🗑️ تصفير طلبات اليوم</button></div>
<div class="grid">
<div class="card"><div class="k">💰 مبيعات اليوم</div><div class="v">${fmt(todaySales)}</div><div class="s">IQD</div></div>
<div class="card"><div class="k">🧾 حسابات اليوم</div><div class="v">${fmt(todayOrders.length)}</div><div class="s">عدد الطلبات</div></div>
<div class="card"><div class="k">📦 كل الطلبات</div><div class="v">${fmt(orders.length)}</div><div class="s">من Firestore</div></div>
<div class="card"><div class="k">👀 مشاهدات محلية</div><div class="v">${fmt(d.views)}</div><div class="s">على هذا الجهاز</div></div>
</div>
<div class="report-grid">
<div class="report"><h4>💰 حساب اليوم</h4><p>${fmt(todaySales)} IQD من ${fmt(todayOrders.length)} طلب</p></div>
<div class="report"><h4>🔥 الأكثر إضافة للسلة</h4><p>${best}</p></div>
<div class="report"><h4>💾 حالة البيانات</h4><p>الطلبات من Firebase Firestore</p></div>
</div>
<div class="section" style="margin-top:14px"><h3>📦 آخر الطلبات</h3>${orders.length?`<table class="table"><tr><th>الطاولة</th><th>المبلغ</th><th>الحالة</th><th>الوقت</th></tr>${orders.slice(0,15).map(o=>{const dt=o.createdAt?.toDate?o.createdAt.toDate():new Date(o.created_at||o.createdAt||0);return `<tr><td>${esc(o.table_number||o.table||'—')}</td><td>${fmt(o.total)} IQD</td><td>${esc(o.status||'pending')}</td><td>${!isNaN(dt.getTime())?dt.toLocaleString('ar-IQ'):''}</td></tr>`}).join('')}</table>`:'<div class="empty">ماكو طلبات بعد.</div>'}</div>
<div class="two"><div class="section"><h3>⭐ آراء الزبائن</h3>${fb.length?fb.slice(0,12).map(f=>`<div class="feedback"><div class="stars">${'★'.repeat(Number(f.rating||0))}${'☆'.repeat(5-Number(f.rating||0))}</div><div class="meta">${esc(f.name||'زائر')} · ${(f.table||f.table_number)?`طاولة ${esc(f.table||f.table_number)} · `:''}${(f.createdAt?.toDate?f.createdAt.toDate():f.date?new Date(f.date):null)?.toLocaleString('ar-IQ')||''}</div><p>${esc(f.text||f.comment||'بدون تعليق')}</p></div>`).join(''):'<div class="empty">ماكو تقييمات بعد.</div>'}</div>
<div class="section"><h3>🔥 أكثر الأطباق إضافة للسلة محلياً</h3>${rows(adds)}</div></div>
<div class="two"><div class="section"><h3>👀 أكثر الأطباق مشاهدة محلياً</h3>${rows(clicks)}</div>
<div class="section"><h3>📱 QR الإدارة</h3><div id="adminqr" style="width:180px;height:180px;margin:auto"></div><p style="text-align:center;font-size:10px;color:#777">هذا هو الباركود الوحيد الخاص بالمدير.</p></div></div>
<div class="section" style="margin-top:14px"><h3>🪑 QR الطاولات — 42 طاولة</h3><div class="note">توليد وطباعة QR لكل طاولة. كل QR يفتح المنيو مع رقم الطاولة.</div><div class="qr-grid" id="qrgrid"></div></div>`;
new QRCode(document.getElementById('adminqr'),{text:new URL('admin.html',location.href).href,width:180,height:180,correctLevel:QRCode.CorrectLevel.H});
makeTableQRs();
startRealtime();
}
function makeTableQRs(){const grid=document.getElementById('qrgrid');grid.innerHTML='';for(let i=1;i<=42;i++){const card=document.createElement('div');card.className='qr-card';const box=document.createElement('div');box.id='q'+i;card.innerHTML=`<b>طاولة ${i}</b><small>${new URL('index.html?table='+i,location.href).href}</small>`;card.prepend(box);grid.appendChild(card);new QRCode(box,{text:new URL('index.html?table='+i,location.href).href,width:128,height:128,correctLevel:QRCode.CorrectLevel.H})}}
function exportData(){const blob=new Blob([JSON.stringify({analytics:load(),feedback:loadFeedback(),orders:loadOrders()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KIWI-local-data.json';a.click()}
function downloadReport(){const d=load(),fb=loadFeedback(),orders=loadOrders();const a=document.createElement('a');const t=`تقرير KIWI - ${new Date().toLocaleDateString('ar-IQ')}\n\nالطلبات المحلية: ${orders.length}\nالتقييمات المحلية: ${fb.length}\nالمشاهدات: ${d.views||0}\nأفضل طبق حسب الإضافات: ${entries(d.adds||{})[0]?.[0]||'لا يوجد بعد'}`;a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download='KIWI-Daily-Report-'+new Date().toISOString().slice(0,10)+'.txt';a.click()}
function resetData(){if(confirm('مسح الإحصائيات والطلبات والتقييمات المحلية من هذا الجهاز؟')){localStorage.removeItem(KEY);localStorage.removeItem('kiwi_feedback_v1');localStorage.removeItem('kiwi_local_orders_v1');dashboard()}}
async function resetTodayOrders(){if(!confirm('تصفير جميع طلبات اليوم من قاعدة البيانات؟'))return;try{const tz='Asia/Baghdad';const parts=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const y=parts.find(x=>x.type==='year').value,m=parts.find(x=>x.type==='month').value,d=parts.find(x=>x.type==='day').value;const start=new Date(`${y}-${m}-${d}T00:00:00+03:00`);const end=new Date(start.getTime()+86400000);const snap=await kiwiDB.collection('orders').where('createdAt','>=',firebase.firestore.Timestamp.fromDate(start)).where('createdAt','<',firebase.firestore.Timestamp.fromDate(end)).get();if(!snap.size){alert('ماكو طلبات اليوم حتى تتصفر.');return;}const batch=kiwiDB.batch();snap.docs.forEach(doc=>batch.delete(doc.ref));await batch.commit();alert('تم تصفير طلبات اليوم.');dashboard();}catch(e){console.error(e);alert('ما صار التصفير. تأكد من اتصال Firebase.')}}
login();</script>
</body></html>
