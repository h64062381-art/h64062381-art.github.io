<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>هدر المواد</title><script src="kiwi-restaurant-engine.js"></script><style>body{background:#0b0d10;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1000px;margin:auto}.card{background:#15181d;border:1px solid #292e35;border-radius:15px;padding:15px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{padding:10px;border-radius:9px;border:1px solid #343a43;background:#0e1115;color:#fff;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff}@media(max-width:700px){.form{grid-template-columns:1fr 1fr}}</style><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>♻️ هدر المواد</h1><div class="card"><div class="form"><label>المادة<select id="it"></select></label><label>الكمية<input id="qty" type="number" step=".001"></label><label>السبب<input id="reason" placeholder="تلف / تحضير / خطأ"></label><label>القسم<input id="dept"></label><button onclick="save()">تسجيل الهدر</button></div></div><div class="card"><table><thead><tr><th>المادة</th><th>الكمية</th><th>القيمة</th><th>السبب</th><th>القسم</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>function fill(){it.innerHTML=KIWI_ERP_V2.read('items').map(x=>`<option value="${x.id}">${KIWI_ERP_V2.esc(x.name)}</option>`).join('')}function save(){let i=KIWI_ERP_V2.read('items').find(x=>x.id===it.value),q=+qty.value||0;if(!i||!q)return;let value=q*(+i.cost||0);KIWI_ERP_V2.add('waste',{itemId:i.id,item:i.name,qty:q,value,reason:reason.value,department:dept.value});KIWI_ERP_V2.stockMove(i.id,-q,'waste',null,i.cost);qty.value=reason.value=dept.value='';render()}function render(){rows.innerHTML=KIWI_ERP_V2.read('waste').slice().reverse().map(x=>`<tr><td>${KIWI_ERP_V2.esc(x.item)}</td><td>${x.qty}</td><td>${KIWI_ERP_V2.money(x.value)}</td><td>${KIWI_ERP_V2.esc(x.reason)}</td><td>${KIWI_ERP_V2.esc(x.department)}</td></tr>`).join('')||'<tr><td colspan=5>لا يوجد هدر مسجل</td></tr>'}fill();render();</script></html>
