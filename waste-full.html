<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | ♻️ هدر المواد — مرتبط بالمخزون</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="kiwi-erp-unified.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font-family:Arial,Tahoma}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#15181d;border:1px solid #292e35;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}label{font-size:12px;color:#b8bec7}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #343a43;background:#0e1115;color:#fff}button{cursor:pointer;font-weight:700;background:#e8e8e8;color:#111}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff;text-decoration:none}.stat b{display:block;font-size:23px;margin-top:5px}.msg{padding:10px;border-radius:10px;background:#171b21;margin:10px 0}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>♻️ هدر المواد — مرتبط بالمخزون</h1><div class="card"><div class="form"><label>المادة<select id="it"></select></label><label>الكمية<input id="qty" type="number" step=".001"></label><label>السبب<input id="reason"></label><label>القسم<input id="dept"></label><button onclick="save()">تسجيل الهدر وخصم المخزون</button></div><div id="msg" class="msg"></div></div><div class="card"><table><thead><tr><th>المادة</th><th>الكمية</th><th>القيمة</th><th>السبب</th><th>القسم</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let items=[],ws=[];KIWI_UNIFIED.inv.onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));it.innerHTML=items.map(x=>`<option value="${x.id}">${KIWI_UNIFIED.esc(x.name)} — ${x.qty||0}</option>`).join('')});KIWI_UNIFIED.waste.orderBy('createdAt','desc').onSnapshot(s=>{ws=s.docs.map(d=>({id:d.id,...d.data()}));render()});async function save(){let i=items.find(x=>x.id===it.value),q=+qty.value||0;if(!i||q<=0)return;try{await KIWI_UNIFIED.stockMove(i.id,-q,'waste',Date.now(),i.price);let value=q*(+i.price||0);let r=await KIWI_UNIFIED.waste.add({inventoryId:i.id,item:i.name,qty:q,value,reason:reason.value,department:dept.value,createdAt:KIWI_UNIFIED.ts()});await KIWI_UNIFIED.audit('waste','waste',r.id,{item:i.name,qty:q,value});msg.textContent='تم تسجيل الهدر وخصمه من المخزون';qty.value=reason.value=dept.value=''}catch(e){msg.textContent=e.message}}function render(){rows.innerHTML=ws.map(x=>`<tr><td>${KIWI_UNIFIED.esc(x.item)}</td><td>${x.qty}</td><td>${KIWI_UNIFIED.money(x.value)}</td><td>${KIWI_UNIFIED.esc(x.reason)}</td><td>${KIWI_UNIFIED.esc(x.department)}</td><td>${KIWI_UNIFIED.date(x.createdAt)}</td></tr>`).join('')||'<tr><td colspan=6>لا يوجد هدر</td></tr>'}</script></body></html>
