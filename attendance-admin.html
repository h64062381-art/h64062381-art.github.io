<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiwi | إدارة الدوام</title>
<style>body{font-family:Arial,sans-serif;background:#f5f1e7;margin:0;color:#29321f}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #0001}h1{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{font-weight:700;display:block;margin-bottom:6px}input,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}button{background:#59683b;color:white;font-weight:bold;border:0;cursor:pointer;margin-top:8px}.danger{background:#a63d32}.muted{color:#777}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}.late{color:#a63d32;font-weight:bold}.ok{color:#39712e;font-weight:bold}.hidden{display:none}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script></head><body><div class="wrap">
<div class="card"><h1>🛠️ إدارة بصمة الدوام</h1><p class="muted">تحديد أوقات الدوام، التأخير المسموح، وموقع البصمة.</p><div id="login"><input id="adminPin" type="password" placeholder="PIN الإدارة"><button onclick="login()">دخول الإدارة</button></div><div id="app" class="hidden">
<div class="card"><h3>⚙️ إعدادات موقع العمل والدوام</h3><div class="grid">
<div><label>وقت بداية الدوام الافتراضي</label><input id="start" type="time" value="09:00"></div>
<div><label>دقائق السماح بالتأخير</label><input id="grace" type="number" value="10" min="0"></div>
<div><label>خط العرض للمطعم</label><input id="lat" type="number" step="any" placeholder="مثال: 33.3"></div>
<div><label>خط الطول للمطعم</label><input id="lng" type="number" step="any" placeholder="مثال: 44.4"></div>
<div><label>نطاق البصمة بالمتر</label><input id="radius" type="number" value="150" min="20"></div>
</div><button onclick="saveSettings()">حفظ الإعدادات</button><button onclick="useCurrent()">📍 استخدم موقعي الحالي كموقع المطعم</button><div id="setmsg" class="muted"></div></div>
<div class="card"><h3>👥 الموظفون</h3><div class="grid"><input id="name" placeholder="اسم الموظف"><input id="dept" placeholder="القسم"><input id="pin" placeholder="PIN الموظف"><input id="shift" type="time" value="09:00"><button onclick="addStaff()">إضافة موظف</button></div><div id="staffList"></div></div>
<div class="card"><h3>📋 سجلات اليوم</h3><button onclick="loadRecords()">تحديث السجلات</button><div class="table"><table><thead><tr><th>الموظف</th><th>القسم</th><th>الدخول</th><th>التأخير</th><th>الخروج</th><th>موقع الدخول</th></tr></thead><tbody id="records"></tbody></table></div></div>
</div></div></div>
<script>
const cfg={apiKey:"AIzaSyAQ9WanobYNjUbozIcWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd072d9d7171a2d6ec4d73"};firebase.initializeApp(cfg);const db=firebase.firestore();firebase.auth().signInAnonymously().catch(console.warn);const ADMIN_PIN='2580';
const $=id=>document.getElementById(id);function login(){if($('adminPin').value===ADMIN_PIN){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll()}else alert('PIN الإدارة غير صحيح')}
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Baghdad'}).format(new Date())}
async function loadAll(){const s=await db.collection('attendanceSettings').doc('main').get();if(s.exists){let x=s.data();for(const k of ['start','grace','lat','lng','radius'])if(x[k]!==undefined)$(k).value=x[k]}loadStaff();loadRecords()}
async function saveSettings(){await db.collection('attendanceSettings').doc('main').set({start:$('start').value,grace:Number($('grace').value),lat:Number($('lat').value)||0,lng:Number($('lng').value)||0,radius:Number($('radius').value)||150,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});$('setmsg').textContent='✅ تم حفظ الإعدادات'}
function useCurrent(){navigator.geolocation.getCurrentPosition(p=>{$('lat').value=p.coords.latitude.toFixed(7);$('lng').value=p.coords.longitude.toFixed(7);$('setmsg').textContent='تم التقاط موقع الجهاز الحالي. اضغط حفظ الإعدادات.'},()=>alert('فعّل الموقع بالمتصفح ثم حاول مرة أخرى.'),{enableHighAccuracy:true})}
async function addStaff(){const name=$('name').value.trim(),pin=$('pin').value.trim();if(!name||!pin)return alert('أدخل الاسم وPIN');await db.collection('attendanceStaff').add({name,department:$('dept').value.trim(),pin,shiftStart:$('shift').value,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});$('name').value=$('dept').value=$('pin').value='';loadStaff()}
async function loadStaff(){const q=await db.collection('attendanceStaff').orderBy('name').get();$('staffList').innerHTML=q.docs.map(d=>{let x=d.data();return `<div style="padding:10px;border-bottom:1px solid #eee"><b>${x.name}</b> — ${x.department||''} — دوام ${x.shiftStart||'09:00'} <button class="danger" onclick="toggle('${d.id}',${x.active!==false})">${x.active===false?'تفعيل':'تعطيل'}</button></div>`}).join('')}
async function toggle(id,active){await db.collection('attendanceStaff').doc(id).update({active:!active});loadStaff()}
function fmt(ts){if(!ts)return '—';let d=ts.toDate?ts.toDate():new Date(ts);return new Intl.DateTimeFormat('ar-IQ',{timeZone:'Asia/Baghdad',timeStyle:'medium'}).format(d)}
async function loadRecords(){const q=await db.collection('attendanceRecords').where('date','==',today()).get();let rows=q.docs.map(d=>d.data());$('records').innerHTML=rows.map(x=>`<tr><td>${x.staffName}</td><td>${x.department||''}</td><td>${fmt(x.clockIn)}</td><td class="${x.late?'late':'ok'}">${x.late?x.late+' دقيقة':'في الوقت'}</td><td>${fmt(x.clockOut)}</td><td>${x.clockInDistance!=null?x.clockInDistance+' م':'—'}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد سجلات اليوم</td></tr>'}
</script></body></html>
