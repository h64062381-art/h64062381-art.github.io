<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | المخالفات والإنذارات</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f5f5;font-family:Arial,Tahoma,sans-serif}header{padding:18px 20px;background:#15181d;border-bottom:1px solid #2a2f36;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}.sub{color:#9da5af;font-size:12px;margin-top:4px}main{max-width:1200px;margin:20px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:#15181d;border:1px solid #292e35;border-radius:16px;padding:15px}.stat b{display:block;font-size:25px;margin-top:6px}label{font-size:12px;color:#b8bec7;display:block;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #343a43;background:#0e1115;color:#fff;outline:none}textarea{min-height:80px;resize:vertical}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}.wide{grid-column:span 2}button{border:0;border-radius:10px;padding:11px 14px;background:#e8e8e8;color:#111;font-weight:700;cursor:pointer}button.alt{background:#252a31;color:#fff}button.danger{background:#8e2630;color:#fff}button.good{background:#1f7a52;color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid #282d34;text-align:right;font-size:13px}th{color:#aeb5bf;background:#12151a;position:sticky;top:0}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#252a31;font-size:11px}.msg{padding:10px;border-radius:10px;background:#161a20;color:#aeb5bf;margin:10px 0}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:520px){.grid,.form{grid-template-columns:1fr}.wide{grid-column:span 1}}a{color:#fff;text-decoration:none}
</style></head><body><header><div><h1>KIWI | المخالفات والإنذارات</h1></div><div class="actions"><a href="systems.html"><button class="alt">كل الأنظمة</button></a><a href="admin.html"><button class="alt">لوحة المدير</button></a></div></header><main><div class="grid"><div class="card stat">إجمالي السجلات<b id="c1">0</b></div><div class="card stat">إنذارات<b id="c2">0</b></div><div class="card stat">مخالفات<b id="c3">0</b></div><div class="card stat">هذا الشهر<b id="c4">0</b></div></div>
<div class="card"><div class="form"><div><label>اسم الموظف</label><input id="name"></div><div><label>القسم</label><input id="dept"></div><div><label>النوع</label><select id="type"><option>إنذار</option><option>مخالفة</option><option>تنبيه شفهي</option><option>جزاء</option></select></div><div><label>التاريخ</label><input id="date" type="date"></div><div class="wide"><label>السبب / التفاصيل</label><textarea id="reason"></textarea></div><div><label>الإجراء المتخذ</label><input id="action"></div><div><label>الحالة</label><select id="status"><option>مفتوح</option><option>تمت المعالجة</option><option>ملغى</option></select></div><div class="actions"><button class="good" onclick="save()">حفظ السجل</button><button class="alt" type="button" onclick="clear()">تفريغ / إلغاء التعديل</button></div></div></div>
<div class="card" style="margin-top:14px"><div class="toolbar"><input id="search" placeholder="بحث باسم الموظف أو السبب..." oninput="render()"><button class="alt" onclick="exportCSV()">تصدير CSV</button></div><div class="tablewrap"><table><thead><tr><th>الموظف</th><th>القسم</th><th>النوع</th><th>التاريخ</th><th>السبب</th><th>الإجراء</th><th>الحالة</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd0721a2d6ec4d73",measurementId:"G-K916WX9ZH8"};</script><script>
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();firebase.auth().signInAnonymously().catch(e=>console.warn(e));
const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString("en-US")+" د.ع";
const dateStr=v=>v?.toDate?v.toDate().toLocaleString("ar-IQ"):new Date(v||Date.now()).toLocaleString("ar-IQ");
let data=[],editId=null;const col=db.collection("violations");
$("date").value=new Date().toISOString().slice(0,10);
col.orderBy("createdAt","desc").onSnapshot(s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));render()});
async async function save(){let x={name:$("name").value.trim(),dept:$("dept").value.trim(),type:$("type").value,date:$("date").value,reason:$("reason").value.trim(),action:$("action").value.trim(),status:$("status").value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(!x.name||!x.reason)return alert("اكتب اسم الموظف والسبب");if(editId){await col.doc(editId).update(x);editId=null}else{ x.createdAt=firebase.firestore.FieldValue.serverTimestamp();await col.add(x)}clear()}
function clear(){["name","dept","reason","action"].forEach(x=>$(x).value="");$("type").value="إنذار";$("status").value="مفتوح";$("date").value=new Date().toISOString().slice(0,10);editId=null}
function render(){let q=$("search").value.toLowerCase();let a=data.filter(x=>(x.name+" "+x.reason+" "+x.dept).toLowerCase().includes(q));$("c1").textContent=data.length;$("c2").textContent=data.filter(x=>x.type=="إنذار").length;$("c3").textContent=data.filter(x=>x.type=="مخالفة").length;let m=new Date().toISOString().slice(0,7);$("c4").textContent=data.filter(x=>(x.date||"").startsWith(m)).length;$("rows").innerHTML=a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.dept)}</td><td><span class="tag">${esc(x.type)}</span></td><td>${esc(x.date||"")}</td><td>${esc(x.reason)}</td><td>${esc(x.action||"")}</td><td>${esc(x.status||"")}</td><td><button class="alt" onclick="edit('${x.id}')">تعديل</button> <button class="danger" onclick="del('${x.id}')">حذف</button></td></tr>`).join("")||"<tr><td colspan=8>لا توجد سجلات</td></tr>"}
async function edit(id){let x=data.find(x=>x.id==id);if(!x)return;["name","dept","reason","action"].forEach(k=>$(k).value=x[k]||"");["type","status","date"].forEach(k=>$(k).value=x[k]||"");editId=id;scrollTo(0,0)}
async function del(id){if(confirm("حذف السجل؟"))await col.doc(id).delete()}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function exportCSV(){let h=["الموظف","القسم","النوع","التاريخ","السبب","الإجراء","الحالة"];let out=[h,...data.map(x=>[x.name,x.dept,x.type,x.date,x.reason,x.action,x.status])].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+out],{type:"text/csv"}));a.download="kiwi-violations.csv";a.click()}</body></html>
