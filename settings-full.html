<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إعدادات ERP</title><script src="kiwi-restaurant-engine.js"></script><style>body{background:#0b0d10;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:800px;margin:auto}.card{background:#15181d;border:1px solid #292e35;border-radius:15px;padding:16px;margin-bottom:14px}input,button{padding:11px;border-radius:9px;border:1px solid #343a43;background:#0e1115;color:#fff;width:100%;box-sizing:border-box;margin:5px 0}button{cursor:pointer}a{color:#fff}</style><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>⚙️ الإعدادات والنسخ الاحتياطي</h1><div class="card"><label>اسم المطعم<input id="name"></label><label>العملة<input id="currency"></label><label>الضريبة %<input id="vat" type="number"></label><label>حد التنبيه للمخزون<input id="low" type="number"></label><button onclick="save()">حفظ الإعدادات</button></div><div class="card"><button onclick="backup()">تصدير نسخة احتياطية</button><input id="file" type="file" accept="application/json"><button onclick="restore()">استرجاع النسخة</button></div></div><script>let st=KIWI_ERP_V2.read('settings')[0]||{};name.value=st.restaurantName||'';currency.value=st.currency||'د.ع';vat.value=st.vat||0;low.value=st.lowStock||1;function save(){KIWI_ERP_V2.write('settings',[{id:'main',restaurantName:name.value,currency:currency.value,vat:+vat.value||0,lowStock:+low.value||1}]);alert('تم الحفظ')}function backup(){let data={};['items','suppliers','warehouses','purchases','recipes','recipeLines','waste','cash','journal','customers','settings','stockMoves','audit'].forEach(k=>data[k]=KIWI_ERP_V2.read(k));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='kiwi-restaurant-erp-backup.json';a.click()}function restore(){let f=file.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);Object.entries(d).forEach(([k,v])=>KIWI_ERP_V2.write(k,v));alert('تم الاسترجاع')}catch(e){alert('النسخة غير صالحة')}};r.readAsText(f)}</script></html>
