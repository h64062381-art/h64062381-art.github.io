<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المطبخ - KIWI</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#18251b;font-family:Cairo,Tahoma,Arial,sans-serif}main{max-width:1050px;margin:auto;padding:14px 10px 40px}header{background:linear-gradient(135deg,#173f2b,#284f38);color:#fff;border:1px solid #c9a45b;border-radius:24px;padding:20px 18px;margin-bottom:15px}h1{margin:0;font-size:26px;font-weight:900}.sub{margin:6px 0;color:#e8e1d2;font-size:12px}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}.badge,.btn{border-radius:12px;padding:8px 12px;font-weight:900;font-size:12px}.badge{background:#f0d58c;color:#17130b}.btn{background:#fff;color:#173f2b;text-decoration:none}.summary,.order{background:#fffdf8;border:1px solid #d7d1bf;border-radius:18px}.summary{padding:12px 15px;margin-bottom:12px;display:flex;justify-content:space-between}.summary b{font-size:20px}.order{padding:15px;margin:12px 0;box-shadow:0 8px 25px #2a372612}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd7c8;padding-bottom:10px;margin-bottom:5px}.table{font-size:21px;font-weight:900;color:#173f2b}.id,.time{font-size:11px;color:#777}.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px dashed #d8d0bd}.item b{font-size:15px}.item strong{font-size:18px;color:#173f2b}.item small{display:block;color:#8a6f2d;font-size:11px;margin-top:4px}.ready-btn{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;padding:11px 12px;background:#173f2b;color:#fff;font-family:inherit;font-weight:900;font-size:13px;cursor:pointer}.ready-btn:disabled{opacity:.6;cursor:wait}.ok{display:inline-block;margin-top:10px;background:#e9f0df;color:#35612f;border-radius:12px;padding:7px 10px;font-size:11px;font-weight:900}.empty{background:#fffdf8;border:1px dashed #b8b39f;border-radius:18px;padding:35px;text-align:center;color:#6e6a60}@media(max-width:600px){h1{font-size:22px}.table{font-size:19px}}</style></head><body data-kiwi-role="kitchen" data-kiwi-dept="kitchen"><main><header><h1>🍳 قسم المطبخ</h1><div class="sub">هذه صفحة ويب مستقلة للقسم. تظهر فقط الأصناف الخاصة بهذا القسم بعد موافقة الكاشير.</div><div class="bar"><span class="badge" id="status">جاري الاتصال...</span></div></header><div class="summary"><span>عدد القطع المطلوبة</span><b id="count">0</b></div><section id="orders"><div class="empty">جاري تحميل الطلبات…</div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozIcWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd072d9d7171a2d6ec4d73",measurementId:"G-K916WX9ZH8"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const ready=(async()=>{try{await firebase.auth().signInAnonymously()}catch(e){}})();const DEPT="kitchen";
function deptForItem(x){const d=String(x?.department||'').toLowerCase(),s=String(x?.sectionId||'').toLowerCase();if(['grills','kitchen','barista','appetizers','hookah'].includes(d))return d;if(s==='grills')return'grills';if(['cold-app','hot-app'].includes(s))return'appetizers';if(['fresh','natural','soft','water','mojito','cold','milkshake','ice','hot','coffee','desserts'].includes(s))return'barista';if(['hookah','hookah-luxury','hookah-natural'].includes(s))return'hookah';return'kitchen'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function tm(o){const t=o.createdAt?.toDate?.();return t?t.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'}):''}
function render(os){let total=0;const html=os.map(o=>{const arr=(Array.isArray(o.items)?o.items:Array.isArray(o.orderItems)?o.orderItems:[]).filter(x=>deptForItem(x)===DEPT);if(!arr.length)return'';total+=arr.reduce((n,x)=>n+Number(x.qty||x.quantity||1),0);return `<article class="order"><div class="top"><div><div class="table">${!String(o.table_number??o.table??o.tableNumber??'').trim()?'🛍️ سفري':'🪑 طاولة '+esc(o.table_number||o.table||o.tableNumber||'—')}</div><div class="id">طلب #${esc(o.id)}</div></div><div class="time">${esc(tm(o))}</div></div>${arr.map(x=>`<div class="item"><div><b>${esc(x.name||x.title||'صنف')}</b>${x.note?`<small>📝 ${esc(x.note)}</small>`:''}</div><strong>× ${esc(x.qty||x.quantity||1)}</strong></div>`).join('')}<div class="ok">✓ مقبول من الكاشير • ${o.departmentStatus?.[DEPT]==='ready'?'جاهز — تم إشعار الكاشير':'قيد التحضير'}</div>${o.departmentStatus?.[DEPT]==='ready'?'<button class="ready-btn" disabled>✓ تم إشعار الكاشير بالجاهزية</button>':`<button class="ready-btn" onclick="markReady('${esc(o.id)}',this)">🍽️ الطلب جاهز — تم إشعار الكاشير</button>`}</article>`}).filter(Boolean).join('');document.getElementById('orders').innerHTML=html||'<div class="empty">ماكو طلبات مقبولة حالياً لهذا القسم.</div>';document.getElementById('count').textContent=total}
async function markReady(id,btn){
 try{
  btn.disabled=true;
  btn.textContent='جاري إرسال إشعار الجاهزية…';
  const ref=db.collection('orders').doc(id);
  await ref.update({
   [`departmentStatus.${DEPT}`]:'ready',
   readyDepartments:firebase.firestore.FieldValue.arrayUnion(DEPT),
   [`departmentReadyAt.${DEPT}`]:firebase.firestore.FieldValue.serverTimestamp(),
   updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  const snap=await ref.get();
  if(snap.exists){
   const o=snap.data();
   const items=Array.isArray(o.items)?o.items:(Array.isArray(o.orderItems)?o.orderItems:[]);
   const deps=[...new Set(items.map(deptForItem).filter(Boolean))];
   const ds=o.departmentStatus||{};
   if(deps.length && deps.every(d=>ds[d]==='ready')){
    await ref.update({status:'ready',allDepartmentsReadyAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
   }else if(o.status==='approved'){
    await ref.update({status:'preparing',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
   }
  }
  btn.textContent='✓ تم إشعار الكاشير بالجاهزية';
 }catch(e){
  console.error(e);
  btn.disabled=false;
  btn.textContent='🍽️ الطلب جاهز — تم إشعار الكاشير';
  alert('تعذر إشعار الكاشير: '+(e.message||'خطأ'));
 }
}
async function start(){try{await ready;db.collection('orders').where('status','in',['approved','preparing','ready']).onSnapshot(s=>{render(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0)));document.getElementById('status').textContent='متصل • تحديث مباشر'},e=>{console.error(e);document.getElementById('status').textContent='تعذر الاتصال بقاعدة الطلبات'})}catch(e){console.error(e)}}start();</script><script src="kiwi-alerts.js"></script><script src="kiwi-enhancements.js"></script></body></html>
