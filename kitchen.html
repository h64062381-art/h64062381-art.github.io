<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI — المطبخ</title><style>body{margin:0;font-family:Arial;background:#101410;color:#fff}header{padding:18px;text-align:center;background:#173f2b;position:sticky;top:0;z-index:2}h1{margin:0 0 8px}.status{text-align:center;padding:10px;color:#ddd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;padding:14px}.card{background:#fff;color:#222;border-radius:18px;padding:16px}.row{display:flex;justify-content:space-between;margin:7px 0}.items{background:#f5f1e8;padding:10px;border-radius:12px;line-height:1.9}.age{font-weight:800;color:#a15b00}.btn{width:100%;border:0;border-radius:12px;padding:12px;margin-top:8px;font-weight:900;cursor:pointer}.prep{background:#173f2b;color:#fff}.ready{background:#c9a45b;color:#111}.empty{text-align:center;padding:50px;color:#aaa}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozIcWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd0721a2d9d7171a2d6ec4d73"};firebase.initializeApp(firebaseConfig);const kiwiDB=firebase.firestore();</script></head><body><header><h1>👨‍🍳 KIWI — المطبخ</h1><div>approved = بانتظار التحضير • preparing = قيد التحضير • ready = جاهز</div></header><div class="status" id="status">جاري الاتصال...</div><div class="grid" id="orders"></div><script>function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(rows){const b=document.getElementById('orders');if(!rows.length){b.innerHTML='<div class="empty">ماكو طلبات بالمطبخ حالياً</div>';return}b.innerHTML=rows.map(r=>{const dt=r.createdAt?.toDate?r.createdAt.toDate():new Date(r.created_at||0);const mins=isNaN(dt.getTime())?0:Math.floor((Date.now()-dt.getTime())/60000);const items=Array.isArray(r.items)?r.items.map(x=>`${x.name||'طلب'} × ${x.qty||1}`).join('، '):'';let btn=r.status==='approved'?`<button class="btn prep" onclick="setStatus('${r.id}','preparing')">▶️ بدء التحضير</button>`:`<button class="btn ready" onclick="setStatus('${r.id}','ready')">✅ الطلب جاهز</button>`;return `<div class="card"><div class="row"><b>طاولة ${esc(r.table||r.table_number||'—')}</b><b>${esc(r.total)} د.ع</b></div><div class="age">${mins} دقيقة</div><div class="items">${esc(items)}</div><div>${esc(r.status)}</div>${btn}</div>`}).join('')}function setStatus(id,status){kiwiDB.collection('orders').doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}kiwiDB.collection('orders').where('status','in',['approved','preparing']).onSnapshot(s=>{const rows=s.docs.map(d=>({id:d.id,...d.data()}));render(rows);document.getElementById('status').textContent='متصل — '+new Date().toLocaleTimeString('ar-IQ')})</script></body></html>
