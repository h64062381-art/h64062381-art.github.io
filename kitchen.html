<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIWI — المطبخ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f3;color:#18201b}
header{position:sticky;top:0;z-index:20;background:#173f2b;color:#fff;padding:14px}
.head{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:24px}.sub{font-size:12px;opacity:.85;margin-top:4px}
.refresh{border:0;border-radius:12px;padding:11px 14px;font-weight:900;background:#fff;color:#173f2b;cursor:pointer}
.status{max-width:1100px;margin:12px auto 0;padding:10px 14px;background:#fff;border-radius:12px;color:#536057;text-align:center}
.wrap{max-width:1100px;margin:auto;padding:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:15px;padding:14px;text-align:center;border:1px solid #e0e4e1}.stat b{display:block;font-size:25px;margin-top:4px}
.section-title{font-size:20px;font-weight:900;margin:18px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:#fff;border-radius:18px;padding:16px;border:2px solid #e2e5e3;box-shadow:0 3px 12px #0000000d;margin-bottom:14px}
.card.new{border-color:#d6a83d}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0}
.table{font-size:21px;font-weight:900}.total{font-size:17px;font-weight:900}
.age{display:inline-block;margin:7px 0;padding:5px 9px;border-radius:999px;background:#eef2ef;color:#536057;font-weight:900;font-size:13px}
.items{background:#f6f3eb;border-radius:13px;padding:12px;margin:10px 0;line-height:2;font-size:17px}
.item{padding:5px 0;border-bottom:1px solid #e4dfd3}.item:last-child{border-bottom:0}
.note{display:block;margin-top:5px;padding:7px 9px;border-radius:9px;background:#fff0bd;color:#775600;font-size:14px;font-weight:900;line-height:1.6}
.status-badge{font-size:13px;font-weight:900;padding:6px 9px;border-radius:999px;background:#e9f0eb;color:#245b3d}
.btn{width:100%;border:0;border-radius:13px;padding:13px;margin-top:8px;font-size:17px;font-weight:900;cursor:pointer}
.prep{background:#173f2b;color:#fff}.ready{background:#c9a45b;color:#111}
.empty{padding:45px 15px;text-align:center;background:#fff;border-radius:16px;color:#777}
@media(max-width:600px){.head{align-items:flex-start}.summary{grid-template-columns:1fr 1fr 1fr}.stat{padding:10px 5px;font-size:12px}.stat b{font-size:21px}h1{font-size:20px}.items{font-size:16px}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozIcWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd0721a2d9d7171a2d6ec4d73"};
firebase.initializeApp(firebaseConfig);const kiwiDB=firebase.firestore();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(v){return Number(v||0).toLocaleString('en-US')+' د.ع'}
function ageText(r){const d=r.createdAt?.toDate?r.createdAt.toDate():new Date(r.created_at||0);if(isNaN(d.getTime()))return '';const m=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));return m===0?'الآن':m+' دقيقة'}
function render(rows){
 const box=document.getElementById('orders');
 const approved=rows.filter(r=>r.status==='approved'), preparing=rows.filter(r=>r.status==='preparing');
 document.getElementById('newCount').textContent=approved.length;document.getElementById('prepCount').textContent=preparing.length;
 if(!rows.length){box.innerHTML='<div class="empty">🍽️ ماكو طلبات بالمطبخ حالياً</div>';return}
 const card=r=>{
  const items=Array.isArray(r.items)?r.items:[];
  const lines=items.length?items.map(x=>'<div class="item"><b>'+esc(x.name||'طلب')+' × '+esc(x.qty||1)+'</b>'+(x.note?'<span class="note">📝 '+esc(x.note)+'</span>':'')+'</div>').join(''):'<div>ماكو تفاصيل للصنف</div>';
  const btn=r.status==='approved'?'<button class="btn prep" onclick="setStatus(\''+esc(r.id)+'\',\'preparing\')">▶️ بدء التحضير</button>':'<button class="btn ready" onclick="setStatus(\''+esc(r.id)+'\',\'ready\')">✅ الطلب جاهز</button>';
  return '<div class="card '+(r.status==='approved'?'new':'')+'"><div class="row"><span class="table">🪑 طاولة '+esc(r.table||r.table_number||'—')+'</span><span class="status-badge">'+(r.status==='approved'?'⏳ بانتظار التحضير':'🟡 قيد التحضير')+'</span></div><div class="row"><span class="age">⏱️ '+ageText(r)+'</span><b class="total">'+money(r.total)+'</b></div><div class="items">'+lines+'</div>'+btn+'</div>'
 };
 box.innerHTML=(approved.length?'<div class="section-title">🔔 طلبات جديدة</div>'+approved.map(card).join(''):'')+
 (preparing.length?'<div class="section-title">👨‍🍳 قيد التحضير</div>'+preparing.map(card).join(''):'')
}
async function setStatus(id,status){try{await kiwiDB.collection('orders').doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){alert('تعذر تحديث حالة الطلب: '+(e.message||'خطأ'))}}
kiwiDB.collection('orders').where('status','in',['approved','preparing']).onSnapshot(s=>{render(s.docs.map(d=>({id:d.id,...d.data()})));document.getElementById('status').textContent='🟢 متصل — آخر تحديث '+new Date().toLocaleTimeString('ar-IQ')},e=>{console.error(e);document.getElementById('status').textContent='🔴 تعذر الاتصال بالمطبخ — تأكد من الإنترنت'});
</script>
</head>
<body>
<header><div class="head"><div><h1>👨‍🍳 KIWI — المطبخ</h1><div class="sub">الطلبات الجديدة ثم قيد التحضير — ملاحظات الزبون تظهر تحت كل صنف</div></div><button class="refresh" onclick="location.reload()">🔄 تحديث</button></div></header>
<div class="wrap"><div class="status" id="status">جاري الاتصال بالمطبخ...</div>
<div class="summary"><div class="stat">🔔 جديدة<b id="newCount">0</b></div><div class="stat">👨‍🍳 قيد التحضير<b id="prepCount">0</b></div><div class="stat">📝 الملاحظات<b>تظهر تلقائياً</b></div></div>
<div id="orders"></div></div>
</body></html>
