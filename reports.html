<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>📈 التقارير | سستم المطعم</title><link rel="stylesheet" href="restaurant-system.css"><script src="restaurant-system-core.js"></script></head><body><div class="wrap"><header class="head"><div><h1>📈 التقارير</h1><p>تقارير تشغيلية من بيانات سستم المطعم الجديد، مع روابط للتقارير الموجودة في KIWI ERP.</p></div><div class="actions"><a class="btn light" href="restaurant-system.html">← كل الأنظمة</a><button class="btn gold" onclick="KRS.backup()">💾 Backup</button></div></header><div class="grid" id="stats"></div><div class="card"><h2>ملخص السجلات</h2><div class="tablewrap"><table><thead><tr><th>التقرير</th><th>عدد السجلات</th><th>إجمالي رقمي</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>تقارير النظام الحالي</h2><div class="nav"><a href="kiwi-erp.html">KIWI ERP</a><a href="admin.html">تقارير الإدارة</a><a href="cashbox.html">الصندوق</a><a href="inventory.html">المخزون</a></div></div></div><script>
const sets=[['المشتريات','purchases','unitCost'],['المصروفات','expenses','amount'],['الهدر','waste','value'],['الحجوزات','reservations',null],['الموظفون','employees',null],['المخالفات','violations',null],['التنبيهات','notifications',null],['الطاولات','tables',null]];document.getElementById('stats').innerHTML=sets.slice(0,4).map(x=>`<div class="card stat">${x[0]}<b>${KRS.list(x[1]).length}</b></div>`).join('');document.getElementById('rows').innerHTML=sets.map(x=>{const a=KRS.list(x[1]);const total=x[2]?a.reduce((s,r)=>s+(Number(r[x[2]])||0)*(x[2]==='unitCost'?(Number(r.qty)||1):1),0):0;return `<tr><td>${x[0]}</td><td>${a.length}</td><td>${total?KRS.money(total):'—'}</td></tr>`}).join('');
</script></body></html>
