<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>👥 الموظفون والحضور</title><link rel="stylesheet" href="restaurant-system.css"><script src="restaurant-system-core.js"></script><script src="module-generic.js"></script></head><body><div class="wrap"><header class="head"><div><h1>👥 الموظفون والحضور</h1><p>ملف الموظف والوظيفة والوردية وحالة الحضور.</p></div><div class="actions"><a class="btn light" href="restaurant-system.html">← كل الأنظمة</a><button class="btn gold" onclick="KRS.backup()">💾 Backup</button></div></header><div class="card"><div class="row" style="justify-content:space-between;align-items:end"><div class="search"><label>بحث</label><input id="search" placeholder="ابحث في السجلات..."></div><div class="muted">البيانات محفوظة محلياً ولا تؤثر على ملفات النظام القديم.</div></div></div><div class="card"><h2>إضافة / تعديل</h2><div class="form" id="form"></div></div><div class="card tablewrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>الوظيفة</th><th>الوردية</th><th>الحالة</th><th>ملاحظات</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>setupCRUD({key:'employees',title:'👥 الموظفون والحضور',subtitle:'ملف الموظف والوظيفة والوردية وحالة الحضور.',fields:[{key:'name',label:'اسم الموظف'},{key:'phone',label:'الهاتف'},{key:'role',label:'الوظيفة'},{key:'shift',label:'الوردية',type:'select',options:["صباحية", "مسائية", "ليلية"]},{key:'status',label:'الحالة',type:'select',options:["فعال", "إجازة", "متوقف"]},{key:'note',label:'ملاحظات',type:'textarea',wide:true}],columns:[{key:'name'},{key:'phone'},{key:'role'},{key:'shift'},{key:'status'},{key:'note'}]});</script></body></html>
