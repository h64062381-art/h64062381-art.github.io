<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الوصفات والتكلفة</title><script src="kiwi-restaurant-engine.js"></script><style>body{background:#0b0d10;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1100px;margin:auto}.card{background:#15181d;border:1px solid #292e35;border-radius:15px;padding:15px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{padding:10px;border-radius:9px;border:1px solid #343a43;background:#0e1115;color:#fff;box-sizing:border-box;width:100%}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff}@media(max-width:700px){.form{grid-template-columns:1fr 1fr}}</style><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>🧪 الوصفات والتكلفة</h1><div class="card"><div class="form"><label>اسم الطبق<input id="rn"></label><label>سعر البيع<input id="sp" type="number"></label><label>المادة<select id="it"></select></label><label>كمية المادة<input id="rq" type="number" step=".001"></label><button onclick="addRecipe()">حفظ الوصفة مع المادة</button></div></div><div class="card"><table><thead><tr><th>الطبق</th><th>سعر البيع</th><th>التكلفة</th><th>Food Cost</th><th>المواد</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>function fill(){it.innerHTML=KIWI_ERP_V2.read('items').map(x=>`<option value="${x.id}">${KIWI_ERP_V2.esc(x.name)}</option>`).join('')}function addRecipe(){if(!rn.value||!it.value)return;let r=KIWI_ERP_V2.read('recipes').find(x=>x.name===rn.value);if(!r)r=KIWI_ERP_V2.add('recipes',{name:rn.value,salePrice:+sp.value||0});KIWI_ERP_V2.add('recipeLines',{recipeId:r.id,itemId:it.value,qty:+rq.value||0});KIWI_ERP_V2.audit('recipe_line','recipes',{recipeId:r.id,itemId:it.value});rn.value=sp.value=rq.value='';render()}function render(){let rs=KIWI_ERP_V2.read('recipes'),ls=KIWI_ERP_V2.read('recipeLines'),items=KIWI_ERP_V2.read('items');rows.innerHTML=rs.map(r=>{let lines=ls.filter(l=>l.recipeId===r.id),cost=lines.reduce((s,l)=>{let i=items.find(i=>i.id===l.itemId);return s+(Number(l.qty)||0)*(Number(i?.cost)||0)},0),fc=r.salePrice?cost/r.salePrice*100:0;return `<tr><td>${KIWI_ERP_V2.esc(r.name)}</td><td>${KIWI_ERP_V2.money(r.salePrice)}</td><td>${KIWI_ERP_V2.money(cost)}</td><td>${fc.toFixed(1)}%</td><td>${lines.map(l=>{let i=items.find(i=>i.id===l.itemId);return KIWI_ERP_V2.esc(i?.name||'')+' × '+l.qty}).join('<br>')}</td></tr>`}).join('')||'<tr><td colspan=5>لا توجد وصفات</td></tr>'}fill();render();</script></html>
