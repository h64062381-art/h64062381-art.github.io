<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | 🧪 الوصفات والتكلفة — مرتبطة بالمخزون</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="kiwi-erp-unified.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font-family:Arial,Tahoma}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#15181d;border:1px solid #292e35;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}label{font-size:12px;color:#b8bec7}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #343a43;background:#0e1115;color:#fff}button{cursor:pointer;font-weight:700;background:#e8e8e8;color:#111}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff;text-decoration:none}.stat b{display:block;font-size:23px;margin-top:5px}.msg{padding:10px;border-radius:10px;background:#171b21;margin:10px 0}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>🧪 الوصفات والتكلفة — مرتبطة بالمخزون</h1><div class="card"><div class="form"><label>اسم الطبق<input id="name"></label><label>سعر البيع<input id="sale" type="number"></label><label>المادة<select id="item"></select></label><label>كمية المادة<input id="qty" type="number" step=".001"></label><button onclick="save()">حفظ الوصفة</button></div><div id="msg" class="msg"></div></div><div class="card"><table><thead><tr><th>الطبق</th><th>سعر البيع</th><th>التكلفة</th><th>Food Cost</th><th>المواد</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let items=[],recipes=[];KIWI_UNIFIED.inv.onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));item.innerHTML=items.map(x=>`<option value="${x.id}">${KIWI_UNIFIED.esc(x.name)}</option>`).join('');render()});KIWI_UNIFIED.recipes.onSnapshot(s=>{recipes=s.docs.map(d=>({id:d.id,...d.data()}));render()});async function save(){let i=items.find(x=>x.id===item.value),q=+qty.value||0;if(!name.value.trim()||!i||q<=0)return;let old=recipes.find(x=>x.name===name.value.trim()),data={name:name.value.trim(),salePrice:+sale.value||0,items:[...(old?.items||[]).filter(x=>x.inventoryId!==i.id),{inventoryId:i.id,qty:q,item:i.name}],updatedAt:KIWI_UNIFIED.ts()};let r=old?await KIWI_UNIFIED.recipes.doc(old.id).set(data,{merge:true}):await KIWI_UNIFIED.recipes.add({...data,createdAt:KIWI_UNIFIED.ts()});msg.textContent='تم حفظ الوصفة وربطها بالمادة المخزنية';qty.value='';render()}function render(){rows.innerHTML=recipes.map(r=>{let c=(r.items||[]).reduce((s,l)=>s+(+l.qty||0)*(+(items.find(i=>i.id===l.inventoryId)?.price)||0),0),fc=r.salePrice?c/r.salePrice*100:0;return `<tr><td>${KIWI_UNIFIED.esc(r.name)}</td><td>${KIWI_UNIFIED.money(r.salePrice)}</td><td>${KIWI_UNIFIED.money(c)}</td><td>${fc.toFixed(1)}%</td><td>${(r.items||[]).map(l=>KIWI_UNIFIED.esc(l.item||items.find(i=>i.id===l.inventoryId)?.name||'')+' × '+l.qty).join('<br>')}</td></tr>`}).join('')||'<tr><td colspan=5>لا توجد وصفات</td></tr>'}</script></body></html>
