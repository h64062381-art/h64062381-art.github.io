<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحاسبة</title><script src="kiwi-restaurant-engine.js"></script><style>body{background:#0b0d10;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1050px;margin:auto}.card{background:#15181d;border:1px solid #292e35;border-radius:15px;padding:15px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{padding:10px;border-radius:9px;border:1px solid #343a43;background:#0e1115;color:#fff;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff}@media(max-width:700px){.form{grid-template-columns:1fr 1fr}}</style><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>📚 المحاسبة</h1><div class="card"><div class="form"><label>نوع القيد<select id="type"><option value="receipt">سند قبض</option><option value="payment">سند صرف</option><option value="journal">قيد يومية</option></select></label><label>الحساب<input id="account"></label><label>الطرف المقابل<input id="counter"></label><label>المبلغ<input id="amount" type="number"></label><label>البيان<input id="note"></label><button onclick="save()">ترحيل القيد</button></div></div><div class="card"><table><thead><tr><th>النوع</th><th>الحساب</th><th>المقابل</th><th>المبلغ</th><th>البيان</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>function save(){let a=+amount.value||0;if(!account.value||!a)return;KIWI_ERP_V2.add('journal',{type:type.value,account:account.value,counter:counter.value,amount:a,note:note.value});amount.value=note.value=counter.value='';render()}function render(){rows.innerHTML=KIWI_ERP_V2.read('journal').slice().reverse().map(x=>`<tr><td>${x.type}</td><td>${KIWI_ERP_V2.esc(x.account)}</td><td>${KIWI_ERP_V2.esc(x.counter)}</td><td>${KIWI_ERP_V2.money(x.amount)}</td><td>${KIWI_ERP_V2.esc(x.note)}</td></tr>`).join('')||'<tr><td colspan=5>لا توجد قيود</td></tr>'}render();</script></html>
