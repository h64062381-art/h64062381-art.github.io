<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIWI — الكابتن</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:18px;text-align:center;position:sticky;top:0}
h1{margin:0;font-size:24px}
#status{padding:12px;text-align:center;color:#666}
#orders{padding:12px;max-width:700px;margin:auto}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
.new{border-right:5px solid #16a34a}
.row{display:flex;justify-content:space-between;gap:10px;margin:7px 0}
.items{line-height:1.8;background:#fafafa;padding:10px;border-radius:10px}
button{border:0;border-radius:10px;padding:10px 16px;font-size:16px;cursor:pointer}
.refresh{background:#fff;color:#111}
.done{background:#111;color:#fff;width:100%;margin-top:10px}
.empty{text-align:center;padding:40px;color:#777}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyAQ9WanobYNjUbozIcWQrhDBCT82-RqMMU4",
authDomain:"kiwiresturant-30ff4.firebaseapp.com",
projectId:"kiwiresturant-30ff4",
storageBucket:"kiwiresturant-30ff4.firebasestorage.app",

appId:"1:329950339210:web:bd072d9d7171a2d6ec4d73"

firebase.initializeApp(firebaseConfig);
const kiwiDB=firebase.firestore();

</head>
<body data-kiwi-role="captain-realtime-final">
<header>
  <h1>KIWI — الكابتن</h1>
  <button class="refresh" onclick="loadOrders()">تحديث</button>
  <button class="refresh" onclick="enableAlert()">🔔 تفعيل التنبيه</button>
</header>

<div id="status">جاري تحديث الطلبات...</div>
<div id="orders"></div>

<script>
let rows=[];
let audioCtx=null;
let audioEnabled=false;
let knownOrderIds=new Set();

function enableAlert(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const p=audioCtx.resume();
    if(p&&p.catch)p.catch(()=>{});
    audioEnabled=true;
    playAlert();
    document.getElementById('status').textContent='🔔 التنبيه الصوتي مفعّل';
    setTimeout(loadOrders,300);
  }catch(e){
    document.getElementById('status').textContent='فعّل صوت الآيفون ثم جرّب مرة ثانية';
  }
}

function playAlert(){
  if(!audioEnabled||!audioCtx)return;
  if(audioCtx.state==='suspended') audioCtx.resume();
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='square';
  osc.frequency.setValueAtTime(950,now);
  osc.frequency.setValueAtTime(760,now+0.5);
  osc.frequency.setValueAtTime(950,now+1.0);
  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(0.95,now+0.03);
  gain.gain.setValueAtTime(0.95,now+2.75);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now+3.05);
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function render(){
  const box=document.getElementById('orders');
  if(!rows.length){box.innerHTML='<div class="empty">ماكو طلبات جديدة حالياً</div>';return;}
  box.innerHTML=rows.map((r,i)=>{
    const table=r.table||r.table_number||'—';
    const order=Array.isArray(r.items)?r.items.map(x=>`${x.name||x.title||'طلب'} × ${x.qty||x.quantity||1}`).join('، '):(r.order||r.items||'—');
    const total=r.total||0;
    return `<div class="card new"><div class="row"><b>الطاولة</b><b>${esc(table)}</b></div><div class="row"><span>الحالة</span><span>طلب جديد 🔔</span></div><div class="items">${esc(order)}</div><div class="row"><b>المجموع</b><b>${esc(total)} د.ع</b></div><button class="done" onclick="markDone(${i})">تم تجهيز الطلب</button></div>`;
  }).join('');
}

let firstRealtimeSnapshot=true;
let stopOrdersRealtime=null;
function loadOrders(){
  if(stopOrdersRealtime)return;
  stopOrdersRealtime=kiwiDB.collection('orders').where('status','==','pending').onSnapshot(snap=>{
    const incoming=snap.docs.map(d=>({id:d.id,...d.data()}));
    const incomingIds=new Set(incoming.map(r=>String(r.id)));
    const hasNew=!firstRealtimeSnapshot && [...incomingIds].some(id=>!knownOrderIds.has(id));
    rows=incoming; render();
    if(audioEnabled&&hasNew) playAlert();
    knownOrderIds=incomingIds;
    firstRealtimeSnapshot=false;
    document.getElementById('status').textContent='متصل — آخر تحديث: '+new Date().toLocaleTimeString('ar-IQ');
  },e=>{
    stopOrdersRealtime=null;
    document.getElementById('status').textContent='تعذر جلب الطلبات من النظام';
    document.getElementById('orders').innerHTML='<div class="empty">تأكد من اتصال الإنترنت وFirebase.</div>';
  });
}

async function markDone(i){
  const r=rows[i]; if(!r)return;
  try{
    await kiwiDB.collection('orders').doc(r.id).update({status:'approved'});
    rows.splice(i,1); knownOrderIds.delete(String(r.id)); render();
  }catch(e){
    document.getElementById('status').textContent='تعذر اعتماد الطلب';
  }
}

loadOrders();
</script>
<script src="kiwi-alerts.js"></script></body>
</html>
