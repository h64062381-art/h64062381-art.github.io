<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | نظام المطعم المتكامل</title><script src="kiwi-restaurant-engine.js"></script><style>body{margin:0;background:#0b0d10;color:#fff;font-family:Arial,Tahoma}.wrap{max-width:1200px;margin:auto;padding:22px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;background:#15181d;border:1px solid #292e35;border-radius:18px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#15181d;border:1px solid #292e35;border-radius:16px;padding:16px}.stat b{display:block;font-size:24px;margin-top:7px}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.module{display:block;text-decoration:none;color:#fff;background:#101318;border:1px solid #303640;border-radius:15px;padding:17px;transition:.15s}.module:hover{transform:translateY(-2px);border-color:#777}.icon{font-size:28px}.module h3{margin:8px 0}.module p{color:#aeb5bf;line-height:1.6;font-size:13px}.go{font-weight:bold;margin-top:12px}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 15px;background:#eee;color:#111;text-decoration:none;font-weight:bold}.gold{background:#d6b45b}.muted{color:#aeb5bf}@media(max-width:800px){.grid,.modules{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.modules{grid-template-columns:1fr}.head{flex-direction:column;align-items:stretch}}</style></head><body><div class="wrap"><div class="head"><div><h1>🥝 سستم المطعم الكامل — ERP</h1><div class="muted">منظومة إضافية مترابطة للمخزون والمشتريات والتكلفة والصندوق والمحاسبة والتقارير.</div></div><a class="btn" href="restaurant-system.html">الأنظمة الحالية</a></div><div class="grid" id="stats"></div><div class="card" style="margin-top:16px"><h2>كل الأنظمة</h2><div class="modules" id="modules"></div></div></div><script>const M=[['📦','دليل الأصناف والمخازن','master-data.html','الأصناف، الوحدات، المستودعات، الحدود الدنيا والموردين.'],['🛒','المشتريات','purchases-full.html','فاتورة شراء، مورد، مخزن، تكلفة، دفع وترحيل للمخزون.'],['🧪','الوصفات والتصنيع','recipes-full.html','وصفات الأطباق، المواد المستهلكة والتكلفة وحركة المخزون.'],['♻️','الهدر','waste-full.html','هدر المواد، السبب، القيمة، القسم والتأثير على المخزون.'],['💰','الصندوق','cashbox-full.html','فتح وإغلاق الشفت، المقبوضات، المدفوعات وتسوية الصندوق.'],['📚','المحاسبة','accounting-full.html','دليل الحسابات، قيود، قبض، صرف، موردين وتقارير مالية.'],['📊','التقارير الموحدة','reports-full.html','مبيعات/مشتريات/مخزون/هدر/مصروفات/صندوق/ربحية.'],['⚙️','الإعدادات','settings-full.html','المطعم، الضريبة، العملة، حدود المخزون والنسخ الاحتياطي.'],['👥','الموظفون والحضور','employees.html','الصفحة الموجودة بالمشروع.'],['📅','الحجوزات','reservations.html','الصفحة الموجودة بالمشروع.'],['⚠️','المخالفات والإنذارات','violations.html','الصفحة الموجودة بالمشروع.'],['🔐','المستخدمون والصلاحيات','users-permissions.html','الصفحة الموجودة بالمشروع.'],['🪑','الطاولات','tables.html','الصفحة الموجودة بالمشروع.'],['🧑‍🍳','أقسام التشغيل','department.html','المطبخ، المقبلات، المشاوي، البارستا والأراكيل.'],['🧾','الكاشير/POS','cashier.html','نظام الكاشير الحالي بدون استبداله.'],['👨‍🍳','الكابتن','captain.html','نظام الكابتن الحالي بدون استبداله.'],['🍳','KDS المطبخ','kitchen.html','نظام المطبخ الحالي.']];document.getElementById('modules').innerHTML=M.map(x=>`<a class="module" href="${x[2]}"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[3]}</p><div class="go">فتح ←</div></a>`).join('');let s=KIWI_ERP_V2.summary();document.getElementById('stats').innerHTML=[['الأصناف',s.items],['الموردون',s.suppliers],['المشتريات',s.purchases],['الوصفات',s.recipes]].map(x=>`<div class="card stat">${x[0]}<b>${x[1]}</b></div>`).join('');</script></body></html>
