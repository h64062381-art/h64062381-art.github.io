<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | بصمة الدوام</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e8;color:#18251b;font-family:Arial,Tahoma,sans-serif}main{max-width:620px;margin:auto;padding:18px}.head,.card{background:#fffdf8;border:1px solid #d9d1bd;border-radius:22px;box-shadow:0 10px 30px #17251b12}.head{padding:20px;background:linear-gradient(135deg,#173f2b,#2d6044);color:white;border-color:#c9a45b}.head h1{margin:0;font-size:25px}.head p{margin:7px 0 0;color:#e9e2d4;font-size:13px}.card{padding:18px;margin-top:14px}.label{display:block;font-weight:900;margin:10px 0 7px}select,input,button{width:100%;padding:13px;border-radius:13px;font:inherit}select,input{border:1px solid #cfc7b4;background:#fff}.btn{border:0;background:#173f2b;color:#fff;font-weight:900;cursor:pointer;margin-top:10px}.btn.out{background:#8b2d25}.btn:disabled{opacity:.55}.status{margin-top:14px;padding:13px;border-radius:14px;background:#f1eee4;font-weight:800;line-height:1.7}.ok{background:#e8f4e8;color:#216126}.bad{background:#fff0ed;color:#8b2d25}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clock{font-size:28px;font-weight:900;text-align:center;color:#173f2b}.small{font-size:12px;color:#6e6a60}.privacy{font-size:11px;color:#777;margin-top:10px;line-height:1.7}@media(max-width:500px){main{padding:10px}.row{grid-template-columns:1fr}}</style></head><body><main><section class="head"><h1>🕘 بصمة دوام موظفي KIWI</h1><p>تسجيل الدخول والخروج من موقع العمل مع التحقق من موقع الجهاز.</p></section><section class="card"><div class="clock" id="clock">--:--:--</div><label class="label">اسم الموظف</label><select id="staff"><option>جاري تحميل الموظفين...</option></select><label class="label">الرمز السري PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="أدخل الرمز السري"><div class="row"><button class="btn" id="inBtn">🟢 بصمة بداية الدوام</button><button class="btn out" id="outBtn">🔴 بصمة نهاية الدوام</button></div><div id="status" class="status">اختر اسمك وأدخل الرمز السري.</div><div id="today" class="status"></div><div class="privacy">📍 الموقع مطلوب للبصمة. إذا كان الجهاز خارج نطاق المطعم المحدد من الإدارة، سيتم رفض البصمة. يتم حفظ وقت البصمة وموقعها ودقة GPS.</div></section></main><script>const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd0721a2d6ec4d73",measurementId:"G-K916WX9ZH8"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let ready=firebase.auth().signInAnonymously().catch(()=>null);const $=id=>document.getElementById(id);let staffList=[];function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function baghdadParts(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(d).reduce((o,p)=>(o[p.type]=p.value,o),{})}function dayKey(d=new Date()){let p=baghdadParts(d);return `${p.year}-${p.month}-${p.day}`}function hhmm(d){let p=baghdadParts(d);return `${p.hour}:${p.minute}`}function hav(a,b,c,d){const R=6371000,rad=x=>x*Math.PI/180,da=rad(c-a),db=rad(d-b),x=Math.sin(da/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(db/2)**2;return 2*R*Math.asin(Math.sqrt(x))}async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function load(){await ready;try{const s=await db.collection('attendance_staff').where('active','==',true).get();staffList=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ar'));$('staff').innerHTML='<option value="">اختر الموظف</option>'+staffList.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.role||'موظف')}</option>`).join('');}catch(e){$('status').className='status bad';$('status').textContent='تعذر تحميل الموظفين. تأكد من اتصال الإنترنت وصلاحيات Firebase.'}}function calcLateMinutes(st,settings){const p=baghdadParts(new Date());const now=(Number(p.hour)||0)*60+(Number(p.minute)||0);const startText=st.shiftStart||settings.shiftStart||'09:00';const a=String(startText).split(':').map(Number);const start=(a[0]||0)*60+(a[1]||0);const grace=Number(st.grace==null?(settings.grace||0):st.grace||0);return Math.max(0,now-start-grace)}async function punch(kind){const id=$('staff').value,pin=$('pin').value.trim();if(!id||!pin)return msg('اختار الموظف وأدخل PIN.','bad');const st=staffList.find(x=>x.id===id);if(!st)return msg('الموظف غير موجود.','bad');$('inBtn').disabled=$('outBtn').disabled=true;msg('جاري التحقق من الموقع…','');try{await ready;const settings=(await db.collection('attendance_settings').doc('main').get()).data()||{};if(!settings.locationEnabled||!Number.isFinite(Number(settings.lat))||!Number.isFinite(Number(settings.lng)))throw Error('الإدارة لم تحدد موقع المطعم بعد.');const ph=await hash(pin);const hashMatch=(ph===String(st.pinHash||''));const legacyMatch=(String(pin)===String(st.pin||''));if(!hashMatch&&!legacyMatch)throw Error('الرمز السري غير صحيح.');if(legacyMatch&&!hashMatch){try{await db.collection('attendance_staff').doc(id).set({pinHash:ph,pin:firebase.firestore.FieldValue.delete()},{merge:true});}catch(_){}}const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0}));const acc=Number(pos.coords.accuracy||9999),dist=hav(Number(settings.lat),Number(settings.lng),pos.coords.latitude,pos.coords.longitude),radius=Number(settings.radius||100);if(acc>Number(settings.maxAccuracy||150))throw Error(`دقة الموقع ضعيفة (${Math.round(acc)}م). فعّل الموقع بدقة أعلى وحاول مرة ثانية.`);if(dist>radius)throw Error(`أنت خارج موقع العمل بحوالي ${Math.round(dist)}م. النطاق المسموح ${radius}م.`);const key=`${id}_${dayKey()}`,ref=db.collection('attendance_daily').doc(key),snap=await ref.get(),data=snap.exists?snap.data():{};if(kind==='in'&&data.checkIn)throw Error('تم تسجيل بداية الدوام مسبقًا لهذا اليوم.');if(kind==='out'&&!data.checkIn)throw Error('لا يمكن تسجيل نهاية الدوام قبل بداية الدوام.');if(kind==='out'&&data.checkOut)throw Error('تم تسجيل نهاية الدوام مسبقًا لهذا اليوم.');const lateMinutes=kind==='in'?calcLateMinutes(st,settings):0;const payload={staffId:id,staffName:st.name,role:st.role||'',kind,dayKey:dayKey(),lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:acc,distanceMeters:Math.round(dist),lateMinutes:lateMinutes,late:lateMinutes>0,createdAt:firebase.firestore.FieldValue.serverTimestamp()};const logRef=db.collection('attendance_logs').doc();await logRef.set(payload);if(kind==='in'&&lateMinutes>0){const dref=db.collection('attendance_deductions').doc(dayKey()+'_'+id+'_late');const ds=await dref.get();if(!ds.exists)await dref.set({dayKey:dayKey(),staffId:id,staffName:st.name,role:st.role||'',lateMinutes:lateMinutes,amountIQD:10000,reason:'تأخير عن بداية الدوام',attendanceLogId:logRef.id,createdAt:firebase.firestore.FieldValue.serverTimestamp(),status:'issued'});}const upd=kind==='in'?{checkIn:payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()}:{checkOut:payload,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};await ref.set({...upd,staffId:id,staffName:st.name,role:st.role||'',dayKey:dayKey()},{merge:true});msg(kind==='in'?'تم تسجيل بداية الدوام بنجاح ✅':'تم تسجيل نهاية الدوام بنجاح ✅','ok');$('pin').value='';showToday(data,kind,payload)}catch(e){let t=e.message||'تعذر تسجيل البصمة';if(e.code===1)t='تم رفض إذن الموقع. اسمح للموقع من إعدادات المتصفح.';if(e.code===2)t='تعذر تحديد موقع الجهاز.';if(e.code===3)t='انتهى وقت تحديد الموقع، حاول مرة ثانية.';msg(t,'bad')}finally{$('inBtn').disabled=$('outBtn').disabled=false;}}function msg(t,c){$('status').textContent=t;$('status').className='status '+(c||'')}function showToday(data,kind,p){let d={...data,[kind==='in'?'checkIn':'checkOut']:p};$('today').innerHTML=`<b>سجل اليوم</b><br>الدخول: ${d.checkIn?'تم التسجيل':'لم يسجل'}<br>الخروج: ${d.checkOut?'تم التسجيل':'لم يسجل'}<br>${p?'📍 المسافة عن الموقع: '+p.distanceMeters+'م — دقة GPS: '+Math.round(p.accuracy)+'م':''}`}$('inBtn').onclick=()=>punch('in');$('outBtn').onclick=()=>punch('out');setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('ar-IQ',{timeZone:'Asia/Baghdad',hour12:false})},500);load();</script></body></html>
