<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | 📦 دليل الأصناف والمخازن — موحد</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="kiwi-erp-unified.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font-family:Arial,Tahoma}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#15181d;border:1px solid #292e35;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}label{font-size:12px;color:#b8bec7}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #343a43;background:#0e1115;color:#fff}button{cursor:pointer;font-weight:700;background:#e8e8e8;color:#111}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff;text-decoration:none}.stat b{display:block;font-size:23px;margin-top:5px}.msg{padding:10px;border-radius:10px;background:#171b21;margin:10px 0}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>📦 دليل الأصناف والمخازن — موحد</h1><div class="card"><div class="form"><label>اسم الصنف<input id="name"></label><label>الوحدة<input id="unit" placeholder="كغم / لتر / حبة"></label><label>الكمية<input id="qty" type="number" step=".01"></label><label>الحد الأدنى<input id="min" type="number" step=".01"></label><label>سعر التكلفة<input id="price" type="number" step=".01"></label><label>المورد<select id="supplier"></select></label><button onclick="saveItem()">حفظ الصنف</button><button onclick="saveSupplier()">إضافة مورد</button></div></div><div class="card"><div class="form"><label>اسم المورد<input id="sn"></label><label>الهاتف<input id="phone"></label><button onclick="addSupplier()">حفظ المورد</button></div></div><div class="card"><h3>الأصناف المخزنية</h3><table><thead><tr><th>الصنف</th><th>الوحدة</th><th>الكمية</th><th>الحد</th><th>التكلفة</th><th>المورد</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let items=[],sups=[]; KIWI_UNIFIED.inv.onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()}); KIWI_UNIFIED.sup.orderBy('name').onSnapshot(s=>{sups=s.docs.map(d=>({id:d.id,...d.data()}));supplier.innerHTML='<option value="">بدون</option>'+sups.map(x=>`<option value="${x.id}">${KIWI_UNIFIED.esc(x.name)}</option>`).join('')}); async function saveItem(){if(!name.value.trim())return;let x={name:name.value.trim(),unit:unit.value.trim(),qty:+qty.value||0,min:+min.value||0,price:+price.value||0,supplierId:supplier.value||'',supplier:(sups.find(x=>x.id===supplier.value)||{}).name||'',updatedAt:KIWI_UNIFIED.ts()};let r=await KIWI_UNIFIED.inv.add({...x,createdAt:KIWI_UNIFIED.ts()});await db.collection('stock_movements').add({type:'opening',referenceId:r.id,inventoryId:r.id,quantity:x.qty,beforeQty:0,afterQty:x.qty,unitCost:x.price,value:x.qty*x.price,createdAt:KIWI_UNIFIED.ts(),source:'kiwi-unified'});await KIWI_UNIFIED.audit('create_item','inventory',r.id,x);['name','unit','qty','min','price'].forEach(id=>document.getElementById(id).value='');} async function addSupplier(){if(!sn.value.trim())return;await KIWI_UNIFIED.sup.add({name:sn.value.trim(),phone:phone.value.trim(),balance:0,createdAt:KIWI_UNIFIED.ts()});sn.value=phone.value='';} async function saveSupplier(){await addSupplier()} function render(){rows.innerHTML=items.map(x=>`<tr><td>${KIWI_UNIFIED.esc(x.name)}</td><td>${KIWI_UNIFIED.esc(x.unit)}</td><td>${x.qty||0}</td><td>${x.min||0}</td><td>${KIWI_UNIFIED.money(x.price)}</td><td>${KIWI_UNIFIED.esc(x.supplier||'')}</td></tr>`).join('')||'<tr><td colspan=6>لا توجد أصناف</td></tr>'}</script></body></html>
