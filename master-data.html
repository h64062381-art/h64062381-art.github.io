<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دليل الأصناف والمخازن</title><script src="kiwi-restaurant-engine.js"></script><style>body{background:#0b0d10;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#15181d;border:1px solid #292e35;border-radius:15px;padding:15px}input,select,button{padding:10px;border-radius:9px;border:1px solid #343a43;background:#0e1115;color:#fff}input,select{width:100%;box-sizing:border-box}button{cursor:pointer}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}.full{grid-column:1/-1}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.form{grid-template-columns:1fr}}a{color:#fff}</style><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>📦 دليل الأصناف والمخازن</h1><div class="grid"><div class="card"><h3>إضافة صنف مخزني</h3><div class="form" id="form"></div></div><div class="card"><h3>إضافة مورد</h3><div class="form" id="supplierForm"></div></div><div class="card"><h3>إضافة مستودع</h3><div class="form" id="whForm"></div></div><div class="card full"><input id="q" placeholder="بحث..."><table><thead><tr><th>الصنف</th><th>الوحدة</th><th>الكمية</th><th>الحد</th><th>التكلفة</th><th>المورد</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>function field(id,label,type='text'){return `<label>${label}<input id="${id}" type="${type}"></label>`}document.getElementById('form').innerHTML=field('name','اسم الصنف')+field('unit','الوحدة')+field('qty','الرصيد','number')+field('min','الحد الأدنى','number')+field('cost','تكلفة الوحدة','number')+'<button onclick="saveItem()">حفظ</button>';document.getElementById('supplierForm').innerHTML=field('sn','اسم المورد')+field('sp','الهاتف')+field('sa','الرصيد','number')+'<button onclick="saveSup()">حفظ</button>';document.getElementById('whForm').innerHTML=field('wn','اسم المستودع')+field('wc','الرمز')+'<button onclick="saveWh()">حفظ</button>';function saveItem(){if(!name.value.trim())return;KIWI_ERP_V2.add('items',{name:name.value.trim(),unit:unit.value.trim(),qty:+qty.value||0,min:+min.value||0,cost:+cost.value||0});KIWI_ERP_V2.audit('create_item','master-data',{name:name.value});['name','unit','qty','min','cost'].forEach(x=>document.getElementById(x).value='');render()}function saveSup(){if(!sn.value.trim())return;KIWI_ERP_V2.add('suppliers',{name:sn.value.trim(),phone:sp.value.trim(),balance:+sa.value||0});KIWI_ERP_V2.audit('create_supplier','suppliers',{name:sn.value});sn.value=sp.value=sa.value='';}function saveWh(){if(!wn.value.trim())return;KIWI_ERP_V2.add('warehouses',{name:wn.value.trim(),code:wc.value.trim(),active:true});wn.value=wc.value='';}function render(){let q=document.getElementById('q').value.toLowerCase();rows.innerHTML=KIWI_ERP_V2.read('items').filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<tr><td>${KIWI_ERP_V2.esc(x.name)}</td><td>${KIWI_ERP_V2.esc(x.unit)}</td><td>${x.qty}</td><td>${x.min}</td><td>${KIWI_ERP_V2.money(x.cost)}</td><td>${KIWI_ERP_V2.esc(x.supplier||'')}</td><td><button onclick="del('${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan=7>لا توجد أصناف</td></tr>'}function del(id){KIWI_ERP_V2.remove('items',id);render()}q.oninput=render;render();</script></html>
