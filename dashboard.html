<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم | سستم المطعم</title><link rel="stylesheet" href="restaurant-system.css"><script src="restaurant-system-core.js"></script></head><body><div class="wrap"><header class="head"><div><h1>📊 لوحة التحكم</h1><p>ملخص تشغيلي سريع لسستم المطعم.</p></div><a class="btn light" href="restaurant-system.html">← كل الأنظمة</a></header><div class="grid" id="stats"></div><div class="grid3"><div class="card"><h3>اختصارات</h3><div class="nav"><a href="cashier.html">الكاشير</a><a href="inventory.html">المخزون</a><a href="reports.html">التقارير</a><a href="reservations.html">الحجوزات</a></div></div><div class="card"><h3>آخر العمليات</h3><div id="latest"></div></div><div class="card"><h3>تنبيهات أولية</h3><div id="alerts"></div></div></div></div><script>
const s=KRS.state(), rows=[['📦','سجلات المخزون',KRS.list('inventory').length],['🛒','المشتريات',KRS.list('purchases').length],['💸','المصروفات',KRS.list('expenses').length],['♻️','الهدر',KRS.list('waste').length],['📅','الحجوزات',KRS.list('reservations').length],['👥','الموظفون',KRS.list('employees').length],['🪑','الطاولات',KRS.list('tables').length],['⚠️','المخالفات',KRS.list('violations').length]];document.getElementById('stats').innerHTML=rows.map(x=>`<div class="card stat">${x[0]} ${x[1]}<b>${x[2]}</b></div>`).join('');const a=KRS.list('audit').slice(0,8);document.getElementById('latest').innerHTML=a.length?a.map(x=>`<div class="note"><b>${KRS.esc(x.action)}</b><br><span class="muted">${new Date(x.at).toLocaleString('ar-IQ')}</span></div>`).join(''):'لا توجد عمليات مسجلة بعد.';document.getElementById('alerts').innerHTML='<div class="note">النظام الجديد يعمل بشكل مستقل عن ملفات المشروع الحالية، لذلك الإضافات لا تحذف أو تعدل وظائفك القديمة.</div>';
</script></body></html>
