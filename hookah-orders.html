<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قسم الأراكيل</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#1b281f;font-family:Tahoma,Arial,sans-serif}.wrap{width:min(1120px,100%);margin:auto;padding:0 14px}.hero{background:linear-gradient(135deg,#123a28,#28533a);color:white;padding:18px 0 16px;box-shadow:0 8px 28px #172b1c24;position:sticky;top:0;z-index:20}.heroRow{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{display:flex;align-items:center;gap:12px}.icon{width:52px;height:52px;border-radius:16px;background:#f1d486;color:#1d190e;display:grid;place-items:center;font-size:28px;box-shadow:inset 0 0 0 1px #fff6}.title h1{margin:0;font-size:24px}.title p{margin:5px 0 0;color:#e5eadf;font-size:12px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.tools a,.tools button{border:0;border-radius:11px;padding:9px 13px;background:#f1d486;color:#17130b;text-decoration:none;font-weight:900;cursor:pointer;font-family:inherit}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat{background:#fff;border:1px solid #ddd6c5;border-radius:16px;padding:13px 15px;box-shadow:0 5px 20px #293a2c0b}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#716f67}.orders{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:13px;padding-bottom:30px}.order{background:#fffdf8;border:1px solid #d8d0bd;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #24332610}.orderTop{padding:13px 14px;background:#fbf7eb;border-bottom:1px solid #e0d8c7}.tableLine{display:flex;align-items:center;justify-content:space-between;gap:10px}.table{display:flex;align-items:center;gap:9px}.tableNum{min-width:62px;height:62px;padding:5px 10px;border-radius:16px;background:#173f2b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 12px #173f2b25}.tableNum small{font-size:9px;color:#d9e8db}.tableNum strong{font-size:24px;line-height:1}.orderNo{font-weight:900;font-size:14px}.time{font-size:11px;color:#77756d;margin-top:4px}.new{background:#eaf2df;color:#31552f;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:900}.items{padding:6px 14px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 0;border-bottom:1px dashed #d9d0bd}.item:last-child{border-bottom:0}.name{font-size:15px;font-weight:900}.note{display:block;margin-top:5px;color:#766f64;font-size:11px;line-height:1.6}.qty{font-size:18px;font-weight:950;white-space:nowrap}.empty{background:#fffdf8;border:1px dashed #bbb39f;border-radius:20px;text-align:center;padding:45px 20px;color:#716e64}.foot{font-size:11px;color:#7b776d;padding:0 0 25px;text-align:center}@media(max-width:650px){.wrap{padding:0 9px}.heroRow{align-items:flex-start}.title h1{font-size:20px}.summary{grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:10px 8px}.stat b{font-size:18px}.orders{grid-template-columns:1fr}.icon{width:46px;height:46px}.tableNum{min-width:58px;height:58px}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd072d9d7171a2d6ec4d73",measurementId:"G-K916WX9ZH8"}; firebase.initializeApp(firebaseConfig); const db=firebase.firestore();</script></head><body><header class="hero"><div class="wrap"><div class="heroRow"><div class="title"><div class="icon">💨</div><div><h1>قسم الأراكيل</h1><p>طلبات القسم المقبولة من الكابتن</p></div></div></div><div class="tools"><a href="captain.html">← الكابتن</a><a href="admin.html">⚙️ الأدمن</a><button id="refresh">↻ تحديث</button></div></div></header><main class="wrap"><section class="summary"><div class="stat"><b id="orderCount">0</b><span>طلبات بانتظار القسم</span></div><div class="stat"><b id="itemCount">0</b><span>مجموع القطع</span></div><div class="stat"><b id="lastUpdate">—</b><span>آخر تحديث</span></div></section><section class="orders" id="orders"><div class="empty">جاري تحميل الطلبات…</div></section><div class="foot">تتحدث الصفحة تلقائياً عند وصول أو قبول طلب جديد.</div></main><script>
const DEPT='hookah';
const safe=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function itemDept(x){const d=String(x?.department||'').toLowerCase(),s=String(x?.sectionId||'').toLowerCase();if(['grills','kitchen','barista','appetizers','hookah'].includes(d))return d;if(s==='grills')return'grills';if(['cold-app','hot-app'].includes(s))return'appetizers';if(['fresh','natural','soft','water','mojito','cold','milkshake','ice','hot','coffee','desserts'].includes(s))return'barista';if(['hookah','hookah-luxury','hookah-natural'].includes(s))return'hookah';return'kitchen'}
function dateOf(o){try{return o.createdAt?.toDate?o.createdAt.toDate():new Date(o.created_at||Date.now())}catch(e){return new Date()}}
function timeOf(d){return d.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})}
function render(list){let total=0,html='';for(const o of list){const items=Array.isArray(o.items)?o.items.filter(x=>itemDept(x)===DEPT):[];if(!items.length)continue;total+=items.reduce((n,x)=>n+Number(x.qty||x.quantity||1),0);const d=dateOf(o),table=o.table_number??o.table??o.tableNumber??'—';html+=`<article class="order"><div class="orderTop"><div class="tableLine"><div class="table"><div class="tableNum"><small>طاولة</small><strong>${safe(table)}</strong></div><div><div class="orderNo">طلب #${safe(o.id||'')}</div><div class="time">🕒 ${safe(timeOf(d))}</div></div></div><span class="new">مقبول ✓</span></div></div><div class="items">${items.map(x=>`<div class="item"><div><div class="name">${safe(x.name||x.title||'صنف')}</div>${x.note?`<span class="note">📝 ${safe(x.note)}</span>`:''}</div><div class="qty">× ${safe(x.qty||x.quantity||1)}</div></div>`).join('')}</div></article>`}document.getElementById('orders').innerHTML=html||'<div class="empty">لا توجد طلبات مقبولة لهذا القسم حالياً.</div>';document.getElementById('orderCount').textContent=(html.match(/class="order"/g)||[]).length;document.getElementById('itemCount').textContent=total;document.getElementById('lastUpdate').textContent=timeOf(new Date())}
let unsub;function load(){if(unsub)unsub();document.getElementById('orders').innerHTML='<div class="empty">جاري تحميل الطلبات…</div>';unsub=db.collection('orders').where('status','==','approved').onSnapshot(s=>{const list=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>dateOf(b)-dateOf(a));render(list)},e=>{console.error(e);document.getElementById('orders').innerHTML='<div class="empty">تعذر تحميل الطلبات. تأكد من اتصال قاعدة البيانات.</div>'})}document.getElementById('refresh').onclick=load;load();
</script></body></html>
