<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIWI — قسم التحضير</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f5f5;color:#222}
header{background:#173f2b;color:#fff;padding:18px;position:sticky;top:0;z-index:10;box-shadow:0 3px 12px #0002}
.head{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:22px}.status{font-size:13px;opacity:.85;margin-top:5px}
main{max-width:1100px;margin:20px auto;padding:0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}
button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}
.refresh{background:#fff;border:1px solid #ddd}.back{background:#c9a45b;color:#fff}
.order{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 5px 18px #00000010;border:1px solid #e5e5e5}
.order-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #eee;padding-bottom:10px}
.badge{padding:6px 10px;border-radius:999px;background:#fff0c9;color:#765400;font-weight:900;font-size:12px}
.table{font-weight:900;font-size:18px}.time{color:#777;font-size:12px}
.items{margin-top:12px;display:grid;gap:8px}.item{padding:11px;border-radius:12px;background:#f8f8f8}
.item b{font-size:16px}.qty{font-weight:900;color:#173f2b}.note{color:#9a7024;font-size:12px;margin-top:4px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.prepare{background:#e9b949}.ready{background:#2f7d4a;color:#fff}
.empty{text-align:center;background:#fff;padding:45px 20px;border-radius:18px;color:#777}
.error{background:#ffe5e5;color:#8a1f1f;padding:15px;border-radius:14px}

/* KIWI: department order contents clarity */
.kiwi-dept-item{
  display:grid!important;
  grid-template-columns:1fr auto!important;
  gap:12px!important;
  padding:12px 8px!important;
  border-bottom:1px solid #d8d0bd!important;
  align-items:center!important;
}
.kiwi-dept-item b{
  display:block!important;
  color:#11150f!important;
  font-size:16px!important;
  font-weight:1000!important;
  line-height:1.6!important;
}
.kiwi-dept-item small{
  color:#7a5413!important;
  font-size:12px!important;
  font-weight:800!important;
}
.kiwi-dept-item>strong{
  min-width:48px!important;
  padding:5px 8px!important;
  border-radius:9px!important;
  background:#173f2b!important;
  color:#fff!important;
  text-align:center!important;
  font-size:15px!important;
  font-weight:1000!important;
}
.kiwi-dept-badge{font-weight:950!important}


/* KIWI: department order contents clarity */
.kiwi-dept-item{display:grid!important;grid-template-columns:1fr auto!important;gap:12px!important;padding:12px 8px!important;border-bottom:1px solid #d8d0bd!important;align-items:center!important}
.kiwi-dept-item b{display:block!important;color:#11150f!important;font-size:16px!important;font-weight:1000!important;line-height:1.6!important}
.kiwi-dept-item small{color:#7a5413!important;font-size:12px!important;font-weight:800!important}
.kiwi-dept-item>strong{min-width:48px!important;padding:5px 8px!important;border-radius:9px!important;background:#173f2b!important;color:#fff!important;text-align:center!important;font-size:15px!important;font-weight:1000!important}
.kiwi-dept-badge{font-weight:950!important}


/* KIWI: make department order contents unmistakable */
.order .items{background:#fffdf7!important;border:2px solid #c9a45b!important;border-radius:14px!important;padding:10px!important;margin-top:10px!important}
.order .item{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important;padding:11px 8px!important;border-bottom:1px solid #ddd5c3!important;color:#11150f!important;font-size:16px!important;line-height:1.6!important}
.order .item:last-child{border-bottom:0!important}
.order .item b{font-size:16px!important;font-weight:1000!important;color:#11150f!important}
.order .qty{flex:none!important;background:#173f2b!important;color:#fff!important;border-radius:9px!important;padding:4px 9px!important;font-size:15px!important;font-weight:1000!important}
.order .note{display:block!important;color:#7a5413!important;font-size:12px!important;font-weight:800!important;margin-top:3px!important}
.order .table{font-size:16px!important;font-weight:1000!important}

</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
 apiKey:"AIzaSyAQ9WanobYNjUbozIcWQrhDBCT82-RqMMU4",
 authDomain:"kiwiresturant-30ff4.firebaseapp.com",
 projectId:"kiwiresturant-30ff4",
 storageBucket:"kiwiresturant-30ff4.firebasestorage.app",
 messagingSenderId:"329950339210",
 appId:"1:329950339210:web:bd072d9d7171a2d6ec4d73"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const DEPT_NAMES={
 grills:'🔥 المشويات', kitchen:'🍳 المطبخ',
 barista:'🥤 الباريستا والعصائر', appetizers:'🥗 المقبلات', hookah:'💨 الأراكيل'
};
const params=new URLSearchParams(location.search);
const department=(params.get('department')||'kitchen').toLowerCase();
const title=DEPT_NAMES[department]||DEPT_NAMES.kitchen;
let stop=null, orders=[];

document.title='KIWI — '+title.replace(/^[^ ]+ /,'');
document.addEventListener('DOMContentLoaded',()=>{
 document.getElementById('title').textContent=title;
 document.getElementById('status').textContent='جاري الاتصال...';
 listen();
});

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0;}
function itemsOf(o){return Array.isArray(o.items)?o.items:(Array.isArray(o.orderItems)?o.orderItems:[]);}
function inferDepartment(item){
 const id=String(item.sectionId||'').toLowerCase();
 if(item.department) return String(item.department).toLowerCase();
 if(id==='grills') return 'grills';
 if(['cold-app','hot-app'].includes(id)) return 'appetizers';
 if(['fresh','natural','soft','water','mojito','cold','milkshake','ice','hot','coffee','desserts'].includes(id)) return 'barista';
 if(['hookah','hookah-luxury','hookah-natural'].includes(id)) return 'hookah';
 return 'kitchen';
}
function deptItems(o){return itemsOf(o).filter(x=>inferDepartment(x)===department);}
function deptStatus(o){
 const d=o.departmentStatus||{};
 return d[department]||'approved';
}
function statusLabel(s){
 return s==='preparing'?'🟡 قيد التحضير':s==='ready'?'🟢 جاهز':'🔵 مقبول';
}
function listen(){
 if(stop)stop();
 stop=db.collection('orders')
   .where('status','in',['approved','preparing'])
   .onSnapshot(snap=>{
     const nextOrders=snap.docs.map(d=>({id:d.id,...d.data()}))
       .filter(o=>deptItems(o).length && deptStatus(o)!=='ready' && deptStatus(o)!=='served');
     const nextIds=new Set(nextOrders.map(o=>o.id));
     const hadNew=nextOrders.some(o=>!kiwiSeenDept.has(o.id));
     orders=nextOrders;
     if(kiwiSeenDept.size && hadNew) kiwiBeep();
     kiwiSeenDept=nextIds;
     render();
     document.getElementById('status').textContent='متصل — آخر تحديث: '+new Date().toLocaleTimeString('ar-IQ');
   },err=>{
     console.error(err);
     document.getElementById('status').textContent='تعذر الاتصال بـ Firebase';
     document.getElementById('orders').innerHTML='<div class="error">تعذر جلب الطلبات. تأكد من Firebase وقواعد Firestore.</div>';
   });
}
function render(){
 const box=document.getElementById('orders');
 if(!orders.length){box.innerHTML='<div class="empty">ماكو طلبات مقبولة لهذا القسم حالياً.</div>';return;}
 orders.sort((a,b)=>{
   const ta=a.createdAt&&a.createdAt.toMillis?a.createdAt.toMillis():0;
   const tb=b.createdAt&&b.createdAt.toMillis?b.createdAt.toMillis():0;
   return ta-tb;
 });
 box.innerHTML=orders.map(o=>{
   const its=deptItems(o), st=deptStatus(o);
   const created=o.createdAt&&o.createdAt.toDate?o.createdAt.toDate().toLocaleTimeString('ar-IQ'):'—';
   return `<article class="order">
    <div class="order-head">
      <div><div class="table">${(()=>{const t=String(o.table||o.table_number||'').trim();return t&&t!=='—'?'🪑 طاولة '+esc(t):'🛍️ سفري / توصيل'})()}</div><div class="time">${created} • طلب #${esc(o.id.slice(-6))}</div></div>
      <span class="badge">${statusLabel(st)}</span>
    </div>
    <div class="items">${its.map(x=>`<div class="item"><b>${esc(x.name||'طلب')}</b> <span class="qty">× ${esc(x.qty||x.quantity||1)}</span>${x.note?`<div class="note">📝 ${esc(x.note)}</div>`:''}</div>`).join('')}</div>
    <div class="actions">
      ${st!=='preparing'&&st!=='ready'?`<button class="prepare" onclick="setDeptStatus('${esc(o.id)}','preparing')">بدء التحضير</button>`:''}
      ${st!=='ready'?`<button class="ready" onclick="setDeptStatus('${esc(o.id)}','ready')">جاهز ✓</button>`:''}
    </div>
   </article>`;
 }).join('');
}
let kiwiAudioCtx=null;
let kiwiSeenDept=new Set();
function kiwiBeep(){
 try{
   kiwiAudioCtx=kiwiAudioCtx||new (window.AudioContext||window.webkitAudioContext)();
   if(kiwiAudioCtx.state==='suspended') kiwiAudioCtx.resume();
   const o=kiwiAudioCtx.createOscillator(),g=kiwiAudioCtx.createGain();
   o.type='sine';o.frequency.value=880;g.gain.value=.0001;
   o.connect(g);g.connect(kiwiAudioCtx.destination);
   const t=kiwiAudioCtx.currentTime;g.gain.exponentialRampToValueAtTime(.16,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.28);o.start(t);o.stop(t+.3);
 }catch(e){}
}
document.addEventListener('click',()=>{try{kiwiAudioCtx=kiwiAudioCtx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}},{once:true});
async function setDeptStatus(id,status){
 try{
   const ref=db.collection('orders').doc(id);
   const snap=await ref.get();
   if(!snap.exists) throw new Error('الطلب غير موجود');
   const o=snap.data();
   const its=itemsOf(o);
   const departments=[...new Set(its.map(inferDepartment).filter(Boolean))];
   const next={...(o.departmentStatus||{})};
   next[department]=status;
   const allReady=departments.length>0 && departments.every(d=>next[d]==='ready'||next[d]==='served');
   await ref.update({
     [`departmentStatus.${department}`]:status,
     ...(allReady?{status:'ready',allDepartmentsReady:true,readyAt:firebase.firestore.FieldValue.serverTimestamp()}:{}),
     updatedAt:firebase.firestore.FieldValue.serverTimestamp()
   });
   kiwiBeep();
 }catch(e){alert('تعذر تحديث حالة القسم: '+(e.message||'خطأ'));}
}
function refresh(){listen();}
</script>
</head>
<body>
<header><div class="head">
 <div><h1 id="title">KIWI — القسم</h1><div id="status" class="status"></div></div>
 <div class="toolbar">
  <button class="refresh" onclick="refresh()">🔄 تحديث</button>
  
 </div>
</div></header>
<main><div id="orders"></div></main>
<script src="kiwi-enhancements.js"></script>
</body>
</html>
