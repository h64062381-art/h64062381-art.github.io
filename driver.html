<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | شاشة سائق التوصيل</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozIcWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd0721a2d6ec4d73",measurementId:"G-K916WX9ZH8"};
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
if(firebase.auth) firebase.auth().signInAnonymously().catch(console.warn);
</script>
<style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#18212b;font-family:Cairo,Tahoma,Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:12px}.head{background:linear-gradient(135deg,#142536,#1d3d31);color:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 35px #0002}.head h1{margin:0;font-size:24px}.head p{margin:5px 0 0;color:#dce4e8;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.stat{background:#ffffff18;border:1px solid #ffffff25;border-radius:13px;padding:9px;text-align:center}.stat b{display:block;font-size:21px}.login,.card{background:#fff;border-radius:18px;padding:14px;margin:11px 0;box-shadow:0 5px 20px #0001}.login-grid{display:grid;grid-template-columns:1fr 150px 100px;gap:8px}.login input,.login button,.login select{padding:12px;border-radius:11px;border:1px solid #ccd3da;font:inherit}.login button{background:#172433;color:#fff;font-weight:900}.online{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;background:#fff;padding:12px;border-radius:15px}.toggle{padding:10px 13px;border-radius:999px;background:#e8edf1;font-weight:900}.toggle.on{background:#d9f5e2;color:#176334}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:#e7edf4;padding:6px 10px;border-radius:99px;font-weight:900;font-size:11px}.ready{background:#fff2c9}.out{background:#eadfff}.done{background:#d9f5e2}.items{background:#f6f7f8;border-radius:12px;padding:11px;line-height:1.9;margin:10px 0;font-size:12px}.meta{font-size:12px;line-height:2;color:#53616c}.money{font-size:18px;font-weight:1000;color:#172433}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actions button{padding:12px;border:0;border-radius:12px;color:#fff;font-weight:900}.map{background:#172433}.call{background:#39734e}.pickup{background:#315ea8}.deliver{background:#23804f}.cancel{background:#922c2c}.empty{text-align:center;color:#888;padding:35px 10px}.history-title{font-weight:1000;margin:18px 4px 8px}.muted{font-size:11px;color:#7b858e}@media(max-width:560px){.login-grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="wrap"><div class="head"><h1>📱 شاشة سائق التوصيل</h1><p id="who">اختار اسمك وسجل الدخول حتى تظهر طلباتك.</p><div class="stats"><div class="stat">النشطة <b id="count">0</b></div><div class="stat">تم التسليم اليوم <b id="done">0</b></div><div class="stat">أجرتك اليوم <b id="fees">0</b></div></div></div>
<div class="login"><div class="login-grid"><select id="driver"><option value="">اختيار السائق</option></select><input id="pin" inputmode="numeric" placeholder="PIN السائق" maxlength="8"><button onclick="login()">دخول</button></div><div id="onlineBox" class="online" style="display:none"><span id="availabilityText">الحالة: غير متاح</span><button id="toggleBtn" class="toggle" onclick="toggleAvailability()">🟢 أصبحت متاحاً</button></div></div>
<div id="list"></div><div class="history-title">📚 آخر الطلبات المسلّمة</div><div id="history"></div></div>
<script>
let drivers=[],orders=[],driverId=localStorage.getItem('kiwi_driver_id')||'',logged=false;const money=n=>Number(n||0).toLocaleString('en-US')+' د.ع';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const items=o=>Array.isArray(o.items)?o.items:(Array.isArray(o.orderItems)?o.orderItems:[]);const total=o=>Number(o.total??items(o).reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||x.quantity||1),0));function isDel(o){return o.order_type==='delivery'||o.deliveryLocation||o.landmark||o.deliveryStatus||o.driverId}function s(o){return o.deliveryStatus||o.status||'pending'}function sl(s){return ({pending:'طلب جديد',approved:'مقبول',preparing:'قيد التحضير',ready:'جاهز',assigned:'تم تعيينك',out_for_delivery:'قيد التوصيل',delivered:'تم التسليم',cancelled:'ملغي'}[s]||s)}function time(v){try{const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'—':d.toLocaleString('ar-IQ',{dateStyle:'short',timeStyle:'short'})}catch(e){return'—'}}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>o.stop(),220)}catch(e){}}
function listenDrivers(){db.collection('delivery_drivers').where('active','==',true).onSnapshot(snap=>{drivers=snap.docs.map(d=>({id:d.id,...d.data()}));const sel=document.getElementById('driver');const old=sel.value||driverId;sel.innerHTML='<option value="">اختيار السائق</option>'+drivers.map(d=>`<option value="${esc(d.id)}">${esc(d.name)} — ${esc(d.phone||'')}</option>`).join('');sel.value=old;updateWho();render()})}
function listenOrders(){const map=new Map();const merge=snap=>{snap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));orders=[...map.values()].filter(isDel);render();};db.collection('orders').where('order_type','==','delivery').onSnapshot(merge);db.collection('orders').where('order_type','==','takeaway').onSnapshot(merge)}
function updateWho(){const d=drivers.find(x=>x.id===driverId);document.getElementById('who').textContent=logged&&d?`مرحباً ${d.name} — الطلبات الخاصة بك فقط.`:'اختار اسمك وسجل الدخول حتى تظهر طلباتك.';document.getElementById('onlineBox').style.display=logged?'flex':'none';if(logged&&d){const on=!!d.available;document.getElementById('availabilityText').textContent=on?'الحالة: 🟢 متاح لاستلام الطلبات':'الحالة: ⚪ غير متاح';const b=document.getElementById('toggleBtn');b.textContent=on?'⛔ إيقاف التوفر':'🟢 أصبحت متاحاً';b.className='toggle '+(on?'on':'')}}
function login(){const id=document.getElementById('driver').value,pin=document.getElementById('pin').value.trim(),d=drivers.find(x=>x.id===id);if(!d){alert('اختار السائق أولاً');return}if(String(d.pin||'')!==pin){alert('PIN غير صحيح');return}driverId=id;logged=true;localStorage.setItem('kiwi_driver_id',id);localStorage.setItem('kiwi_driver_logged','1');updateWho();touch();render();}
function touch(){if(!logged||!driverId)return;db.collection('delivery_drivers').doc(driverId).update({lastSeen:firebase.firestore.FieldValue.serverTimestamp(),available:true}).catch(()=>{})}
async function toggleAvailability(){if(!logged)return;const d=drivers.find(x=>x.id===driverId);const to=!d?.available;try{await db.collection('delivery_drivers').doc(driverId).update({available:to,lastSeen:firebase.firestore.FieldValue.serverTimestamp()});}catch(e){alert(e.message)}}
function openMap(q){if(!q)return;window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q),'_blank','noopener')}function callPhone(p){if(p)location.href='tel:'+p}
function render(){if(!logged){document.getElementById('list').innerHTML='<div class="empty">سجل الدخول أولاً حتى تظهر طلباتك.</div>';return}const active=orders.filter(o=>o.driverId===driverId&&['assigned','ready','out_for_delivery'].includes(s(o))).sort((a,b)=>(b.orderSequence||0)-(a.orderSequence||0));document.getElementById('count').textContent=active.length;document.getElementById('list').innerHTML=active.length?active.map(card).join(''):'<div class="empty">ماكو طلبات موكلة إلك حالياً.</div>';const hist=orders.filter(o=>o.driverId===driverId&&s(o)==='delivered').sort((a,b)=>(b.deliveredAt?.toMillis?.()||0)-(a.deliveredAt?.toMillis?.()||0)).slice(0,30);document.getElementById('history').innerHTML=hist.length?hist.map(o=>`<div class="card"><div class="topline"><b>#${esc(o.id)}</b><span class="badge done">✅ تم التسليم</span></div><div class="meta">💰 ${money(total(o))} — أجرتك ${money(o.driverFee||0)}<br>🕒 ${time(o.deliveredAt||o.updatedAt)}</div></div>`).join(''):'<div class="empty">لا توجد طلبات مسلّمة بعد.</div>';document.getElementById('done').textContent=hist.length;document.getElementById('fees').textContent=money(hist.reduce((a,o)=>a+Number(o.driverFee||0),0))}
function card(o){const st=s(o);let buttons='';if(st==='assigned'||st==='ready')buttons+=`<button class="pickup" onclick="pickup('${esc(o.id)}')">📦 استلمت الطلب</button>`;if(st==='out_for_delivery')buttons+=`<button class="deliver" onclick="delivered('${esc(o.id)}')">✅ تم التسليم واستلام المبلغ</button>`;return `<article class="card"><div class="topline"><b>🚚 طلب #${esc(o.id)}</b><span class="badge ${st==='out_for_delivery'?'out':'ready'}">${sl(st)}</span></div><div class="items">${items(o).map(x=>`• ${esc(x.name||x.title||'صنف')} × ${Number(x.qty||x.quantity||1)}${x.note?` — ${esc(x.note)}`:''}`).join('<br>')}</div><div class="meta">📞 <b>${esc(o.customerPhone||'—')}</b><br>📍 <b>${esc(o.deliveryLocation||'—')}</b><br>🧭 ${esc(o.landmark||'—')}<br>💳 ${o.paymentMethod==='card'?'بطاقة':o.paymentMethod==='prepaid'?'مدفوع مسبقاً':'نقدي'} — ${o.paymentStatus==='collected'?'تم التحصيل':'المبلغ عند التسليم'}<br>💰 <span class="money">${money(total(o))}</span><br>💵 أجرتك: <b>${money(o.driverFee||0)}</b></div><div class="actions"><button class="map" onclick="openMap('${esc(o.deliveryLocation||'')}')">🗺️ فتح الموقع</button><button class="call" onclick="callPhone('${esc(o.customerPhone||'')}')">📞 اتصال بالزبون</button>${buttons}</div></article>`}
async function pickup(id){try{await db.collection('orders').doc(id).update({status:'out_for_delivery',deliveryStatus:'out_for_delivery',pickedUpAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});beep()}catch(e){alert('تعذر تسجيل الاستلام: '+e.message)}}
async function delivered(id){const o=orders.find(x=>x.id===id);if(!confirm('تأكيد أن الطلب تم تسليمه؟'+(o?.paymentMethod==='cash'?'\nسيتم تسجيل المبلغ كمُحصّل نقداً.':'')))return;try{await db.collection('orders').doc(id).update({status:'delivered',deliveryStatus:'delivered',paymentStatus:o?.paymentMethod==='cash'?'collected':(o?.paymentStatus||'paid'),deliveredAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});beep()}catch(e){alert('تعذر تسجيل التسليم: '+e.message)}}
listenDrivers();listenOrders();setInterval(()=>{if(logged)touch()},20000);if(localStorage.getItem('kiwi_driver_logged')==='1'&&driverId){setTimeout(()=>{document.getElementById('driver').value=driverId;logged=true;updateWho();render()},900)}
window.addEventListener('beforeunload',()=>{if(logged&&driverId)db.collection('delivery_drivers').doc(driverId).update({available:false}).catch(()=>{})});
</script></body></html>
