<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | شاشة السائق</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script>const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd0721a2d6ec4d73",measurementId:"G-K916WX9ZH8"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();firebase.auth().signInAnonymously().catch(console.warn);</script><style>*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#18212b;font-family:Arial,Tahoma}.wrap{max-width:800px;margin:auto;padding:18px}.head{background:#172433;color:#fff;border-radius:20px;padding:18px}.card{background:#fff;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 5px 20px #0001}.login{display:grid;grid-template-columns:1fr 1fr;gap:10px}.login input,.login select,button{padding:12px;border-radius:11px;border:1px solid #ccd3da;font:inherit}.login button{background:#172433;color:#fff;font-weight:900}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:7px 0}.badge{background:#e7edf4;padding:6px 10px;border-radius:99px;font-weight:900;font-size:12px}.items{background:#f6f7f8;border-radius:12px;padding:11px;line-height:1.9}.primary,.green,.map{width:100%;border:0;color:#fff;font-weight:900;margin-top:8px}.primary{background:#315ea8}.green{background:#23804f}.map{background:#172433}.muted{color:#6c7680;font-size:12px}.empty{text-align:center;color:#888;padding:35px}.stat{display:inline-block;background:#fff;padding:10px 15px;border-radius:12px;margin-top:10px}.stat b{font-size:22px}@media(max-width:550px){.login{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><h1>📱 شاشة سائق التوصيل</h1><div id="who">اختار اسم السائق حتى تظهر طلباته.</div><div class="stat">طلباتك النشطة <b id="count">0</b></div></div><div class="card login"><select id="driver"><option value="">اختيار السائق</option></select><button onclick="saveDriver()">دخول</button></div><div id="list"></div></div><script>let drivers=[],orders=[],driverId=localStorage.getItem('kiwi_driver_id')||'';const money=n=>Number(n||0).toLocaleString('en-US')+' د.ع';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function init(){db.collection('delivery_drivers').where('active','==',true).onSnapshot(s=>{drivers=s.docs.map(d=>({id:d.id,...d.data()}));driver.innerHTML='<option value="">اختيار السائق</option>'+drivers.map(d=>`<option value="${esc(d.id)}">${esc(d.name)} — ${esc(d.phone||'')}</option>`).join('');driver.value=driverId;who.textContent=drivers.find(d=>d.id===driverId)?.name||'اختار اسم السائق حتى تظهر طلباته.';render()});db.collection('orders').where('order_type','==','delivery').onSnapshot(s=>{orders=s.docs.map(d=>({id:d.id,...d.data()}));render()})}function saveDriver(){driverId=driver.value;localStorage.setItem('kiwi_driver_id',driverId);who.textContent=drivers.find(d=>d.id===driverId)?.name||'اختار اسم السائق';render()}function render(){const active=orders.filter(o=>o.driverId===driverId&&['ready','out_for_delivery'].includes(o.status)).sort((a,b)=>Number(b.orderSequence||0)-Number(a.orderSequence||0));count.textContent=active.length;if(!driverId){list.innerHTML='<div class="empty">اختار السائق أولاً.</div>';return}if(!active.length){list.innerHTML='<div class="empty">ماكو طلبات موكلة إلك حالياً.</div>';return}list.innerHTML=active.map(o=>`<div class="card"><div class="row"><b>طلب #${esc(o.id)}</b><span class="badge">${o.status==='ready'?'جاهز للاستلام':'معك بالطريق'}</span></div><div class="row"><span>📞 ${esc(o.customerPhone||'—')}</span><b>${money(o.total)}</b></div><p><b>📍 العنوان:</b><br>${esc(o.deliveryLocation||'—')}</p><p class="muted">🧭 ${esc(o.landmark||'—')}</p><div class="items">${(o.items||[]).map(x=>`• ${esc(x.name)} × ${Number(x.qty||1)}`).join('<br>')}</div>${o.status==='ready'?`<button class="primary" onclick="pickup('${esc(o.id)}')">📦 استلمت الطلب من المطعم</button>`:''}${o.status==='out_for_delivery'?`<button class="map" onclick="openMap('${esc(o.deliveryLocation||'')}')">🗺️ فتح الموقع</button><button class="green" onclick="delivered('${esc(o.id)}')">✅ تم التسليم واستلام المبلغ</button>`:''}</div>`).join('')}async function pickup(id){await db.collection('orders').doc(id).update({status:'out_for_delivery',deliveryStatus:'out_for_delivery',pickedUpAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}async function delivered(id){if(!confirm('تأكيد أن الطلب تم تسليمه؟'))return;await db.collection('orders').doc(id).update({status:'delivered',deliveryStatus:'delivered',deliveredAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()})}function openMap(q){if(!q)return;const u='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);window.open(u,'_blank','noopener')}init();</script></body></html>
