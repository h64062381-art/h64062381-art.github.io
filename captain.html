<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI — الكابتن</title><style>body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#101510;color:#fff;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.head h1{margin:0;color:#f0d58c}.refresh{border:1px solid #c9a45b;background:#173f2b;color:#f0d58c;border-radius:12px;padding:10px 14px;font-weight:700}.status{color:#aaa;font-size:12px;margin-bottom:12px}.order{background:#18241d;border:1px solid #c9a45b55;border-radius:18px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.table{font-size:18px;font-weight:900;color:#f0d58c}.items{line-height:2;color:#eee}.total{font-weight:900;color:#f0d58c}.empty{text-align:center;padding:50px 10px;color:#aaa}.time{font-size:11px;color:#999}.done{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#f0d58c;color:#17130b;font-weight:900}</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd072d9d7171a2d6ec4d73",measurementId:"G-K916WX9ZH8"};firebase.initializeApp(firebaseConfig);const kiwiDB=firebase.firestore();</script>
</head><body><div class="head"><h1>KIWI — الكابتن</h1><div style="display:flex;gap:8px"><button class="refresh" onclick="enableSound()">🔔 تفعيل التنبيه</button><button class="refresh" onclick="loadOrders()">تحديث</button></div></div><div class="status" id="status">جاري تحميل الطلبات...</div><div id="orders"></div><script>let rows=[];let soundEnabled=false;let knownIds=new Set();let firstLoad=true;function enableSound(){soundEnabled=true;try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();c.resume();const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.001;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08);document.getElementById('status').textContent='تم تفعيل صوت التنبيه 🔔';}catch(e){}}function beep(){if(!soundEnabled)return;try{const C=window.AudioContext||window.webkitAudioContext;const c=new C();c.resume();[0,180,360].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880+i*140;g.gain.setValueAtTime(.0001,c.currentTime+d/1000);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+d/1000+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+d/1000+.16);o.connect(g);g.connect(c.destination);o.start(c.currentTime+d/1000);o.stop(c.currentTime+d/1000+.18)});}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function loadOrders(){document.getElementById('status').textContent='جاري تحديث الطلبات...';kiwiDB.collection('orders').where('status','==','pending').get().then(s=>{const fresh=s.docs.filter(d=>!knownIds.has(d.id));if(!firstLoad&&fresh.length)beep();knownIds=new Set(s.docs.map(d=>d.id));rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const aa=a.createdAt?.toMillis?a.createdAt.toMillis():0,bb=b.createdAt?.toMillis?b.createdAt.toMillis():0;return bb-aa});render();firstLoad=false;document.getElementById('status').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-IQ')}).catch(e=>{console.error(e);document.getElementById('status').textContent='تعذر تحميل الطلبات من Firebase.'})}function render(){const box=document.getElementById('orders');if(!rows.length){box.innerHTML='<div class="empty">ماكو طلبات جديدة حالياً.</div>';return}box.innerHTML=rows.map((o,i)=>{const items=Array.isArray(o.items)?o.items.map(x=>`${esc(x.name)} ×${esc(x.qty)}`).join('، '):esc(o.order||'');const tm=o.createdAt?.toDate?o.createdAt.toDate().toLocaleTimeString('ar-IQ') : '';return `<div class="order"><div class="row"><span class="table">طاولة ${esc(o.table||o.table_number||'—')}</span><span class="time">${tm}</span></div><div class="items">${items}</div><div class="row"><span>المجموع</span><span class="total">${Number(o.total||0).toLocaleString('en-US')} IQD</span></div><button class="done" onclick="markDone(${i})">موافقة على الطلب ✓</button></div>`}).join('')}async function markDone(i){if(!rows[i])return;try{await kiwiDB.collection('orders').doc(rows[i].id).update({status:'approved',approvedAt:firebase.firestore.FieldValue.serverTimestamp()});rows.splice(i,1);render()}catch(e){alert('تعذر تأكيد الطلب')}}loadOrders();setInterval(loadOrders,5000);</script></body></html>
