<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI — الكابتن</title><style>body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#101510;color:#fff;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.head h1{margin:0;color:#f0d58c}.refresh{border:1px solid #c9a45b;background:#173f2b;color:#f0d58c;border-radius:12px;padding:10px 14px;font-weight:700}.status{color:#aaa;font-size:12px;margin-bottom:12px}.order{background:#18241d;border:1px solid #c9a45b55;border-radius:18px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.table{font-size:18px;font-weight:900;color:#f0d58c}.items{line-height:2;color:#eee}.total{font-weight:900;color:#f0d58c}.empty{text-align:center;padding:50px 10px;color:#aaa}.time{font-size:11px;color:#999}.done{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:#f0d58c;color:#17130b;font-weight:900}</style></head><body><div class="head"><h1>KIWI — الكابتن</h1><button class="refresh" onclick="loadOrders()">تحديث</button></div><div class="status" id="status">جاري تحميل الطلبات...</div><div id="orders"></div><script>const API='https://script.google.com/macros/s/AKfycbyQRYAvAMVPOsI_V8tjnX1B1zW-KlL31twcGCa1rkeZQhNp2cUybzvmUdxwllP_HvY/exec';let rows=[];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function loadOrders(){document.getElementById('status').textContent='جاري تحديث الطلبات...';fetch(API+'?t='+Date.now()).then(r=>r.json()).then(d=>{rows=d.orders||[];render();document.getElementById('status').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-IQ')}).catch(()=>document.getElementById('status').textContent='تعذر تحميل الطلبات. تأكد من نشر Apps Script كـ تطبيق ويب.')}function render(){const box=document.getElementById('orders');if(!rows.length){box.innerHTML='<div class="empty">ماكو طلبات جديدة حالياً.</div>';return}box.innerHTML=rows.map((o,i)=>`<div class="order"><div class="row"><span class="table">طاولة ${esc(o.table||'—')}</span><span class="time">${esc(o.time||'')}</span></div><div class="items">${esc(o.order||'')}</div><div class="row"><span>المجموع</span><span class="total">${esc(o.total||0)} IQD</span></div><button class="done" onclick="markDone(${i})">تم رفعه للبيان</button></div>`).join('')}function markDone(i){rows.splice(i,1);render()}loadOrders();setInterval(loadOrders,15000);</script></body></html>
