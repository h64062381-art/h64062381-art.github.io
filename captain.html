<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>KIWI — الكابتن والصالة</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:10;text-align:center}
h1{margin:0 0 10px;font-size:24px}
button{border:0;border-radius:11px;padding:11px 15px;font-size:16px;font-weight:800;cursor:pointer}
.header-btn{background:#fff;color:#111;margin:3px}.captain-nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.captain-nav button{background:#fff;color:#111;min-height:58px}.captain-nav .active{background:#c9a45b;color:#111}.captain-panel{display:none}.captain-panel.active{display:block}.hall-card{background:#fff;border:2px solid #16a34a;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0001}.hall-card .items{font-size:18px;font-weight:900}.table-grid-all{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px}.all-table{background:#fff;border:2px solid #ddd;border-radius:14px;padding:13px;text-align:center}.all-table.busy{border-color:#c9a45b}.all-table .tn{font-size:22px;font-weight:900}.all-table button{width:100%;background:#111;color:#fff;margin-top:8px}.ready-section{animation:readyPulse 1.2s ease}.ready-card{border:2px solid #c9a45b}.ready-card button{font-weight:900}@keyframes readyPulse{0%{transform:scale(.99);opacity:.75}100%{transform:scale(1);opacity:1}}
#status{padding:10px;text-align:center;color:#666;background:#fff}
.wrap{max-width:900px;margin:auto;padding:14px}
.section-title{font-size:20px;font-weight:900;margin:8px 0 12px}
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.table-card{background:#fff;border:2px solid #ddd;border-radius:16px;padding:18px;text-align:center;box-shadow:0 2px 10px #0001}
.table-card.has-orders{border-color:#c9a45b}
.table-num{font-size:24px;font-weight:900}
.table-total{margin:8px 0;font-size:18px;font-weight:900}
.table-state{font-size:13px;color:#666;margin-bottom:10px}
.open-table{background:#111;color:#fff;width:100%}
.ready-section{margin-top:24px;display:none}
.ready-card{background:#fffdf5;border:2px solid #c9a45b;border-radius:15px;padding:15px;margin:10px 0}
.new-card{background:#fff;border-right:5px solid #16a34a;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 10px #0001}
.items{background:#fafafa;border-radius:10px;padding:10px;line-height:1.9;margin:10px 0}
.row{display:flex;justify-content:space-between;gap:10px;margin:7px 0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:13px;font-weight:900;background:#eee}
.badge.ready{background:#c9a45b;color:#111}
.badge.served{background:#dfeee2;color:#173f2b}
.badge.new{background:#dcfce7;color:#166534}
.primary{background:#111;color:#fff;width:100%;margin-top:8px}
.green{background:#173f2b;color:#fff;width:100%;margin-top:8px}
.gold{background:#c9a45b;color:#111;width:100%;margin-top:8px}
.danger{background:#9b2c2c;color:#fff;width:100%;margin-top:8px}
.empty{text-align:center;color:#777;padding:35px 10px;background:#fff;border-radius:14px}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:100;padding:12px;overflow:auto}
.modal-box{max-width:760px;margin:20px auto;background:#f4f4f4;border-radius:18px;padding:14px}
.modal-head{background:#111;color:#fff;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;z-index:2}
.close{background:#fff;color:#111}
.order-card{background:#fff;border:1px solid #ddd;border-radius:13px;padding:13px;margin:10px 0}
.total-box{background:#173f2b;color:#fff;border-radius:14px;padding:16px;margin:12px 0;text-align:center}
.total-box .big{font-size:27px;font-weight:900;margin-top:5px}
.bill-area{margin-top:12px;padding-top:12px;border-top:2px dashed #ccc}
.small{font-size:13px;color:#777}
.file-btn{display:none}
.invoice-modal{display:none;position:fixed;inset:0;background:#0009;z-index:200;padding:12px;overflow:auto}
.invoice-box{max-width:620px;margin:20px auto;background:#fff;border-radius:18px;padding:18px}
.invoice-head{text-align:center;font-size:24px;font-weight:900;padding:8px}
.invoice-table{text-align:center;font-weight:900;margin-bottom:12px}
.invoice-line{border-top:1px dashed #bbb;padding:12px 0}
.invoice-items{background:#f7f7f7;border-radius:9px;padding:8px;line-height:1.8;margin:7px 0}
.invoice-total{background:#173f2b;color:#fff;border-radius:12px;padding:15px;text-align:center;font-size:22px;font-weight:900;margin-top:12px}
.invoice-note{padding:10px 0}
.invoice-box{max-width:680px;margin:18px auto;background:#fff;border-radius:22px;padding:0;overflow:hidden;box-shadow:0 18px 60px #0005}
.invoice-top{background:linear-gradient(135deg,#173f2b,#245c3f);color:#fff;padding:26px 20px;text-align:center}
.invoice-logo{font-size:34px;font-weight:1000;letter-spacing:1px}
.invoice-sub{font-size:14px;opacity:.9;margin-top:5px}
.invoice-meta{display:flex;justify-content:space-between;gap:10px;background:#f6f7f5;padding:14px 18px;font-size:13px;direction:rtl}
.invoice-meta b{font-size:15px}
.invoice-body{padding:16px 18px;background:#fff}
.invoice-line{border-bottom:1px dashed #cfcfcf;padding:14px 0}
.invoice-line:last-of-type{border-bottom:0}
.invoice-item-title{font-size:16px;font-weight:900}
.invoice-item-detail{font-size:13px;color:#555;margin-top:5px;line-height:1.8}
.invoice-line-total{display:flex;justify-content:space-between;margin-top:8px;font-weight:800}
.invoice-grand{margin:8px 18px 0;background:#173f2b;color:#fff;border-radius:15px;padding:17px;text-align:center}
.invoice-grand .label{font-size:13px;opacity:.9}
.invoice-grand .value{font-size:28px;font-weight:1000;margin-top:3px}
.invoice-thanks{text-align:center;padding:20px 18px 6px;color:#173f2b;font-weight:800;font-size:16px}
.invoice-note2{text-align:center;color:#777;font-size:12px;padding:0 18px 18px;line-height:1.8}
.invoice-actions{display:flex;gap:9px;padding:0 18px 20px}
.invoice-actions button{flex:1}
@media print{
 body>*{display:none!important}
 #invoiceModal{display:block!important;position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}
 #invoiceModal .invoice-box{box-shadow:none!important;max-width:none!important;margin:0!important;border-radius:0!important}
 #invoiceModal .modal-head,#invoiceModal .invoice-actions{display:none!important}
 @page{size:A4;margin:10mm}
}

.edit-modal{display:none;position:fixed;inset:0;background:#0009;z-index:220;padding:12px;overflow:auto}
.edit-box{max-width:700px;margin:20px auto;background:#fff;border-radius:18px;padding:18px}
.edit-row{display:grid;grid-template-columns:1fr 90px 110px 48px;gap:7px;align-items:center;margin:8px 0}
.edit-row input{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;font-size:15px}
.edit-row button{padding:8px;background:#9b2c2c;color:#fff}
.edit-labels{display:grid;grid-template-columns:1fr 90px 110px 48px;gap:7px;font-size:12px;color:#666;font-weight:800}
.edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.add-item{background:#173f2b;color:#fff}
.save-edit{background:#c9a45b;color:#111}
.menu-modal{display:none;position:fixed;inset:0;background:#0009;z-index:260;padding:12px;overflow:auto}
.menu-box{max-width:760px;margin:18px auto;background:#f4f4f4;border-radius:18px;padding:14px}
.menu-search{width:100%;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:16px;margin:10px 0}
.menu-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.menu-item{background:#fff;border:1px solid #ddd;border-radius:14px;padding:13px;text-align:right}
.menu-item .menu-name{font-weight:900;font-size:16px;line-height:1.5}
.menu-item .menu-cat{font-size:12px;color:#777;margin-top:3px}
.menu-item .menu-price{font-weight:900;color:#173f2b;margin:8px 0}
.menu-item button{width:100%;background:#173f2b;color:#fff}
.menu-empty{text-align:center;padding:30px;color:#777;background:#fff;border-radius:14px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyAQ9WanobYNjUbozIcWQrhDBCT82-RqMMU4",
authDomain:"kiwiresturant-30ff4.firebaseapp.com",
projectId:"kiwiresturant-30ff4",
storageBucket:"kiwiresturant-30ff4.firebasestorage.app",
messagingSenderId:"329950339210",
appId:"1:329950339210:web:bd072d9d7171a2d6ec4d73"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let allOrders=[];
let stop=null;
let currentTable=null;

function esc(v){
 return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function tableOf(o){ return String(o.table ?? o.table_number ?? o.tableNumber ?? '—'); }
function num(v){ const n=Number(v); return Number.isFinite(n)?n:0; }
function money(v){ return num(v).toLocaleString('en-US')+' د.ع'; }

function itemList(o){
 if(Array.isArray(o.items)) return o.items;
 if(Array.isArray(o.orderItems)) return o.orderItems;
 return [];
}
function orderTotal(o){
 if(o.total!==undefined && o.total!==null && !isNaN(Number(o.total))) return num(o.total);
 return itemList(o).reduce((s,x)=>s+num(x.price)*num(x.qty||x.quantity||1),0);
}
function itemText(o){
 const items=itemList(o);
 if(items.length) return items.map(x=>`${esc(x.name||x.title||'طلب')} × ${esc(x.qty||x.quantity||1)}${x.note?`<div style="font-size:11px;color:#9a7024;margin-top:2px">📝 ${esc(x.note)}</div>`:''}`).join('<br>');
 return esc(o.order||o.items||'—');
}
function statusText(s){
 return s==='pending'?'🔔 طلب جديد':
        s==='approved'?'👍 مقبول':
        s==='preparing'?'🟡 قيد التحضير':
        s==='ready'?'🍽️ جاهز من المطبخ':
        s==='served'?'✅ تم الاستلام':'';
}

/* الطلبات التي تبقى في الصالة:
   pending = طلب جديد
   approved/preparing = الطلب مقبول/قيد التحضير
   ready = وصل من المطبخ
   served = استلمه الكابتن
   billed لا يظهر بعد رفع الفاتورة */
function listenOrders(){
 if(stop) stop();
 stop=db.collection('orders')
   .where('status','in',['pending','approved','preparing','ready','served'])
   .onSnapshot(snap=>{
      allOrders=snap.docs.map(d=>({id:d.id,...d.data()}));
      renderAll();
      document.getElementById('status').textContent='متصل — آخر تحديث: '+new Date().toLocaleTimeString('ar-IQ');
   },err=>{
      console.error(err);
      document.getElementById('status').textContent='تعذر جلب الطلبات. تأكد من اتصال Firebase.';
   });
}

function activeTables(){
 const map=new Map();
 allOrders.forEach(o=>{
   const t=tableOf(o);
   if(t==='—') return;
   if(!map.has(t)) map.set(t,[]);
   map.get(t).push(o);
 });
 return map;
}

function renderAll(){
 renderTables();
 renderReady();
 renderHallOrders();
 renderAllTables();
 if(currentTable!==null) renderTableModal();
}

function renderTables(){
 const box=document.getElementById('tables');
 const map=activeTables();
 box.innerHTML=Array.from({length:42},(_,i)=>{
   const t=String(i+1), orders=map.get(t)||[];
   const total=orders.reduce((s,o)=>s+orderTotal(o),0);
   const ready=orders.filter(o=>o.status==='ready').length;
   return `<div class="all-table ${orders.length?'busy':''}">
      <div class="tn">🪑 ${t}</div>
      <div class="table-state">${orders.length?`${orders.length} طلب • ${money(total)}`:'فارغة'}${ready?`<br>🟢 ${ready} جاهز`:''}</div>
      <button onclick="openTable('${t}')">فتح الطاولة</button>
   </div>`;
 }).join('');
}

function renderAllTables(){
 const box=document.getElementById('allTables');
 if(!box)return;
 const map=activeTables();
 box.innerHTML=Array.from({length:42},(_,i)=>{
   const t=String(i+1), orders=map.get(t)||[];
   return `<div class="all-table ${orders.length?'busy':''}"><div class="tn">🪑 طاولة ${t}</div><div class="table-state">${orders.length?`عليها ${orders.length} طلب`:'فارغة'}</div><button onclick="openTable('${t}')">فتح</button></div>`;
 }).join('');
}

function renderHallOrders(){
 const box=document.getElementById('hallOrders'),count=document.getElementById('hallCount');
 if(!box)return;
 const rows=allOrders.filter(o=>o.status==='pending' && !isTakeawayOrder(o));
 count.textContent=rows.length?`(${rows.length})`:'';
 if(!rows.length){box.innerHTML='<div class="empty">ماكو طلبات صالة جديدة حالياً</div>';return;}
 box.innerHTML=rows.map(o=>`<div class="hall-card">
   <div class="row"><b>🪑 طاولة ${esc(tableOf(o))}</b><span class="badge new">🔔 طلب جديد</span></div>
   <div class="items">${itemText(o)}</div>
   <div class="row"><b>المجموع</b><b>${money(orderTotal(o))}</b></div>
   <button class="green" onclick="acceptOrder('${esc(o.id)}')">✅ موافقة وإرسال للأقسام</button>
 </div>`).join('');
}

function showCaptainPanel(id,btn){
 document.querySelectorAll('.captain-panel').forEach(x=>x.classList.remove('active'));
 document.querySelectorAll('.captain-nav button').forEach(x=>x.classList.remove('active'));
 const el=document.getElementById(id); if(el)el.classList.add('active');
 if(btn)btn.classList.add('active');
 if(id==='readyPanel'){readyOpen=true;renderReady();}
}

let readyOpen=false;

function deptLabel(d){return ({kitchen:'🍳 المطبخ',barista:'☕ الباريستا',appetizers:'🥗 المقبلات',grills:'🔥 المشويات',hookah:'💨 الأركيلة'})[d]||d;}
function departmentForItem(x){
 const d=String(x?.department||'').toLowerCase();
 const s=String(x?.sectionId||'').toLowerCase();
 if(['grills','kitchen','barista','appetizers','hookah'].includes(d)) return d;
 if(s==='grills') return 'grills';
 if(['cold-app','hot-app'].includes(s)) return 'appetizers';
 if(['fresh','natural','soft','water','mojito','cold','milkshake','ice','hot','coffee','desserts'].includes(s)) return 'barista';
 if(['hookah','hookah-luxury','hookah-natural'].includes(s)) return 'hookah';
 return 'kitchen';
}
function departmentGroups(o){
 const groups={};
 itemList(o).forEach(x=>{const d=departmentForItem(x);(groups[d]||(groups[d]=[])).push(x)});
 return groups;
}
function normalizedItems(o){
 return itemList(o).map(x=>({...x,department:departmentForItem(x)}));
}
function readyDepartments(o){
 const groups=departmentGroups(o), ds=o.departmentStatus||{};
 return Object.keys(groups).filter(d=>ds[d]==='ready');
}
function allDepartmentsReady(o){
 const groups=departmentGroups(o), ds=o.departmentStatus||{};
 return Object.keys(groups).every(d=>ds[d]==='ready');
}
function toggleReady(){
 const ready=allOrders.filter(o=>!isTakeawayOrder(o)&&readyDepartments(o).length);
 if(!ready.length){alert('ماكو أقسام جاهزة حالياً.');return;}
 readyOpen=!readyOpen;document.getElementById('readySection').style.display=readyOpen?'block':'none';
}
let lastReadySignature='';
function renderReady(){
 const sec=document.getElementById('readySection'),box=document.getElementById('readyOrders'),count=document.getElementById('readyCount');
 const ready=allOrders.filter(o=>!isTakeawayOrder(o)&&readyDepartments(o).length);
 const totalReady=ready.reduce((n,o)=>n+readyDepartments(o).length,0);
 count.textContent=totalReady?`(${totalReady})`:'';
 if(!ready.length){box.innerHTML='<div class="empty">ماكو طلبات جاهزة من الأقسام حالياً</div>';lastReadySignature='';return;}
 const signature=ready.flatMap(o=>readyDepartments(o).map(d=>`${o.id}:${d}`)).sort().join('|');
 if(signature!==lastReadySignature){
   readyOpen=true;
   lastReadySignature=signature;
   try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
 }
 sec.style.display='block';
 box.innerHTML=ready.map(o=>{
   const groups=departmentGroups(o), ds=o.departmentStatus||{};
   return `<div class="ready-card">
   <div class="row"><b>${isTakeawayOrder(o)?'🛍️ سفري':'🪑 طاولة '+esc(tableOf(o))}</b><span class="badge ready">طلب #${esc(o.id)}</span></div>
   ${Object.keys(groups).map(d=>{const isReady=ds[d]==='ready';return `<div style="border-top:1px dashed #ddd;padding:10px 0"><div class="row"><b>${deptLabel(d)}</b><span class="badge ${isReady?'ready':''}">${isReady?'🟢 جاهز':'⏳ بانتظار القسم'}</span></div><div class="items">${groups[d].map(x=>`${esc(x.name||'صنف')} × ${esc(x.qty||x.quantity||1)}`).join('<br>')}</div>${isReady?`<button class="green" onclick="takeDepartment('${esc(o.id)}','${esc(d)}')">استلم ${deptLabel(d)}</button>`:''}</div>`}).join('')}
   <div class="row"><b>المجموع</b><b>${money(orderTotal(o))}</b></div>
   ${allDepartmentsReady(o)?`<button class="green" onclick="takeReady('${esc(o.id)}')">✅ استلام الطلب كامل</button>`:''}
 </div>`;
 }).join('');
}
function isTakeawayOrder(o){return !String(o.table??o.table_number??o.tableNumber??'').trim();}
async function takeDepartment(id,dept){
 try{await db.collection('orders').doc(id).update({[`departmentStatus.${dept}`]:'served',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});renderReady();}
 catch(e){alert('تعذر استلام القسم: '+(e.message||'خطأ'));}
}

function openTable(t){
 currentTable=String(t);
 document.getElementById('tableModal').style.display='block';
 document.body.style.overflow='hidden';
 renderTableModal();
}
function closeTable(){
 currentTable=null;
 document.getElementById('tableModal').style.display='none';
 document.body.style.overflow='';
}
function renderTableModal(){
 if(currentTable===null)return;
 const orders=allOrders.filter(o=>tableOf(o)===String(currentTable));
 const total=orders.reduce((s,o)=>s+orderTotal(o),0);
 document.getElementById('tableTitle').textContent='🪑 طاولة '+currentTable;
 document.getElementById('tableBody').innerHTML=orders.length?orders.map(o=>`
   <div class="order-card">
     <div class="row"><b>الطلب</b><span class="badge ${o.status==='ready'?'ready':o.status==='served'?'served':o.status==='pending'?'new':''}">${statusText(o.status)}</span></div>
     <div class="items">${itemText(o)}</div>
     <div class="row"><span>حساب الطلب</span><b>${money(orderTotal(o))}</b></div>
     ${o.status==='pending'?`<button class="primary" onclick="acceptOrder('${esc(o.id)}')">قبول الطلب</button>`:''}
     ${o.status==='ready'?`<button class="green" onclick="takeReady('${esc(o.id)}')">استلام الطلب</button>`:''}
     ${o.status!=='billed'?`<button class="primary" onclick="openEditOrder('${esc(o.id)}')">✏️ تعديل / إضافة للطلب</button>`:''}
   </div>
 `).join(''):'<div class="empty">ماكو طلبات بهالطاولة</div>';

 document.getElementById('tableTotal').innerHTML=`المجموع الكلي للطاولة<div class="big">${money(total)}</div>`;
 document.getElementById('billArea').innerHTML=orders.length?`
   <div class="bill-area">
     <button class="gold" onclick="showInvoice('${esc(currentTable)}')">🧾 إصدار الفاتورة</button>
   </div>`:'';
}

let lastInvoicePrint='';

function buildInvoiceHtml(table, orders, total, invoiceNumber, issued=false){
 const now=new Date();
 const date=now.toLocaleDateString('ar-IQ');
 const time=now.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
 const body=orders.map((o,i)=>`
   <div class="invoice-line">
     <div class="invoice-item-title">طلب ${i+1}</div>
     <div class="invoice-item-detail">${itemText(o)}</div>
     <div class="invoice-line-total"><span>حساب الطلب</span><b>${money(orderTotal(o))}</b></div>
   </div>
 `).join('');
 return `
   <div class="invoice-top">
     <div class="invoice-logo">🥝 KIWI</div>
     <div class="invoice-sub">مطعم كيوي — أهلاً وسهلاً بكم</div>
   </div>
   <div class="invoice-meta">
     <div><span>رقم الفاتورة</span><br><b>${esc(invoiceNumber||'غير مصدرة بعد')}</b></div>
     <div><span>الطاولة</span><br><b>${esc(table)}</b></div>
     <div><span>التاريخ والوقت</span><br><b>${date}<br>${time}</b></div>
   </div>
   <div class="invoice-body">${body}</div>
   <div class="invoice-grand">
     <div class="label">المجموع الكلي</div>
     <div class="value">${money(total)}</div>
   </div>
   <div class="invoice-thanks">شكراً لزيارتكم مطعم كيوي 🥝</div>
   <div class="invoice-note2">${issued
     ? 'نتمنى أن تكون تجربتكم جميلة ومميزة، وننتظركم دائماً بكل حب.'
     : 'راجعوا الحساب، ثم اضغطوا إصدار الفاتورة لإغلاق حساب الطاولة.'}</div>
 `;
}

function openEditOrder(id){
 const o=allOrders.find(x=>x.id===id);
 if(!o){ alert('الطلب غير موجود.'); return; }
 const items=itemList(o).map(x=>({
   name:String(x.name??x.title??''),
   qty:num(x.qty??x.quantity??1),
   price:num(x.price)
 }));
 if(!items.length){
   items.push({name:String(o.order??''),qty:1,price:num(o.total)});
 }
 document.getElementById('editOrderTitle').textContent='✏️ تعديل الطلب — طاولة '+tableOf(o);
 const box=document.getElementById('editItems');
 box.innerHTML='';
 items.forEach(it=>addEditRow(it.name,it.qty,it.price));
 document.getElementById('editOrderModal').dataset.orderId=id;
 document.getElementById('editOrderModal').style.display='block';
}

function addEditRow(name='',qty=1,price=0){
 const box=document.getElementById('editItems');
 const row=document.createElement('div');
 row.className='edit-row';
 row.dataset.menuName=String(name||'').trim();
 row.innerHTML=`
   <input class="edit-name" placeholder="اسم الصنف" value="${escAttr(name)}">
   <input class="edit-qty" type="hidden" value="${Math.max(1,num(qty)||1)}">
   <div class="qty-view">الكمية: <b>${Math.max(1,num(qty)||1)}</b></div>
   <input class="edit-price" type="number" min="0" step="1" value="${num(price)}">
   <button type="button" onclick="this.parentElement.remove()">🗑️</button>
 `;
 box.appendChild(row);
}

function increaseEditRowQty(row){
 const q=row.querySelector('.edit-qty');
 const view=row.querySelector('.qty-view b');
 const next=Math.max(1,num(q?.value)||1)+1;
 if(q) q.value=next;
 if(view) view.textContent=next;
}

function escAttr(v){
 return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let captainMenuItems=[];
let captainMenuLoaded=false;

async function openCaptainMenu(){
 const modal=document.getElementById('menuModal');
 modal.style.display='block';
 const list=document.getElementById('captainMenuList');
 list.innerHTML='<div class="menu-empty">جاري فتح المنيو…</div>';
 try{
   if(!captainMenuLoaded){
     const res=await fetch('index.html',{cache:'no-store'});
     if(!res.ok) throw new Error('تعذر فتح صفحة المنيو');
     const html=await res.text();
     const doc=new DOMParser().parseFromString(html,'text/html');
     const cards=[...doc.querySelectorAll('.dish-item[data-name][data-price]')];
     captainMenuItems=cards.map((el,i)=>{
       const section=el.closest('section');
       const h=section?.querySelector('h2 .heading-ar, h2');
       return {
         id:i,
         name:(el.dataset.name||'').trim(),
         price:parseMenuPrice(el.dataset.price||''),
         category:(h?.textContent||'المنيو').trim()
       };
     }).filter(x=>x.name);
     captainMenuLoaded=true;
   }
   renderCaptainMenu('');
 }catch(e){
   console.error(e);
   list.innerHTML='<div class="menu-empty">تعذر فتح المنيو حالياً.</div>';
 }
}

function parseMenuPrice(v){
 const n=String(v).replace(/[^0-9.]/g,'');
 return Number(n)||0;
}

function renderCaptainMenu(q){
 const list=document.getElementById('captainMenuList');
 const term=String(q||'').trim().toLowerCase();
 const items=captainMenuItems.filter(x=>!term || x.name.toLowerCase().includes(term) || x.category.toLowerCase().includes(term));
 if(!items.length){list.innerHTML='<div class="menu-empty">ماكو صنف مطابق للبحث.</div>';return;}
 list.innerHTML=items.map(x=>`<div class="menu-item">
   <div class="menu-name">${esc(x.name)}</div>
   <div class="menu-cat">${esc(x.category)}</div>
   <div class="menu-price">${money(x.price)}</div>
   <button type="button" onclick="addMenuItemToEdit(${x.id})">➕ إضافة للطلب</button>
 </div>`).join('');
}

function addMenuItemToEdit(menuId){
 const item=captainMenuItems.find(x=>x.id===menuId);
 if(!item)return;
 const rows=[...document.querySelectorAll('#editItems .edit-row')];
 const existing=rows.find(r=>String(r.querySelector('.edit-name')?.value||'').trim()===String(item.name).trim());
 if(existing){
   increaseEditRowQty(existing);
 }else{
   addEditRow(item.name,1,item.price);
 }
 renderCaptainMenu(document.querySelector('.menu-search')?.value||'');
}

function closeCaptainMenu(){
 document.getElementById('menuModal').style.display='none';
}

function filterCaptainMenu(v){renderCaptainMenu(v);}

function closeEditOrder(){
 document.getElementById('editOrderModal').style.display='none';
 document.getElementById('editItems').innerHTML='';
}

async function saveEditOrder(){
 const id=document.getElementById('editOrderModal').dataset.orderId;
 const o=allOrders.find(x=>x.id===id);
 if(!o){ alert('الطلب غير موجود.'); return; }

 const rows=[...document.querySelectorAll('#editItems .edit-row')];
 const items=rows.map(r=>({
   name:r.querySelector('.edit-name').value.trim(),
   qty:Math.max(1, num(r.querySelector('.edit-qty').value)),
   price:Math.max(0, num(r.querySelector('.edit-price').value))
 })).filter(x=>x.name);

 if(!items.length){ alert('لازم يبقى صنف واحد على الأقل بالطلب.'); return; }

 const total=items.reduce((sum,x)=>sum+x.price*x.qty,0);
 const payload={
   items:items,
   total:total,
   captainEdited:true,
   captainEditedAt:firebase.firestore.FieldValue.serverTimestamp()
 };
 if(Array.isArray(o.orderItems) && !Array.isArray(o.items)) delete payload.items, payload.orderItems=items;

 try{
   await db.collection('orders').doc(id).update(payload);
   alert('تم تعديل الطلب وإضافة الأصناف بنجاح ✅');
   closeEditOrder();
 }catch(e){
   console.error(e);
   alert('تعذر حفظ تعديل الطلب: '+(e.message||'خطأ'));
 }
}


function showInvoice(table){
 const orders=allOrders.filter(o=>tableOf(o)===String(table));
 if(!orders.length){ alert('ماكو طلبات بهذه الطاولة.'); return; }
 const total=orders.reduce((s,o)=>s+orderTotal(o),0);
 const invoiceNumber='INV-'+Date.now();

 document.getElementById('invoiceTitle').textContent='🧾 فاتورة حساب — طاولة '+table;
 document.getElementById('invoiceContent').innerHTML=`
   <div id="invoicePaper">${buildInvoiceHtml(table,orders,total,invoiceNumber,false)}</div>
   <div class="invoice-actions">

   </div>
 `;

}

function printCurrentInvoice(){

 if(!paper) return;
 const w=window.open('','_blank','width=760,height=900');
 if(!w){ alert('المتصفح منع نافذة الطباعة. اسمح بالنوافذ المنبثقة ثم جرّب مرة ثانية.'); return; }
 w.document.open();
 w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>فاتورة كيوي</title>
 <style>
 body{font-family:Arial,sans-serif;background:#fff;margin:0;color:#222}
 .invoice-top{background:#173f2b;color:#fff;padding:26px 20px;text-align:center}
 .invoice-logo{font-size:34px;font-weight:1000}.invoice-sub{font-size:14px;opacity:.9;margin-top:5px}

 @page{size:A4;margin:10mm}
 </style></head><body>${paper.innerHTML}</body></html>`);

async function issueInvoice(table, invoiceNumber){
 const orders=allOrders.filter(o=>tableOf(o)===String(table));
 if(!orders.length){ alert('ماكو طلبات بهذه الطاولة.'); return; }

 const total=orders.reduce((s,o)=>s+orderTotal(o),0);
 if(!confirm('إصدار فاتورة بقيمة '+money(total)+' وإغلاق حساب الطاولة؟')) return;

 try{
   document.getElementById('status').textContent='جاري إصدار الفاتورة...';
   const batch=db.batch();

   orders.forEach(o=>{
     batch.update(db.collection('orders').doc(o.id),{
       status:'billed',
       billUploaded:true,
       billType:'electronic',
       invoiceNumber:invoiceNumber,
       invoiceTable:String(table),
       invoiceTotal:total,
       invoiceItems:itemList(o),
       billedAt:firebase.firestore.FieldValue.serverTimestamp()
     });
   });

   batch.set(db.collection('invoices').doc(invoiceNumber),{
     invoiceNumber:invoiceNumber,
     table:String(table),
     total:total,
     orders:orders.map(o=>({
       orderId:o.id,
       total:orderTotal(o),
       items:itemList(o),
       status:o.status
     })),
     createdAt:firebase.firestore.FieldValue.serverTimestamp(),
     type:'electronic'
   });

   await batch.commit();

   document.getElementById('invoiceContent').innerHTML=`
     <div id="invoicePaper">${buildInvoiceHtml(table,orders,total,invoiceNumber,true)}</div>
     <div class="invoice-actions">
       <button class="gold" onclick="printCurrentInvoice()">🖨️ طباعة / حفظ PDF</button>
       <button class="primary" onclick="finishInvoice('${esc(table)}')">تم ✓</button>
     </div>
   `;
   document.getElementById('invoiceModal').style.display='block';
   document.getElementById('invoiceTitle').textContent='🧾 تم إصدار الفاتورة — طاولة '+table;
   document.getElementById('status').textContent='تم إصدار الفاتورة وحفظها بنجاح ✅';
   closeTable();
 }catch(e){
   console.error(e);
   alert('تعذر إصدار الفاتورة: '+(e.message||'خطأ'));
   document.getElementById('status').textContent='تعذر إصدار الفاتورة';
 }
}

function finishInvoice(table){
 closeInvoice();
}

function closeInvoice(){
 document.getElementById('invoiceModal').style.display='none';
}

async function acceptOrder(id){
 try{
   const ref=db.collection('orders').doc(id);
   const snap=await ref.get();
   if(!snap.exists) throw new Error('الطلب غير موجود');
   const o={id:snap.id,...snap.data()};
   const items=normalizedItems(o);
   const departments=[...new Set(items.map(x=>x.department).filter(Boolean))];
   const departmentStatus={...(o.departmentStatus||{})};
   departments.forEach(d=>{ if(departmentStatus[d]!=='ready' && departmentStatus[d]!=='served') departmentStatus[d]='pending'; });
   await ref.update({
     items,
     departmentStatus,
     status:'approved',
     approvedAt:firebase.firestore.FieldValue.serverTimestamp(),
     routedToDepartmentsAt:firebase.firestore.FieldValue.serverTimestamp(),
     updatedAt:firebase.firestore.FieldValue.serverTimestamp()
   });
 }catch(e){
   alert('تعذر قبول الطلب: '+(e.message||'خطأ'));
 }
}

async function takeReady(id){
 try{
   await db.collection('orders').doc(id).update({
     status:'served',
     captainReceivedAt:firebase.firestore.FieldValue.serverTimestamp()
   });
 }catch(e){
   alert('تعذر استلام الطلب: '+(e.message||'خطأ'));
 }
}
