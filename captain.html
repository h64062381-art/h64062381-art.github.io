<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIWI — الكابتن</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:18px;text-align:center;position:sticky;top:0}
h1{margin:0;font-size:24px}
#status{padding:12px;text-align:center;color:#666}
#orders{padding:12px;max-width:700px;margin:auto}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}
.new{border-right:5px solid #16a34a}
.row{display:flex;justify-content:space-between;gap:10px;margin:7px 0}
.items{line-height:1.8;background:#fafafa;padding:10px;border-radius:10px}
button{border:0;border-radius:10px;padding:10px 16px;font-size:16px;cursor:pointer}
.refresh{background:#fff;color:#111}
.done{background:#111;color:#fff;width:100%;margin-top:10px}
.empty{text-align:center;padding:40px;color:#777}
</style>
</head>
<body>
<header>
  <h1>KIWI — الكابتن</h1>
  <button class="refresh" onclick="loadOrders()">تحديث</button>
  <button class="refresh" onclick="enableAlert()">🔔 تفعيل التنبيه</button>
</header>

<div id="status">جاري تحديث الطلبات...</div>
<div id="orders"></div>

<script>
const API='https://script.google.com/macros/s/AKfycbzUf8bqlvK_V_U66XOvXjh81LeszGXNSF1WDSoHo2H_S97_tw8ue3tBGkwwFpTn6hwm/exec';

let rows=[];
let audioCtx=null;
let audioEnabled=false;
let knownOrderIds=new Set();

function enableAlert(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    audioEnabled=true;
    playAlert();
    document.getElementById('status').textContent='🔔 التنبيه الصوتي مفعّل';
    setTimeout(()=>loadOrders(),300);
  }catch(e){
    document.getElementById('status').textContent='فعّل صوت الآيفون ثم جرّب مرة ثانية';
  }
}

function playAlert(){
  if(!audioEnabled || !audioCtx) return;
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='square';
  osc.frequency.setValueAtTime(880,now);
  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(0.9,now+0.03);
  gain.gain.setValueAtTime(0.9,now+2.8);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+3);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(now); osc.stop(now+3.05);
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function render(){
  const box=document.getElementById('orders');
  if(!rows.length){
    box.innerHTML='<div class="empty">ماكو طلبات حالياً</div>';
    return;
  }

  box.innerHTML=rows.map((r,i)=>{
    const table=r.table || r.table_number || '—';
    const order=r.order || r.items || '—';
    const total=r.total || 0;
    const status=r.status || 'جديد';

    return `
      <div class="card ${status==='جديد'?'new':''}">
        <div class="row"><b>الطاولة</b><b>${esc(table)}</b></div>
        <div class="row"><span>الحالة</span><span>${esc(status)}</span></div>
        <div class="items">${esc(order)}</div>
        <div class="row"><b>المجموع</b><b>${esc(total)} د.ع</b></div>
        ${status==='جديد' ? `<button class="done" onclick="markDone(${i})">تم تجهيز الطلب</button>` : ''}
      </div>`;
  }).join('');
}

async function loadOrders(){
  const status=document.getElementById('status');
  status.textContent='جاري تحديث الطلبات...';

  try{
    const res=await fetch(API+'?t='+Date.now());
    const data=await res.json();
    const incoming=data.orders || [];
    const incomingIds=new Set(incoming.map((r,i)=>String(r.id || r.order_id || r.createdAt || (r.table||'')+'-'+i)));
    const hasNew=[...incomingIds].some(id=>!knownOrderIds.has(id));
    rows=incoming;
    render();
    if(audioEnabled && knownOrderIds.size && hasNew) playAlert();
    knownOrderIds=incomingIds;
    status.textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-IQ');
  }catch(e){
    status.textContent='تعذر جلب الطلبات حالياً';
    document.getElementById('orders').innerHTML=
      '<div class="empty">تأكد أن Google Apps Script يدعم GET للطلبات.</div>';
  }
}

function markDone(i){
  if(rows[i]) rows[i].status='تم التجهيز';
  render();
}

loadOrders();
setInterval(loadOrders,2000);
</script>
</body>
</html>
