<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | 📊 التقارير الموحدة — بيانات النظام الفعلية</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="kiwi-erp-unified.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font-family:Arial,Tahoma}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#15181d;border:1px solid #292e35;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}label{font-size:12px;color:#b8bec7}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #343a43;background:#0e1115;color:#fff}button{cursor:pointer;font-weight:700;background:#e8e8e8;color:#111}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff;text-decoration:none}.stat b{display:block;font-size:23px;margin-top:5px}.msg{padding:10px;border-radius:10px;background:#171b21;margin:10px 0}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>📊 التقارير الموحدة — بيانات النظام الفعلية</h1><div class="grid" id="stats"></div><div class="card"><h3>آخر الحركات</h3><div id="moves"></div></div></div><script>Promise.all([db.collection('inventory').get(),db.collection('purchases').get(),db.collection('waste').get(),db.collection('expenses').get(),db.collection('cash_movements').get(),db.collection('journal_entries').get(),db.collection('orders').get()]).then(([i,p,w,e,c,j,o])=>{let inv=i.docs.map(x=>x.data()),pv=p.docs.reduce((s,x)=>s+(+x.data().total||0),0),wv=w.docs.reduce((s,x)=>s+(+x.data().value||0),0),ev=e.docs.reduce((s,x)=>s+(+x.data().amount||0),0),cb=c.docs.reduce((s,x)=>s+(['sale','deposit'].includes(x.data().type)?+x.data().amount:-+x.data().amount),0),sales=o.docs.reduce((s,x)=>s+(+x.data().total||0),0),iv=inv.reduce((s,x)=>s+(+x.qty||0)*(+(x.price||x.cost)||0),0);stats.innerHTML=[['قيمة المخزون',KIWI_UNIFIED.money(iv)],['المبيعات',KIWI_UNIFIED.money(sales)],['المشتريات',KIWI_UNIFIED.money(pv)],['الهدر',KIWI_UNIFIED.money(wv)],['المصروفات',KIWI_UNIFIED.money(ev)],['الصندوق',KIWI_UNIFIED.money(cb)],['القيود',j.size],['الأصناف',i.size]].map(x=>`<div class="card stat">${x[0]}<b>${x[1]}</b></div>`).join('')});db.collection('stock_movements').orderBy('createdAt','desc').limit(30).onSnapshot(s=>moves.innerHTML=s.docs.map(d=>{let x=d.data();return `<p>${x.type} — ${x.quantity} — قبل ${x.beforeQty} → بعد ${x.afterQty}</p>`}).join('')||'<p>لا توجد حركات</p>')</script></body></html>
