<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقارير الموحدة</title><script src="kiwi-restaurant-engine.js"></script><style>body{background:#0b0d10;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#15181d;border:1px solid #292e35;border-radius:15px;padding:16px}.stat b{display:block;font-size:24px;margin-top:7px}.muted{color:#aeb5bf}a{color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>📊 التقارير الموحدة</h1><div class="grid" id="g"></div><div class="card"><h2>حركة المخزون</h2><div id="moves"></div></div></div><script>let s=KIWI_ERP_V2.summary(),p=KIWI_ERP_V2.read('purchases'),w=KIWI_ERP_V2.read('waste'),c=KIWI_ERP_V2.read('cash'),j=KIWI_ERP_V2.read('journal'),items=KIWI_ERP_V2.read('items');let purchaseTotal=p.reduce((a,x)=>a+(+x.total||0),0),wasteTotal=w.reduce((a,x)=>a+(+x.value||0),0),cashBal=c.reduce((a,x)=>a+(['sale','deposit'].includes(x.type)?+x.amount:-x.amount),0),stockValue=items.reduce((a,x)=>a+(+x.qty||0)*(+x.cost||0),0);g.innerHTML=[['قيمة المخزون',KIWI_ERP_V2.money(stockValue)],['إجمالي المشتريات',KIWI_ERP_V2.money(purchaseTotal)],['قيمة الهدر',KIWI_ERP_V2.money(wasteTotal)],['رصيد الصندوق',KIWI_ERP_V2.money(cashBal)],['عدد الأصناف',s.items],['عدد الموردين',s.suppliers],['عدد الوصفات',s.recipes],['القيود',j.length]].map(x=>`<div class="card stat">${x[0]}<b>${x[1]}</b></div>`).join('');moves.innerHTML=KIWI_ERP_V2.read('stockMoves').slice().reverse().slice(0,50).map(x=>`<p class="muted">${x.type} — كمية ${x.qty} — قبل ${x.beforeQty} — بعد ${x.afterQty}</p>`).join('')||'<p>لا توجد حركات.</p>';</script></html>
