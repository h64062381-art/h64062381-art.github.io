<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI - الدفع الإلكتروني</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f1;font-family:Arial,sans-serif;color:#263125}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(460px,100%);background:#fff;border-radius:26px;padding:24px;box-shadow:0 18px 60px #26312518;border:1px solid #d9d8cd}.logo{text-align:center;font-size:30px;font-weight:950;color:#173f2b}.sub{text-align:center;color:#777;font-size:12px;margin:7px 0 18px}.amount{background:#eef3e9;border-radius:18px;padding:16px;text-align:center;margin-bottom:16px}.amount small{display:block;color:#68705f;font-size:11px}.amount strong{display:block;font-size:28px;color:#173f2b;margin-top:5px}.secure{padding:13px;border-radius:14px;background:#faf8f0;border:1px solid #e1d7b8;font-size:11px;line-height:1.8;color:#67624f}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;font:inherit;font-weight:950;cursor:pointer}.primary{background:#173f2b;color:#fff}.secondary{background:#eceee8;color:#3f473b}.warn{margin-top:12px;color:#8a5a00;font-size:11px;line-height:1.7;text-align:center}.hidden{display:none}.success{text-align:center}.success .icon{font-size:54px}.success h2{margin:8px 0}.success p{color:#666;line-height:1.8;font-size:13px}
</style></head><body><main class="wrap"><section class="card" id="payCard"><div class="logo">🥝 KIWI</div><div class="sub">الدفع الإلكتروني للطلب</div><div class="amount"><small>المبلغ المطلوب</small><strong id="amount">0 د.ع</strong></div><div class="secure">🔒 <b>دفع آمن</b><br>سيتم تنفيذ الدفع عبر بوابة الدفع الرسمية للمطعم. لا تكتب رقم البطاقة أو CVV أو PIN داخل هذه الصفحة.</div><button class="btn primary" id="payNow">الدفع الآن</button><button class="btn secondary" onclick="history.back()">رجوع للطلب</button><div class="warn" id="gatewayNote"></div></section><section class="card success hidden" id="success"><div class="icon">✅</div><h2>تم تسجيل الدفع</h2><p>تم تحديث حالة الطلب إلى «مدفوع» ويمكن للكاشير متابعة الطلب.</p><button class="btn primary" onclick="location.href='index.html'">العودة للمنيو</button></section></main><script>
const q=new URLSearchParams(location.search), amount=Number(q.get('amount')||0), returnTo=q.get('returnTo')||'index.html';document.getElementById('amount').textContent=amount.toLocaleString('en-US')+' د.ع';
// ضع هنا فقط رابط بوابة الدفع الرسمية التي يوفرها البنك/مزود الدفع للمطعم. لا تضع رقم بطاقة في الكود.
const PAYMENT_GATEWAY_URL='';
const note=document.getElementById('gatewayNote');const btn=document.getElementById('payNow');
if(!PAYMENT_GATEWAY_URL){note.textContent='واجهة الدفع جاهزة، لكن يلزم رابط الدفع الرسمي من البنك/مزود الدفع حتى يعمل زر «الدفع الآن» فعلياً.';btn.disabled=true;}
else btn.onclick=()=>{const u=new URL(PAYMENT_GATEWAY_URL,location.href);u.searchParams.set('amount',String(amount));u.searchParams.set('currency','IQD');u.searchParams.set('return_url',location.href);location.href=u.toString()};
</script></body></html>
