<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI — QR الإدارة</title><style>body{font-family:Arial;background:#f7f1e5;margin:0;display:grid;place-items:center;min-height:100vh;color:#151412}.card{background:#fff;padding:30px;border-radius:20px;text-align:center;box-shadow:0 10px 40px #0001;max-width:460px;width:calc(100% - 40px)}#qrcode{margin:22px auto;width:256px;height:256px}button{padding:12px 20px;border:0;border-radius:10px;background:#1f5a3c;color:#fff;font-size:16px;cursor:pointer}small{color:#777;display:block;margin-top:12px;word-break:break-all}.warn{margin:12px 0;padding:10px;border-radius:10px;background:#fff4d8;font-size:12px}</style></head><body><div class="card"><h1>🧑‍💼 QR الإدارة</h1><p>هذا الباركود خاص بالمدير فقط، ولا يظهر داخل منيو الزبون.</p><div id="qrcode"></div><button onclick="window.print()">🖨️ طباعة QR الإدارة</button><div class="warn">بعد رفع المشروع على Netlify أو أي استضافة، افتح هذه الصفحة مرة واحدة واطبع الباركود.</div><small id="url"></small></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const u=new URL('admin.html',location.href);document.getElementById('url').textContent=u.href;new QRCode(document.getElementById('qrcode'),{text:u.href,width:256,height:256,correctLevel:QRCode.CorrectLevel.H});</script></body></html>
