<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI — بصمة الدوام</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f4f1e8,#fffdf8);color:#17251b;font-family:Cairo,Tahoma,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 12px 50px}.head{background:linear-gradient(135deg,#173f2b,#284f38);color:#fff;border:1px solid #c9a45b;border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 12px 30px #173f2b18}.head h1{margin:0;font-size:27px}.head p{margin:6px 0 0;color:#e9e2d4;font-size:12px}.card{background:#fff;border:1px solid #ddd6c5;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #28351a10}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}label{display:block;font-weight:800;font-size:12px;margin:8px 0 5px}input,select{width:100%;border:1px solid #cfc8b7;border-radius:12px;padding:12px;font:inherit;background:#fff}button{border:0;border-radius:13px;padding:12px 16px;font:inherit;font-weight:900;cursor:pointer}.primary{background:#173f2b;color:#fff}.danger{background:#8d2e2e;color:#fff}.gold{background:#c9a45b;color:#17130b}.muted{color:#706b61;font-size:12px}.status{padding:12px;border-radius:13px;background:#f0f3e9;margin-top:12px;font-weight:800}.clock{font-size:34px;font-weight:900;text-align:center;color:#173f2b;margin:8px}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:#eee9dc;color:#173f2b}.tabs button.active{background:#173f2b;color:#fff}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:900}.late{background:#ffe1df;color:#8d2e2e}.ontime{background:#e3f1df;color:#35612f}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px 6px;border-bottom:1px solid #e2dccd;text-align:right}.danger-text{color:#9a2d2d;font-weight:900}.success-text{color:#35612f;font-weight:900}.mini{font-size:11px;color:#777}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}</style></head><body><div class="wrap"><div class="head"><h1>🕘 بصمة دوام موظفي KIWI</h1><p>تسجيل بداية ونهاية الدوام ومتابعة التأخير.</p></div><div class="tabs"><button id="tabStaff" class="active" onclick="showTab('staff')">بصمة الموظف</button><button id="tabAdmin" onclick="showTab('admin')">إدارة الدوام</button></div><section id="staff"><div class="card"><div class="clock" id="clock">--:--:--</div><div class="row"><div><label>اسم الموظف</label><select id="staffSelect"><option value="">اختار اسمك</option></select></div><div><label>PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="الرمز الشخصي"></div></div><div class="actions"><button class="primary" onclick="punch('in')">🟢 بصمة بداية الدوام</button><button class="danger" onclick="punch('out')">🔴 بصمة نهاية الدوام</button></div><div id="staffStatus" class="status">اختار اسمك وأدخل الـPIN.</div></div></section><section id="admin" class="hidden"><div class="card"><h2>إدارة الموظفين</h2><p class="muted">هذه الصفحة خاصة بالمدير. غيّر PIN الإدارة قبل الاستخدام الفعلي.</p><label>PIN الإدارة</label><input id="adminPin" type="password" inputmode="numeric" placeholder="PIN الإدارة"><div class="actions"><button class="primary" onclick="adminLogin()">دخول</button></div><div id="adminPanel" class="hidden"><hr><div class="row"><div><label>اسم الموظف</label><input id="newName" placeholder="مثال: أحمد"></div><div><label>القسم</label><input id="newDept" placeholder="مثال: كاشير"></div><div><label>وقت بداية الدوام</label><input id="newStart" type="time" value="16:00"></div><div><label>السماح بالدقائق</label><input id="newGrace" type="number" min="0" value="10"></div><div><label>PIN الموظف</label><input id="newPin" inputmode="numeric" maxlength="8" placeholder="1234"></div></div><div class="actions"><button class="gold" onclick="addStaff()">➕ إضافة موظف</button></div><div id="staffList"></div><hr><h3>سجل اليوم</h3><div class="actions"><button class="primary" onclick="loadAttendance()">🔄 تحديث السجل</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>الموظف</th><th>البداية</th><th>النهاية</th><th>التأخير</th></tr></thead><tbody id="attBody"></tbody></table></div></div></div></section></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd072d9d7171a2d6ec4d73",measurementId:"G-K916WX9ZH8"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const ADMIN_PIN='2468';let staff=[];let admin=false;const ready=firebase.auth().signInAnonymously().catch(()=>null);function dateKey(){const d=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Baghdad'}));return d.toISOString().slice(0,10)}function now(){return new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Baghdad',hour12:false})}function minutes(t){if(!t)return 0;const [h,m]=t.split(':').map(Number);return h*60+m}function showTab(t){document.getElementById('staff').classList.toggle('hidden',t!=='staff');document.getElementById('admin').classList.toggle('hidden',t!=='admin');document.getElementById('tabStaff').classList.toggle('active',t==='staff');document.getElementById('tabAdmin').classList.toggle('active',t==='admin')}setInterval(()=>document.getElementById('clock').textContent=now(),1000);async function loadStaff(){await ready;const s=await db.collection('kiwi_attendance_staff').where('active','==',true).get();staff=s.docs.map(d=>({id:d.id,...d.data()}));const sel=document.getElementById('staffSelect');sel.innerHTML='<option value="">اختار اسمك</option>'+staff.map(x=>`<option value="${x.id}">${x.name} — ${x.department||''}</option>`).join('');if(admin)renderStaff()}async function punch(type){const id=document.getElementById('staffSelect').value,pin=document.getElementById('pin').value.trim(),msg=document.getElementById('staffStatus');const s=staff.find(x=>x.id===id);if(!s||pin!==String(s.pin)){msg.textContent='❌ الاسم أو PIN غير صحيح.';return}await ready;const key=dateKey(),ref=db.collection('kiwi_attendance').doc(key+'_'+id),snap=await ref.get(),data=snap.exists?snap.data():{staffId:id,name:s.name,department:s.department||'',date:key};if(type==='in'){if(data.inTime){msg.textContent='⚠️ أنت مسجل بداية الدوام بالفعل: '+data.inTime;return}const current=minutes(now().slice(0,5)),start=minutes(s.startTime||'00:00'),late=Math.max(0,current-start-(Number(s.grace)||0));data.inTime=now().slice(0,5);data.lateMinutes=late;data.status=late>0?'late':'ontime';await ref.set(data,{merge:true});msg.innerHTML=late>0?`⚠️ تم تسجيل البصمة. متأخر <b>${late}</b> دقيقة.`:'✅ تم تسجيل بداية الدوام بدون تأخير.'}else{if(!data.inTime){msg.textContent='⚠️ لازم تسجل بداية الدوام أولاً.';return}if(data.outTime){msg.textContent='⚠️ تم تسجيل نهاية الدوام مسبقًا: '+data.outTime;return}data.outTime=now().slice(0,5);await ref.set(data,{merge:true});msg.textContent='✅ تم تسجيل نهاية الدوام: '+data.outTime}document.getElementById('pin').value=''}function adminLogin(){if(document.getElementById('adminPin').value!==ADMIN_PIN){alert('PIN الإدارة غير صحيح');return}admin=true;document.getElementById('adminPanel').classList.remove('hidden');loadStaff();loadAttendance()}async function addStaff(){const name=document.getElementById('newName').value.trim(),department=document.getElementById('newDept').value.trim(),startTime=document.getElementById('newStart').value,grace=Number(document.getElementById('newGrace').value||0),pin=document.getElementById('newPin').value.trim();if(!name||!pin){alert('اكتب اسم الموظف وPIN');return}await db.collection('kiwi_attendance_staff').add({name,department,startTime,grace,pin,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('newName').value='';document.getElementById('newPin').value='';await loadStaff()}function renderStaff(){const box=document.getElementById('staffList');box.innerHTML='<h3>الموظفون</h3>'+staff.map(x=>`<div class="card"><b>${x.name}</b> <span class="mini">${x.department||''}</span><br><span class="mini">الدوام: ${x.startTime||'غير محدد'} — سماح: ${x.grace||0} دقيقة</span><div class="actions"><button class="danger" onclick="disableStaff('${x.id}')">تعطيل</button></div></div>`).join('')}async function disableStaff(id){if(!confirm('تعطيل هذا الموظف؟'))return;await db.collection('kiwi_attendance_staff').doc(id).update({active:false});loadStaff()}async function loadAttendance(){const body=document.getElementById('attBody');body.innerHTML='';const s=await db.collection('kiwi_attendance').where('date','==',dateKey()).get();s.forEach(d=>{const x=d.data();const tr=document.createElement('tr');tr.innerHTML=`<td><b>${x.name||''}</b><br><span class="mini">${x.department||''}</span></td><td>${x.inTime||'—'}</td><td>${x.outTime||'—'}</td><td class="${x.lateMinutes?'danger-text':'success-text'}">${x.lateMinutes?x.lateMinutes+' دقيقة':'لا يوجد'}</td>`;body.appendChild(tr)});if(!body.children.length)body.innerHTML='<tr><td colspan="4">لا توجد بصمات اليوم.</td></tr>'}loadStaff();</script></body></html>
