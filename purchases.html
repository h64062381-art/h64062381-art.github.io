<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🛒 المشتريات</title><link rel="stylesheet" href="restaurant-system.css"><script src="restaurant-system-core.js"></script><script src="module-generic.js"></script></head><body><div class="wrap"><header class="head"><div><h1>🛒 المشتريات</h1><p>فواتير شراء ومتابعة الكميات والتكلفة والمورد.</p></div><div class="actions"><a class="btn light" href="restaurant-system.html">← كل الأنظمة</a><button class="btn gold" onclick="KRS.backup()">💾 Backup</button></div></header><div class="card"><div class="row" style="justify-content:space-between;align-items:end"><div class="search"><label>بحث</label><input id="search" placeholder="ابحث في السجلات..."></div><div class="muted">البيانات محفوظة محلياً ولا تؤثر على ملفات النظام القديم.</div></div></div><div class="card"><h2>إضافة / تعديل</h2><div class="form" id="form"></div></div><div class="card tablewrap"><table><thead><tr><th>الفاتورة</th><th>المورد</th><th>الصنف</th><th>الكمية</th><th>التكلفة</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>setupCRUD({key:'purchases',title:'🛒 المشتريات',subtitle:'فواتير شراء ومتابعة الكميات والتكلفة والمورد.',fields:[{key:'invoice',label:'رقم الفاتورة',placeholder:'PUR-001'},{key:'supplier',label:'المورد'},{key:'item',label:'الصنف'},{key:'qty',label:'الكمية',type:'number'},{key:'unitCost',label:'تكلفة الوحدة',type:'number'},{key:'status',label:'الحالة',type:'select',options:["مدفوع", "آجل", "جزئي"]},{key:'note',label:'ملاحظات',type:'textarea',wide:true}],columns:[{key:'invoice'},{key:'supplier'},{key:'item'},{key:'qty'},{key:'unitCost'},{key:'status'}]});</script></body></html>
