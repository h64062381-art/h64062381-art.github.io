<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صندوق الكاشير</title><script src="kiwi-restaurant-engine.js"></script><style>body{background:#0b0d10;color:#fff;font-family:Arial;padding:20px}.wrap{max-width:1000px;margin:auto}.card{background:#15181d;border:1px solid #292e35;border-radius:15px;padding:15px;margin-bottom:14px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{padding:10px;border-radius:9px;border:1px solid #343a43;background:#0e1115;color:#fff;width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff}@media(max-width:700px){.form{grid-template-columns:1fr 1fr}}</style><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>💰 صندوق الكاشير</h1><div class="card"><div class="form"><label>نوع الحركة<select id="type"><option value="sale">قبض/مبيعات</option><option value="expense">صرف</option><option value="deposit">إيداع</option><option value="withdraw">سحب</option></select></label><label>المبلغ<input id="amount" type="number"></label><label>البيان<input id="note"></label><label>المستخدم<input id="user"></label><button onclick="save()">تسجيل الحركة</button></div></div><div class="card"><h3>رصيد الحركات</h3><h2 id="bal">0</h2><table><thead><tr><th>النوع</th><th>المبلغ</th><th>البيان</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>function save(){let a=+amount.value||0;if(!a)return;KIWI_ERP_V2.add('cash',{type:type.value,amount:a,note:note.value,user:user.value});amount.value=note.value='';render()}function render(){let a=KIWI_ERP_V2.read('cash'),b=a.reduce((s,x)=>s+(['sale','deposit'].includes(x.type)?x.amount:-x.amount),0);bal.textContent=KIWI_ERP_V2.money(b);rows.innerHTML=a.slice().reverse().map(x=>`<tr><td>${x.type}</td><td>${KIWI_ERP_V2.money(x.amount)}</td><td>${KIWI_ERP_V2.esc(x.note)}</td><td>${new Date(x.createdAt).toLocaleString('ar-IQ')}</td></tr>`).join('')}render();</script></html>
