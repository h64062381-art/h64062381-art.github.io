<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | 💰 صندوق الكاشير — موحد</title><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="kiwi-erp-unified.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font-family:Arial,Tahoma}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#15181d;border:1px solid #292e35;border-radius:16px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}label{font-size:12px;color:#b8bec7}input,select,button{width:100%;padding:11px;border-radius:10px;border:1px solid #343a43;background:#0e1115;color:#fff}button{cursor:pointer;font-weight:700;background:#e8e8e8;color:#111}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #292e35;text-align:right}a{color:#fff;text-decoration:none}.stat b{display:block;font-size:23px;margin-top:5px}.msg{padding:10px;border-radius:10px;background:#171b21;margin:10px 0}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><p><a href="restaurant-system-full.html">← النظام الكامل</a></p><h1>💰 صندوق الكاشير — موحد</h1><div class="card"><div class="form"><label>نوع الحركة<select id="type"><option value="sale">قبض/مبيعات</option><option value="expense">صرف</option><option value="deposit">إيداع</option><option value="withdraw">سحب</option></select></label><label>المبلغ<input id="amount" type="number"></label><label>البيان<input id="note"></label><label>المستخدم<input id="user"></label><button onclick="save()">تسجيل الحركة</button></div></div><div class="card"><h2 id="bal">0</h2><table><thead><tr><th>النوع</th><th>المبلغ</th><th>البيان</th><th>المستخدم</th><th>التاريخ</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let data=[];KIWI_UNIFIED.cash.orderBy('createdAt','desc').onSnapshot(s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));render()});async function save(){let a=+amount.value||0;if(!a)return;let r=await KIWI_UNIFIED.cash.add({type:type.value,amount:a,note:note.value,user:user.value,createdAt:KIWI_UNIFIED.ts()});let debit=['expense','withdraw'].includes(type.value),account=debit?'6000':'1100';await db.collection('journal_entries').doc('CASH-'+r.id).set({referenceType:'cash',referenceId:r.id,lines:debit?[{account, debit:a,credit:0},{account:'1100',debit:0,credit:a}]:[{account:'1100',debit:a,credit:0},{account:'4100',debit:0,credit:a}],totalDebit:a,totalCredit:a,createdAt:KIWI_UNIFIED.ts()});await KIWI_UNIFIED.audit('cash_movement','cash',r.id,r);amount.value=note.value=user.value=''}function render(){let b=data.reduce((s,x)=>s+(['sale','deposit'].includes(x.type)?+x.amount:-+x.amount),0);bal.textContent=KIWI_UNIFIED.money(b);rows.innerHTML=data.map(x=>`<tr><td>${x.type}</td><td>${KIWI_UNIFIED.money(x.amount)}</td><td>${KIWI_UNIFIED.esc(x.note)}</td><td>${KIWI_UNIFIED.esc(x.user)}</td><td>${KIWI_UNIFIED.date(x.createdAt)}</td></tr>`).join('')}</script></body></html>
