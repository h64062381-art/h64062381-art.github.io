<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIWI | هدر المواد</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f5f5;font-family:Arial,Tahoma,sans-serif}header{padding:18px 20px;background:#15181d;border-bottom:1px solid #2a2f36;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:22px}.sub{color:#9da5af;font-size:12px;margin-top:4px}main{max-width:1200px;margin:20px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card{background:#15181d;border:1px solid #292e35;border-radius:16px;padding:15px}.stat b{display:block;font-size:25px;margin-top:6px}label{font-size:12px;color:#b8bec7;display:block;margin-bottom:6px}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #343a43;background:#0e1115;color:#fff;outline:none}textarea{min-height:80px;resize:vertical}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}.wide{grid-column:span 2}button{border:0;border-radius:10px;padding:11px 14px;background:#e8e8e8;color:#111;font-weight:700;cursor:pointer}button.alt{background:#252a31;color:#fff}button.danger{background:#8e2630;color:#fff}button.good{background:#1f7a52;color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.tablewrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid #282d34;text-align:right;font-size:13px}th{color:#aeb5bf;background:#12151a;position:sticky;top:0}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:#252a31;font-size:11px}.msg{padding:10px;border-radius:10px;background:#161a20;color:#aeb5bf;margin:10px 0}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:520px){.grid,.form{grid-template-columns:1fr}.wide{grid-column:span 1}}a{color:#fff;text-decoration:none}
button:disabled{opacity:.55;cursor:not-allowed}button{transition:transform .12s ease,opacity .12s ease}button:not(:disabled):active{transform:scale(.98)}.statusbar{margin:10px 0;padding:10px 12px;border-radius:10px;background:#161a20;color:#bfc6cf;display:none}.statusbar.show{display:block}.statusbar.ok{color:#8ee0b5}.statusbar.err{color:#ff9ea6}</style></head><body><noscript><div style="padding:15px;background:#8e2630;color:#fff;text-align:center">يرجى تفعيل JavaScript لاستخدام النظام.</div></noscript><header><div><h1>KIWI | هدر المواد</h1></div><div class="actions"><a href="systems.html"><button class="alt">كل الأنظمة</button></a><a href="admin.html"><button class="alt">لوحة المدير</button></a></div></header><main><div id="statusbar" class="statusbar"></div><div class="grid"><div class="card stat">سجلات الهدر<b id="c1">0</b></div><div class="card stat">إجمالي الكمية<b id="c2">0</b></div><div class="card stat">قيمة الهدر<b id="c3">0</b></div><div class="card stat">هذا الشهر<b id="c4">0</b></div></div>
<div class="card"><div class="form"><div><label>المادة</label><input id="item"></div><div><label>القسم</label><input id="dept"></div><div><label>الكمية</label><input id="qty" type="number" step="0.01"></div><div><label>الوحدة</label><input id="unit"></div><div><label>قيمة تقديرية</label><input id="value" type="number" step="0.01"></div><div><label>السبب</label><select id="reason"><option>تلف</option><option>انتهاء صلاحية</option><option>حرق/طبخ زائد</option><option>تحضير زائد</option><option>خطأ طلب</option><option>سبب آخر</option></select></div><div class="wide"><label>ملاحظات</label><textarea id="notes"></textarea></div><div><button class="good" onclick="save()">تسجيل الهدر</button></div></div></div>
<div class="card" style="margin-top:14px"><div class="toolbar"><input id="search" placeholder="بحث..." oninput="render()"><button class="alt" onclick="exportCSV()">تصدير CSV</button></div><div class="tablewrap"><table><thead><tr><th>المادة</th><th>القسم</th><th>الكمية</th><th>الوحدة</th><th>القيمة</th><th>السبب</th><th>الوقت</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>const firebaseConfig={apiKey:"AIzaSyAQ9WanobYNjUbozWQrhDBCT82-RqMMU4",authDomain:"kiwiresturant-30ff4.firebaseapp.com",projectId:"kiwiresturant-30ff4",storageBucket:"kiwiresturant-30ff4.firebasestorage.app",messagingSenderId:"329950339210",appId:"1:329950339210:web:bd0721a2d6ec4d73",measurementId:"G-K916WX9ZH8"};</script><script>
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();firebase.auth().signInAnonymously().catch(e=>console.warn(e));
const $=id=>document.getElementById(id);const status=(msg,ok=true)=>{const e=$("statusbar");if(!e)return;e.textContent=msg;e.className="statusbar show "+(ok?"ok":"err");clearTimeout(window.__st);window.__st=setTimeout(()=>e.className="statusbar",3500)};const money=n=>Number(n||0).toLocaleString("en-US")+" د.ع";
const dateStr=v=>v?.toDate?v.toDate().toLocaleString("ar-IQ"):new Date(v||Date.now()).toLocaleString("ar-IQ");
<script>let data=[],editId=null;const col=db.collection("waste");col.orderBy("createdAt","desc").onSnapshot(s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));render()});
async async function save(){let x={item:$("item").value.trim(),dept:$("dept").value.trim(),qty:+$("qty").value||0,unit:$("unit").value.trim(),value:+$("value").value||0,reason:$("reason").value,notes:$("notes").value.trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp()};if(!x.item||!x.qty)return status("أدخل المادة والكمية",false);try{if(editId){delete x.createdAt;await col.doc(editId).update(x);editId=null;status("تم تعديل سجل الهدر")}else{await col.add(x);status("تم تسجيل الهدر")}clear()}catch(e){status("تعذر حفظ سجل الهدر: "+e.message,false)}}
function clear(){["item","dept","qty","unit","value","notes"].forEach(x=>$(x).value="")}
function render(){let q=$("search").value.toLowerCase(),a=data.filter(x=>(x.item+" "+x.dept+" "+x.reason).toLowerCase().includes(q));let m=new Date().toISOString().slice(0,7);$("c1").textContent=data.length;$("c2").textContent=data.reduce((s,x)=>s+(+x.qty||0),0).toLocaleString();$("c3").textContent=money(data.reduce((s,x)=>s+(+x.value||0),0));$("c4").textContent=data.filter(x=>x.createdAt?.toDate&&x.createdAt.toDate().toISOString().slice(0,7)==m).length;$("rows").innerHTML=a.map(x=>`<tr><td>${esc(x.item)}</td><td>${esc(x.dept)}</td><td>${x.qty}</td><td>${esc(x.unit)}</td><td>${money(x.value)}</td><td>${esc(x.reason)}</td><td>${dateStr(x.createdAt)}</td><td><button class="alt" onclick="edit('${x.id}')">تعديل</button> <button class="danger" onclick="del('${x.id}')">حذف</button></td></tr>`).join("")||"<tr><td colspan=8>لا توجد سجلات</td></tr>"}
async function edit(id){let x=data.find(x=>x.id==id);if(!x)return;["item","dept","qty","unit","value","notes"].forEach(k=>$(k).value=x[k]??"");$("reason").value=x.reason||"تلف";editId=id;scrollTo(0,0);status("وضع التعديل مفعل")}\nasync function del(id){if(!confirm("حذف سجل الهدر؟"))return;try{await col.doc(id).delete();status("تم حذف سجل الهدر")}catch(e){status("تعذر الحذف: "+e.message,false)}}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function exportCSV(){let h=["المادة","القسم","الكمية","الوحدة","القيمة","السبب","الوقت"];let out=[h,...data.map(x=>[x.item,x.dept,x.qty,x.unit,x.value,x.reason,dateStr(x.createdAt)])].map(r=>r.map(v=>`"${String(v??"").replaceAll('"','""')}"`).join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+out],{type:"text/csv"}));a.download="kiwi-waste.csv";a.click()}</body></html>
